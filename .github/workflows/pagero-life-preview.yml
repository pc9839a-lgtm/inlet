name: Pagero Life Preview

on:
  pull_request:
    paths:
      - 'functions/life/**'
      - 'public/robots.txt'
      - '.github/workflows/pagero-life-preview.yml'
  workflow_dispatch:

concurrency:
  group: pagero-life-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Cloudflare preview
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --branch life-proxy-preview \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Preview $GITHUB_SHA" \
            2>&1 | tee /tmp/pagero-life-preview.log

          PREVIEW_URL="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev/?' /tmp/pagero-life-preview.log | tail -n 1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo 'Cloudflare preview URL was not detected.' >&2
            exit 1
          fi
          PREVIEW_URL="${PREVIEW_URL%/}"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "PAGERO_LIFE_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Diagnose and smoke test /life proxy
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PAGERO_LIFE_PREVIEW_URL"

          fetch_status() {
            local label="$1"
            local path="$2"
            local out="$3"
            local code
            code="$(curl -sS -L -o "$out" -w '%{http_code}' "$BASE$path" || true)"
            echo "$label $path -> $code"
            echo "$label=$code" >> /tmp/life-status.txt
            if [ "$code" != "200" ]; then
              echo "--- $label response preview ---"
              head -c 600 "$out" 2>/dev/null || true
              echo
            fi
          }

          for attempt in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/life-home.html -w '%{http_code}' "$BASE/life/" || true)"
            echo "home attempt $attempt -> $code"
            if [ "$code" = "200" ]; then
              echo "home=200" > /tmp/life-status.txt
              break
            fi
            sleep 2
          done

          fetch_status styles '/life/styles.css' /tmp/life-styles.css
          fetch_status sitemap '/life/sitemap.xml' /tmp/life-sitemap.xml
          fetch_status article '/life/car/car-inspection-period/' /tmp/life-article.html

          cat /tmp/life-status.txt
          grep -q '^home=200$' /tmp/life-status.txt
          grep -q '^styles=200$' /tmp/life-status.txt
          grep -q '^sitemap=200$' /tmp/life-status.txt
          grep -q '^article=200$' /tmp/life-status.txt

          grep -q '생활비서' /tmp/life-home.html
          grep -q 'https://pagero.kr/life/' /tmp/life-home.html
          grep -q 'https://pagero.kr/life/car/car-inspection-period/' /tmp/life-article.html
          grep -q 'https://pagero.kr/life/' /tmp/life-sitemap.xml

          if grep -q 'https://life.pagero.kr' /tmp/life-home.html; then
            echo 'Old life.pagero.kr origin still exists in proxied home HTML.' >&2
            exit 1
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Pagero Life preview'
            echo ''
            echo "Preview: ${PAGERO_LIFE_PREVIEW_URL:-not-created}"
            echo ''
            echo '- production branch was not used'
            echo '- smoke tests cover home, CSS, sitemap, and one article'
          } >> "$GITHUB_STEP_SUMMARY"
