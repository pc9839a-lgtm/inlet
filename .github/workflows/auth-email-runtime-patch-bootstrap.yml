name: Auth Email Runtime Patch Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/auth-email-runtime-hardening-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/auth-email-runtime-hardening-20260804
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused runtime patch
        run: python3 scripts/bootstrap-auth-email-runtime-hardening.py

      - name: Install
        run: npm ci

      - name: Auth email runtime QA
        run: npm run auth:qa

      - name: Production build
        run: node scripts/build.mjs

      - name: Commit patched runtime
        run: |
          git config user.name "Inlet Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/api/auth/_auth.js scripts/auth-email-quality-check.mjs docs/ops-auth-email-runtime-risks.md
          git commit -m "fix: harden auth email runtime delivery"
          git push origin HEAD:fix/auth-email-runtime-hardening-20260804
