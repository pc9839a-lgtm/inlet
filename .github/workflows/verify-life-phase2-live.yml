name: Verify AdSense phase 2 editorial content on public LIFE canonical
on:
  # Audit-only edits do not trigger a Cloudflare Pages deployment.
  # Re-run these read-only production checks when their own contract changes.
  push:
    branches: [main]
    paths:
      - 'scripts/adsense-public-crawl.mjs'
      - 'scripts/verify-life-phase2-public.mjs'
      - '.github/workflows/adsense-public-render-crawl.yml'
      - '.github/workflows/verify-life-phase2-live.yml'
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout PageRo read-only verification
        uses: actions/checkout@v4
      - name: Checkout currently published LIFE article source
        uses: actions/checkout@v4
        with:
          repository: pc9839a-lgtm/life-pagero
          ref: main
          path: life-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The production LIFE build hydrates compressed reviewed content bundles
      # and applies editorial patches before rendering Article JSON-LD and
      # sitemap lastmod. Raw Git files can have older updatedAt than output.
      - name: Materialize the published LIFE content revisions locally
        run: node scripts/apply-content-updates.mjs
        working-directory: life-source
      # The production build applies these exact two official-source curation
      # stages after the compressed content patch. Curation can add reviewed
      # sections and legitimately advance updatedAt (e.g. 2026-10-21 to 10-23).
      - name: Apply source curation stages used by the LIFE production build
        working-directory: life-source
        run: |
          node scripts/curate-redundant-homepage-citations.mjs
          node scripts/curate-published-primary-sources.mjs
      - name: Verify five current canonical LIFE articles, metadata, homepage links and sitemap
        run: node scripts/verify-life-phase2-public.mjs
