name: Route auth email through proven SES sender

on:
  push:
    branches: [main]
    paths: [.github/workflows/hotfix-auth-verification-id.yml]

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reuse working SES delivery module
        shell: bash
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync, existsSync, rmSync } from 'node:fs';
          const path = 'functions/api/auth/_auth.js';
          let source = readFileSync(path, 'utf8');
          const importLine = "import { sendSesEmail } from '../_ses.js';\n";
          if (!source.includes(importLine)) source = importLine + source;
          const replacement = `async function sendSesAuthEmail(message = {}, env = {}) {
            const config = sesAuthEmailConfig(env);
            if (!config.ok) {
              throw authError('메일 전송에 실패했습니다. 잠시 후 다시 시도해주세요.', 503, {
                code: 'EMAIL_SEND_NOT_CONFIGURED',
                provider: 'ses',
              });
            }
            try {
              await sendSesEmail({
                to: message.email,
                from: config.sender,
                subject: cleanAuthEmailSubject(message.purpose),
                text: cleanAuthEmailText(message),
                html: cleanAuthEmailHtml(message),
              }, env);
            } catch (error) {
              const code = String(error?.code || 'EMAIL_SEND_PROVIDER_ERROR');
              throw authError('메일 전송에 실패했습니다. 잠시 후 다시 시도해주세요.', 503, {
                code,
                provider: 'ses',
              });
            }
            return { mode: 'api', provider: 'ses', status: 'sent' };
          }

          function cleanAuthEmailSubject`;
          const next = source.replace(/async function sendSesAuthEmail\(message = \{\}, env = \{\}\) \{[\s\S]*?\n\}\n\nfunction cleanAuthEmailSubject/, replacement);
          if (next === source) throw new Error('sendSesAuthEmail replacement target not found');
          writeFileSync(path, next);
          for (const removePath of [
            'functions/api/diagnostics/auth-verification-storage.js',
            '.github/workflows/deploy-auth-storage-diagnostic.yml',
            '.github/workflows/capture-auth-email-live.yml',
          ]) {
            if (existsSync(removePath)) rmSync(removePath);
          }
          NODE

      - name: Install
        run: npm ci

      - name: Targeted regression
        run: |
          node --check functions/api/auth/_auth.js
          npm run api:functions:qa
          npm run api:security:qa
          npm run build

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pages

      - name: Verify real auth email API
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          TEST_EMAIL="support+calltag-final-$(date +%s)@pagero.kr"
          HTTP_CODE="$(curl -sS -o /tmp/auth-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"purpose\":\"signup\"}" \
            https://pagero.kr/api/auth/email-verification)"
          cat /tmp/auth-response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          node -e "const r=require('/tmp/auth-response.json'); if(!r.ok||r.verification?.delivery?.status!=='sent') process.exit(1)"

      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-auth-verification-id.yml
          git add -A
          git commit -m "fix: reuse proven SES sender for auth email"
          git push origin HEAD:main
