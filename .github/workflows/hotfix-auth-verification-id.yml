name: Hotfix auth SES runtime timeout

on:
  push:
    branches: [main]
    paths: [.github/workflows/hotfix-auth-verification-id.yml]

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove incompatible SES abort signal
        shell: bash
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync, existsSync, rmSync } from 'node:fs';
          const path = 'functions/api/auth/_auth.js';
          let source = readFileSync(path, 'utf8');
          const target = "      signal: AbortSignal.timeout(config.timeoutMs),\n";
          if (!source.includes(target)) throw new Error('SES AbortSignal patch target not found');
          source = source.replace(target, '');
          writeFileSync(path, source);
          if (existsSync('functions/api/diagnostics/auth-verification-storage.js')) rmSync('functions/api/diagnostics/auth-verification-storage.js');
          if (existsSync('.github/workflows/deploy-auth-storage-diagnostic.yml')) rmSync('.github/workflows/deploy-auth-storage-diagnostic.yml');
          if (existsSync('.github/workflows/capture-auth-email-live.yml')) rmSync('.github/workflows/capture-auth-email-live.yml');
          NODE

      - name: Install
        run: npm ci

      - name: Targeted regression
        run: |
          node --check functions/api/auth/_auth.js
          npm run auth:email:qa
          npm run api:functions:qa
          npm run api:security:qa
          npm run build

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pages

      - name: Verify real auth email API
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="support+calltag-live-$(date +%s)@pagero.kr"
          HTTP_CODE="$(curl -sS -o /tmp/auth-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"purpose\":\"signup\"}" \
            https://pagero.kr/api/auth/email-verification)"
          cat /tmp/auth-response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          node -e "const r=require('/tmp/auth-response.json'); if(!r.ok||r.verification?.delivery?.status!=='sent') process.exit(1)"

      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-auth-verification-id.yml
          git add -A
          git commit -m "fix: restore auth email delivery on Cloudflare Workers"
          git push origin HEAD:main
