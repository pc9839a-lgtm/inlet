name: Lead Cookie Smoke Regression Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/lead-cookie-duplicate-default-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/lead-cookie-duplicate-default-20260804
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply unique contact smoke regression
        run: python3 scripts/bootstrap-lead-cookie-smoke-regression.py

      - name: Install
        run: npm ci

      - name: Lead server smoke QA
        run: npm run server:smoke:leads

      - name: Form duplicate contract QA
        run: npm run browser:forms:contract:qa

      - name: Production build
        run: npm run build

      - name: Commit regression
        run: |
          git config user.name "Inlet Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/server-smoke-leads.mjs
          git commit -m "test: allow unique contacts from the same browser"
          git push origin HEAD:fix/lead-cookie-duplicate-default-20260804
