name: Diagnose CallTag Admin D1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/calltag-admin-d1-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run metadata-only production queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="node_modules/wrangler/bin/wrangler.js"
          q(){
            local name="$1" sql="$2"
            echo "=== $name ==="
            node "$WRANGLER" d1 execute inlet-prod --remote --command "$sql" --json >/tmp/out.json
            node -e 'const d=require("/tmp/out.json"); const r=Array.isArray(d)?d[0]?.results:d?.results; console.log(JSON.stringify(r||[]))'
          }
          q profiles_info "PRAGMA table_info(calllink_profiles);"
          q billing_accounts_info "PRAGMA table_info(billing_accounts);"
          q billing_subscriptions_info "PRAGMA table_info(billing_subscriptions);"
          q partner_commissions_info "PRAGMA table_info(partner_commissions);"
          q profiles_count "SELECT COUNT(*) AS value FROM calllink_profiles;"
          q new7_count "SELECT COUNT(*) AS value FROM calllink_profiles WHERE datetime(created_at) >= datetime('now', '-7 days');"
          q trial_count "SELECT COUNT(*) AS value FROM billing_accounts b JOIN calllink_profiles p ON p.owner_id=b.owner_id WHERE datetime(b.trial_ends_at)>datetime('now') AND NOT EXISTS (SELECT 1 FROM billing_subscriptions s WHERE s.owner_id=b.owner_id AND s.product_code IN ('call_monthly','message_monthly','all_monthly') AND s.status IN ('active','grace','cancelled') AND (s.expires_at='' OR datetime(s.expires_at)>datetime('now')));"
          q active_count "SELECT COUNT(DISTINCT s.owner_id) AS value FROM billing_subscriptions s JOIN calllink_profiles p ON p.owner_id=s.owner_id WHERE s.product_code IN ('call_monthly','message_monthly','all_monthly') AND s.status IN ('active','grace','cancelled') AND (s.expires_at='' OR datetime(s.expires_at)>datetime('now'));"
          q review_count "SELECT COUNT(DISTINCT s.owner_id) AS value FROM billing_subscriptions s JOIN calllink_profiles p ON p.owner_id=s.owner_id WHERE s.product_code IN ('call_monthly','message_monthly','all_monthly') AND (s.verification_state!='verified' OR s.status='pending');"
          q partner_count "SELECT COUNT(*) AS value FROM partner_commissions pc JOIN billing_subscriptions s ON s.id=pc.subscription_id WHERE s.product_code IN ('call_monthly','message_monthly','all_monthly') AND pc.status IN ('estimated','confirmed');"
          q recent_shape "SELECT p.owner_id, p.created_at, p.updated_at, b.trial_ends_at, b.referral_bonus_days, s.product_code, s.channel, s.status AS subscription_status, s.verification_state, s.expires_at, s.last_verified_at FROM calllink_profiles p LEFT JOIN billing_accounts b ON b.owner_id=p.owner_id LEFT JOIN billing_subscriptions s ON s.id=(SELECT s2.id FROM billing_subscriptions s2 WHERE s2.owner_id=p.owner_id AND s2.product_code IN ('call_monthly','message_monthly','all_monthly') ORDER BY datetime(s2.updated_at) DESC,s2.id DESC LIMIT 1) ORDER BY datetime(p.created_at) DESC LIMIT 1;"
