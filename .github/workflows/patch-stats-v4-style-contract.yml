name: Patch stats v4 style QA contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stats-v4-style-contract.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point stats QA at current v4 owner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/stats-quality-check.mjs')
          s = p.read_text(encoding='utf-8')
          replacements = {
            "const statsPeriodCss = await readFile('src/styles/panels-stats-period-line.css', 'utf8');": "const statsPanelCss = await readFile('src/panels/StatsPanel.css', 'utf8');",
            "assert(statsPeriodCss.includes('grid-template-columns: minmax(0, 1fr) 184px'), 'stats month picker should have enough width for year/month text');": "assert(statsPanelCss.includes('grid-template-columns: minmax(280px, 1fr) 170px 210px'), 'stats v4 desktop filter row should reserve a dedicated month column');",
            "assert(statsPeriodCss.includes('min-width: 168px'), 'stats month input should not collapse to year-only text');": "assert(statsPanelCss.includes('.stats-v4-filter-control :is(input, select)') && statsPanelCss.includes('width: 100%'), 'stats v4 month/select controls should fill their reserved columns');",
            "assert(statsPeriodCss.includes('grid-template-columns: 58px minmax(96px, .8fr) minmax(112px, 1fr) 132px'), 'recent lead rows should use four visible columns only');": "assert(statsPanelCss.includes('grid-template-columns: 80px minmax(120px,.8fr) minmax(160px,1fr) 130px'), 'stats v4 recent lead rows should use four visible columns only');",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected stats QA contract missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch, remove temporary workflow, dispatch QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/patch-stats-v4-style-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stats-quality-check.mjs .github/workflows/patch-stats-v4-style-contract.yml
          git commit -m "fix(qa): validate stats v4 style owner"
          git push origin HEAD:main
          gh workflow run qa.yml --ref main
