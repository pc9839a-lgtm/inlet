name: Billing Referral QA

on:
  workflow_dispatch:
  push:
    branches:
      - docs/unified-billing-referral-architecture-20260804
      - agent/billing-referral-**
      - fix/calltag-referral-five-day-qa-20260911
  pull_request:
    branches:
      - main

concurrency:
  group: billing-referral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify billing and referral contracts
        run: node scripts/billing-referral-quality-check.mjs

      - name: Verify CallTag referral five-day policy isolation
        run: node scripts/calltag-referral-five-day-quality-check.mjs

      - name: Verify CallTag Google Play RTDN renewal handling
        run: node scripts/calltag-rtdn-quality-check.mjs

      - name: Verify safe Google Play order reconciliation
        run: node scripts/calltag-play-order-reconcile-quality-check.mjs

      - name: Verify admin-operated subscription recovery UI
        run: node scripts/calltag-admin-subscription-recovery-ui-quality-check.mjs

      - name: Verify provider-backed CallTag subscription auto-repair
        run: node scripts/calltag-stale-subscription-repair-quality-check.mjs

      - name: Verify Google Play OAuth transport retry
        run: node scripts/calltag-google-play-oauth-transport-quality-check.mjs

      - name: Verify CallTag refund commission reversal handling
        run: node scripts/calltag-refund-reversal-quality-check.mjs

      - name: Verify CallTag partner scope isolation
        run: node scripts/calltag-partner-scope-quality-check.mjs

      - name: Verify CallTag referral server control
        run: node scripts/calltag-referral-server-control-quality-check.mjs

      - name: Verify production build
        run: npm run build
