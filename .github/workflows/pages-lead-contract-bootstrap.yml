name: Pages Lead Contract Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/lead-cookie-duplicate-default-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/lead-cookie-duplicate-default-20260804
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Pages lead contract update
        run: python3 scripts/bootstrap-pages-lead-contract-update.py

      - name: Install
        run: npm ci

      - name: Pages Functions QA
        run: npm run api:functions:qa

      - name: Lead server smoke QA
        run: npm run server:smoke:leads

      - name: Production build
        run: npm run build

      - name: Commit contract update
        run: |
          git config user.name "Inlet Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/pages-functions-quality-check.mjs
          git commit -m "test: verify duplicate and throttle responses"
          git push origin HEAD:fix/lead-cookie-duplicate-default-20260804
