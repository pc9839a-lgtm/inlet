name: CallTag Billing DB Audit Temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/calltag-billing-db-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Read latest Google Play billing rows without PII
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          found=0
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            echo "Checking D1 database: $db"
            if npx wrangler d1 execute "$db" --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='billing_subscriptions';" > /tmp/table.json 2>/tmp/table.err; then
              if grep -q 'billing_subscriptions' /tmp/table.json; then
                found=1
                echo 'Latest Google Play billing rows:'
                npx wrangler d1 execute "$db" --remote --json --command "SELECT id, product_code, channel, status, verification_state, auto_renewing, last_verified_at, created_at, updated_at, expires_at FROM billing_subscriptions WHERE channel='google_play' ORDER BY id DESC LIMIT 5;"
              fi
            fi
          done < <(jq -r '.[] | .name // empty' /tmp/d1.json)
          if [ "$found" -ne 1 ]; then
            echo 'No D1 database with billing_subscriptions was found.' >&2
            exit 2
          fi
