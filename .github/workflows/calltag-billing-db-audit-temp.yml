name: CallTag Billing DB Audit Temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/calltag-billing-db-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read latest Google Play billing rows without PII
        shell: bash
        run: |
          set -euo pipefail
          url='https://pagero.kr/api/billing/audit-temp'
          body="$RUNNER_TEMP/billing-audit.json"
          for attempt in $(seq 1 30); do
            code="$(curl -sS --connect-timeout 8 --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
            echo "attempt=$attempt http=$code"
            if [ "$code" = '200' ]; then
              python3 - "$body" <<'PY'
import json,sys
p=sys.argv[1]
d=json.load(open(p,encoding='utf-8'))
print(json.dumps(d,ensure_ascii=False,sort_keys=True))
rows=d.get('rows') or []
if d.get('ok') is True and rows:
    raise SystemExit(0)
raise SystemExit(2)
PY
              exit 0
            fi
            sleep 5
          done
          echo 'Sanitized billing audit endpoint did not become ready.' >&2
          [ -f "$body" ] && cat "$body" >&2 || true
          exit 1
