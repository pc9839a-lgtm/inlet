name: CallTag Live Billing Auth Audit Temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/calltag-billing-db-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify latest Google Play billing row without PII
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/billing-audit.json"
          curl -fsS --connect-timeout 8 --max-time 20 'https://pagero.kr/api/billing/audit-temp' -o "$body"
          cat "$body"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); rows=d.get('rows') or []; r=rows[0] if rows else {}; ok=d.get('ok') is True and r.get('channel')=='google_play' and r.get('status')=='active' and r.get('verificationState')=='verified'; sys.exit(0 if ok else 2)" "$body"

      - name: Verify live Google native login configuration
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/google-health.json"
          curl -fsS --connect-timeout 8 --max-time 20 'https://pagero.kr/api/call/google/health-temp' -o "$body"
          cat "$body"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); ok=d.get('ok') is True and d.get('nativeClientIdConfigured') is True and d.get('nativeClientIdMatchesApp') is True and d.get('jwksReachable') is True and d.get('nativeLoginReady') is True; sys.exit(0 if ok else 2)" "$body"
