name: Custom Domain Recheck

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-domain-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RECHECK_URL: ${{ vars.PAGERO_DOMAIN_RECHECK_URL }}
      RECHECK_SECRET: ${{ secrets.PAGERO_DOMAIN_RECHECK_SECRET }}
    steps:
      - name: Recheck due custom domains
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${RECHECK_URL:-https://pagero.kr/api/admin/domains/recheck}"
          if [[ -z "${RECHECK_SECRET:-}" ]]; then
            echo 'skipped-live: PAGERO_DOMAIN_RECHECK_SECRET is not configured'
            exit 0
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 3 \
            --request POST \
            --header "Authorization: Bearer ${RECHECK_SECRET}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${endpoint}")"
          echo "${response}"
          RESPONSE_JSON="${response}" node --input-type=module -e "
            const payload = JSON.parse(process.env.RESPONSE_JSON || '{}');
            if (payload.ok !== true) process.exit(1);
            console.log('processed=' + Number(payload.processed || 0));
            console.log('operatorRequired=' + Number(payload.operatorRequired || 0));
          "
