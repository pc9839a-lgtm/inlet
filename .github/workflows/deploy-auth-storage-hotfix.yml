name: Deploy auth storage hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Auth regression QA
        run: |
          npm run auth:qa
          npm run auth:email:qa
          npm run api:functions:qa
          npm run api:security:qa

      - name: Deploy Cloudflare Pages production and record result
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm run deploy:pages 2>&1 | tee /tmp/inlet-production-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e

          deployment_url="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev/?' /tmp/inlet-production-deploy.log | tail -1 || true)"
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p docs

          if [ "$deploy_status" -eq 0 ]; then
            result="success"
          else
            result="failure"
          fi

          cat > docs/LAST_PRODUCTION_DEPLOYMENT.md <<EOF
          # Last production deployment

          - Result: ${result}
          - Deployed at: ${deployed_at}
          - Source commit: ${GITHUB_SHA}
          - Deployment URL: ${deployment_url:-not-detected}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PRODUCTION_DEPLOYMENT.md
          git commit -m "ops: record production deployment ${result}" || true
          git push origin HEAD:main

          exit "$deploy_status"
