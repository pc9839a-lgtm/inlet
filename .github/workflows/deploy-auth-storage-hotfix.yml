name: Deploy auth storage hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Auth regression QA
        run: |
          npm run auth:qa
          npm run auth:email:qa
          npm run api:functions:qa
          npm run api:security:qa

      - name: Deploy Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pages
