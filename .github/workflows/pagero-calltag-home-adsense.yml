name: PageRo CallTag footer and AdSense home integrity
on:
  push:
    branches: [main, fix/pagero-calltag-footer-adsense-home-20261022]
    paths:
      - src/App.jsx
      - src/screens/PageroCanonicalHome.jsx
      - functions/index.js
      - scripts/pagero-calltag-footer-adsense-quality-check.mjs
      - .github/workflows/pagero-calltag-home-adsense.yml
  pull_request:
    paths:
      - src/App.jsx
      - src/screens/PageroCanonicalHome.jsx
      - functions/index.js
      - scripts/pagero-calltag-footer-adsense-quality-check.mjs
      - .github/workflows/pagero-calltag-home-adsense.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public publisher navigation and customer ad-code separation
        run: node scripts/pagero-calltag-footer-adsense-quality-check.mjs
      - name: Validate production root SEO
        run: node scripts/validate-pagero-root-seo.mjs
      - name: Build actual PageRo SPA
        run: npm ci && npm run build

  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify PageRo public HTML actually exposes LIFE and CallTag navigation after deployment
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time
          url='https://pagero.kr/'
          for attempt in range(1,27):
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 PageRoEditorialNavigationQA','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=13) as r:
                      status=r.status;html=r.read(190000).decode('utf-8','replace')
                  ok=(status==200 and '콜태그(CallTag)' in html and
                      'https://calltag.pagero.kr/' in html and
                      'href="/life/"' in html and
                      '통화 후 상담 메모' in html and
                      'name="google-adsense-account"' in html)
                  print('PUBLISHER_NAV',attempt,'http',status,'ok',ok,flush=True)
                  if ok:
                      print('PASS: PageRo published homepage exposes LIFE and CallTag to crawlers',flush=True)
                      break
              except Exception as exc:
                  print('RETRY',attempt,type(exc).__name__,str(exc)[:100],flush=True)
              if attempt==26:raise SystemExit('FAIL: new root footer not deployed or Adsense verification missing')
              time.sleep(15)
          PY
