name: Diagnose CallTag external integrations live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-calltag-external-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check production D1 schema and Pages secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER="node_modules/wrangler/bin/wrangler.js"
          SQL="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('calltag_lead_customers','calltag_lead_events','calltag_api_keys','calltag_lead_audit','calltag_webhook_connections','calltag_webhook_mapping_versions','calltag_webhook_raw_events','calltag_meta_connections','calltag_meta_oauth_sessions','calltag_google_forms_oauth_sessions','calltag_google_forms_connections','calltag_push_devices','pagero_leads') ORDER BY name;"
          node "$WRANGLER" d1 execute inlet-prod --remote --command "$SQL" --json > /tmp/d1.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const rows=(Array.isArray(d)?d[0]?.results:d?.results)||[];
          const got=new Set(rows.map(r=>r.name));
          const need=[
            'calltag_lead_customers','calltag_lead_events','calltag_api_keys','calltag_lead_audit',
            'calltag_webhook_connections','calltag_webhook_mapping_versions','calltag_webhook_raw_events',
            'calltag_meta_connections','calltag_meta_oauth_sessions',
            'calltag_google_forms_oauth_sessions','calltag_google_forms_connections',
            'calltag_push_devices','pagero_leads'
          ];
          console.log('D1_TABLES=' + JSON.stringify(need.map(name=>({name,present:got.has(name)}))));
          const missing=need.filter(name=>!got.has(name));
          console.log('D1_MISSING=' + JSON.stringify(missing));
          NODE

          node "$WRANGLER" pages secret list --project-name inlet > /tmp/secrets.txt || true
          node - <<'NODE'
          const fs=require('fs');
          const t=fs.readFileSync('/tmp/secrets.txt','utf8');
          const names=[
            'CALLTAG_PROVIDER_CREDENTIAL_KEY',
            'CALLTAG_META_APP_ID',
            'CALLTAG_META_APP_SECRET',
            'CALLTAG_META_OAUTH_REDIRECT_URI',
            'GOOGLE_AUTH_CLIENT_ID',
            'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_AUTH_CLIENT_SECRET',
            'GOOGLE_OAUTH_CLIENT_SECRET',
            'GOOGLE_CLIENT_SECRET',
            'INLET_SESSION_SECRET_V2',
            'INLET_SESSION_SECRET',
            'FIREBASE_PROJECT_ID',
            'FIREBASE_CLIENT_EMAIL',
            'FIREBASE_PRIVATE_KEY'
          ];
          console.log('SECRET_NAME_PRESENCE=' + JSON.stringify(names.map(name=>({name,present:t.includes(name)}))));
          NODE

      - name: Probe public readiness endpoints
        shell: bash
        run: |
          set -euo pipefail
          echo "=== pagero lead health ==="
          curl -sS -i --max-time 20 https://pagero.kr/api/call/pagero/health | head -c 2000
          echo
          echo "=== push readiness ==="
          curl -sS --max-time 20 https://pagero.kr/api/call/push/readiness
          echo
