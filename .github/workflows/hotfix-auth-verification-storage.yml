name: Hotfix auth verification storage compatibility

on:
  push:
    branches:
      - fix/auth-verification-storage-compat-20260806
    paths:
      - .github/workflows/hotfix-auth-verification-storage.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/auth-verification-storage-compat-20260806
          fetch-depth: 0

      - name: Patch verification storage states for existing D1 schema
        shell: bash
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';

          const authPath = 'functions/api/auth/_auth.js';
          let auth = readFileSync(authPath, 'utf8');

          function replaceRequired(source, pattern, replacement, label) {
            const next = source.replace(pattern, replacement);
            if (next === source) throw new Error(`patch target not found: ${label}`);
            return next;
          }

          auth = replaceRequired(
            auth,
            /UPDATE auth_email_verifications\s+SET status = 'superseded'\s+WHERE email = \? AND purpose = \? AND status IN \('pending', 'confirmed'\)/,
            `UPDATE auth_email_verifications\n      SET status = 'expired'\n      WHERE email = ? AND purpose = ? AND status IN ('pending', 'confirmed')`,
            'superseded-to-expired',
          );

          auth = replaceRequired(
            auth,
            "WHERE email = ? AND purpose = ? AND status IN ('pending', 'confirmed', 'consumed')",
            "WHERE email = ? AND purpose = ? AND status IN ('pending', 'confirmed', 'blocked')",
            'select-consumed-to-blocked',
          );

          auth = auth.replaceAll("String(record.status || '') !== 'consumed'", "String(record.status || '') !== 'blocked'");

          auth = replaceRequired(
            auth,
            /if \(String\(record\.status \|\| ''\) === 'consumed'\) \{\s+throw authError\('Email verification token was already used\.', 409, \{\s+code: 'EMAIL_VERIFICATION_ALREADY_USED',\s+\}\);\s+\}/,
            `if (String(record.status || '') === 'blocked') {\n      if (record.confirmed_at) {\n        throw authError('Email verification token was already used.', 409, {\n          code: 'EMAIL_VERIFICATION_ALREADY_USED',\n        });\n      }\n      continue;\n    }`,
            'consumed-replay-guard',
          );

          auth = replaceRequired(
            auth,
            "SET status = 'consumed', confirmed_at = COALESCE(confirmed_at, ?)",
            "SET status = 'blocked', confirmed_at = COALESCE(confirmed_at, ?)",
            'consume-write-to-compatible-blocked-state',
          );

          if (auth.includes("status = 'superseded'")) throw new Error('unsupported superseded state remains');
          if (auth.includes("SET status = 'consumed'")) throw new Error('unsupported consumed write remains');
          writeFileSync(authPath, auth);

          const qaPath = 'scripts/auth-verification-purpose-consumption-quality-check.mjs';
          let qa = readFileSync(qaPath, 'utf8');
          qa = qa.replaceAll(
            "WHERE email = ? AND purpose = ? AND status IN ('pending', 'confirmed', 'consumed')",
            "WHERE email = ? AND purpose = ? AND status IN ('pending', 'confirmed', 'blocked')",
          );
          qa = qa.replaceAll("['pending', 'confirmed', 'consumed']", "['pending', 'confirmed', 'blocked']");
          qa = qa.replace(
            "if (normalized.startsWith(\"UPDATE auth_email_verifications SET status = 'superseded'\")) {",
            "if (normalized.startsWith(\"UPDATE auth_email_verifications SET status = 'expired' WHERE email = ?\")) {",
          );
          qa = qa.replace("row.status = 'superseded';", "row.status = 'expired';");
          qa = qa.replace(
            "if (normalized.includes(\"SET status = 'blocked'\")) {",
            "if (normalized.includes(\"SET status = 'blocked'\") && !normalized.includes('confirmed_at')) {",
          );
          qa = qa.replace(
            "if (normalized.includes(\"SET status = 'consumed'\")) {",
            "if (normalized.includes(\"SET status = 'blocked', confirmed_at\")) {",
          );
          qa = qa.replaceAll("row.status = 'consumed';", "row.status = 'blocked';");
          qa = qa.replace(
            "consumed.status === 'consumed' && signupRow.status === 'consumed'",
            "consumed.status === 'consumed' && signupRow.status === 'blocked'",
          );
          qa = qa.replace(
            "firstResetRow.status === 'superseded'",
            "firstResetRow.status === 'expired'",
          );
          qa = qa.replace(
            "latestResetRow.status === 'consumed'",
            "latestResetRow.status === 'blocked'",
          );
          qa = qa.replace("\"status = 'superseded'\",", "\"status = 'expired'\",");
          qa = qa.replace("\"status = 'consumed'\",", "\"status = 'blocked', confirmed_at\",");
          qa = qa.replace(
            "\"purpose = ? AND status IN ('pending', 'confirmed', 'consumed')\",",
            "\"purpose = ? AND status IN ('pending', 'confirmed', 'blocked')\",",
          );
          writeFileSync(qaPath, qa);

          const emailQaPath = 'scripts/auth-email-quality-check.mjs';
          let emailQa = readFileSync(emailQaPath, 'utf8');
          emailQa = replaceRequired(
            emailQa,
            "if (normalized.startsWith(\"UPDATE auth_email_verifications SET status = 'superseded'\")) {",
            "if (normalized.startsWith(\"UPDATE auth_email_verifications SET status = 'expired' WHERE email = ?\")) {",
            'auth-email-qa-expired-update',
          );
          emailQa = replaceRequired(
            emailQa,
            "row.status = 'superseded';",
            "row.status = 'expired';",
            'auth-email-qa-expired-row',
          );
          writeFileSync(emailQaPath, emailQa);

          mkdirSync('docs', { recursive: true });
          writeFileSync('docs/AUTH_EMAIL_VERIFICATION_STORAGE_COMPAT_HOTFIX_KO.md', `# 회원가입 인증번호 저장 호환 긴급 패치\n\n## 장애\n\n운영 API가 \`EMAIL_VERIFICATION_STORAGE_FAILED\`를 반환해 회원가입 인증메일이 발송 단계까지 도달하지 못했다. 페이지로 접수메일은 별도 경로라 정상 수신됐다.\n\n## 원인\n\n인증번호 목적 분리와 일회성 소비 패치가 D1 기존 상태값에 없는 \`superseded\`, \`consumed\`를 쓰도록 변경됐다. 운영 D1 스키마를 별도 마이그레이션하지 않은 상태에서 해당 상태 저장이 실패할 수 있었다.\n\n## 수정\n\n- 같은 이메일·목적의 이전 인증번호: \`expired\` 처리\n- 최종 사용된 인증번호: 기존 허용 상태 \`blocked\`와 \`confirmed_at\` 조합으로 소비 표시\n- \`blocked + confirmed_at\`: 이미 사용된 코드로 판정\n- \`blocked + confirmed_at 없음\`: 오입력 횟수 초과 차단으로 판정\n- 외부 응답은 기존처럼 \`consumed\`를 유지\n- 운영 D1 마이그레이션 없음\n- SES·접수메일 설정 변경 없음\n\n## 검증\n\n- 새 코드 발급 시 이전 코드 무효화\n- 확인 후 최종 작업 1회만 허용\n- 사용된 코드 재사용 409 차단\n- 잘못된 목적 격리\n- 인증 이메일·Pages Functions·API 보안·프로덕션 빌드\n`);
          NODE

      - name: Remove one-time workflow
        run: git rm .github/workflows/hotfix-auth-verification-storage.yml

      - name: Syntax checks
        run: |
          node --check functions/api/auth/_auth.js
          node --check scripts/auth-verification-purpose-consumption-quality-check.mjs
          node --check scripts/auth-email-quality-check.mjs

      - name: Verification purpose and consumption QA
        run: node scripts/auth-verification-purpose-consumption-quality-check.mjs

      - name: Auth QA
        run: npm run auth:qa

      - name: Auth email QA
        run: npm run auth:email:qa

      - name: Install dependencies
        run: npm ci

      - name: Pages Functions QA
        run: npm run api:functions:qa

      - name: API security QA
        run: npm run api:security:qa

      - name: Production build
        run: npm run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore auth verification storage compatibility"
          git push origin HEAD:fix/auth-verification-storage-compat-20260806
