name: Diagnose SES Readiness Safely

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS SES region
        required: true
        default: ap-northeast-2
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run read-only SES verification
        id: verify
        continue-on-error: true
        env:
          INLET_SES_REGION: ${{ inputs.region }}
          INLET_SES_ACCESS_KEY_ID: ${{ secrets.PAGERO_SES_ACCESS_KEY_ID }}
          INLET_SES_SECRET_ACCESS_KEY: ${{ secrets.PAGERO_SES_SECRET_ACCESS_KEY }}
          INLET_AUTH_EMAIL_FROM: ${{ vars.PAGERO_AUTH_EMAIL_FROM }}
          INLET_SES_IDENTITY: ${{ vars.PAGERO_SES_IDENTITY }}
          INLET_SES_REQUIRE_DMARC: '1'
          INLET_SES_REQUIRE_CUSTOM_MAIL_FROM: '0'
          INLET_SES_REQUIRE_LIVE: '1'
          INLET_SES_TIMEOUT_MS: '15000'
        shell: bash
        run: |
          set +e
          npm run auth:email:ses:live > ses-readiness-evidence.json
          code=$?
          cat ses-readiness-evidence.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-readiness-evidence-${{ github.run_id }}
          path: ses-readiness-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce diagnostic result
        if: always()
        run: test "${{ steps.verify.outputs.exit_code }}" = "0"
