name: CallTag Google login live readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/api/call/google/readiness.js'
      - '.github/workflows/calltag-google-readiness-live.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check endpoint syntax
        run: node --check functions/api/call/google/readiness.js
      - name: Verify production Google runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pagero.kr/api/call/google/readiness'
          EXPECTED='31346298247-o5jfdetjs84mu02c8tp68qg19ifo89en.apps.googleusercontent.com'
          for attempt in $(seq 1 24); do
            status="$(curl -sS -o body.json -w '%{http_code}' "$URL" || true)"
            echo "attempt=$attempt status=$status"
            cat body.json || true
            if [ "$status" = '200' ]; then
              node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('body.json','utf8')); if(!x.ok||!x.configured) process.exit(2); if(x.clientId!==process.argv[1]) { console.error('client id mismatch:',x.clientId); process.exit(3); }" "$EXPECTED"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Google readiness endpoint did not become live.'
          exit 1
