name: Code label live diagnostic
on:
  push:
    branches:
      - diag/code-label-live-20260929

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check live CodeEditor chunk
        run: |
          mkdir -p .tmp-code-label
          for base in "https://pagero.kr" "https://0cfc057a.inlet-8mr.pages.dev"; do
            key="$(echo "$base" | sed 's#https://##;s#[./]#-#g')"
            curl -fsS -D ".tmp-code-label/${key}-headers.txt" -H 'Cache-Control: no-cache, no-store' "$base/assets/CodeEditor-runtime.js?diag=20260929" -o ".tmp-code-label/${key}-CodeEditor.js"
            {
              echo "=== $base ==="
              grep -o '구분 이름' ".tmp-code-label/${key}-CodeEditor.js" | head -5 || true
              grep -o 'editorLabel' ".tmp-code-label/${key}-CodeEditor.js" | head -5 || true
              wc -c ".tmp-code-label/${key}-CodeEditor.js"
              cat ".tmp-code-label/${key}-headers.txt"
            } >> .tmp-code-label/summary.txt
          done
          cat .tmp-code-label/summary.txt
          grep -q '구분 이름' .tmp-code-label/pagero-kr-CodeEditor.js
          grep -q 'editorLabel' .tmp-code-label/pagero-kr-CodeEditor.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-label-live-diag-${{ github.run_id }}
          path: .tmp-code-label
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
