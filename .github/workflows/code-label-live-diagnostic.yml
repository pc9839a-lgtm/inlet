name: Code label live diagnostic
on:
  push:
    branches:
      - diag/code-label-live-20260929

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check live CodeEditor v2 chunk
        run: |
          mkdir -p .tmp-code-label
          url='https://pagero.kr/assets/CodeEditor-runtime-v2.js?diag=20260929-v2'
          curl -fsS -D .tmp-code-label/headers.txt -H 'Cache-Control: no-cache, no-store' "$url" -o .tmp-code-label/CodeEditor-v2.js
          grep -q '구분 이름' .tmp-code-label/CodeEditor-v2.js
          grep -q 'editorLabel' .tmp-code-label/CodeEditor-v2.js
          grep -qi '^cache-control: no-store, no-cache, must-revalidate, max-age=0' .tmp-code-label/headers.txt
          grep -qi '^x-pagero-runtime-asset: no-store-v3' .tmp-code-label/headers.txt
          echo '=== headers ==='
          cat .tmp-code-label/headers.txt
          echo '=== code markers ==='
          grep -o '구분 이름\|editorLabel' .tmp-code-label/CodeEditor-v2.js | head -10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-label-live-v2-${{ github.run_id }}
          path: .tmp-code-label
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
