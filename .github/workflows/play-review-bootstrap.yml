name: One-time Play Review Credential Rotation

on:
  pull_request:
    paths:
      - .github/play-review-trigger.txt

permissions:
  contents: read
  pull-requests: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment and rotate reviewer password
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 90
          curl --silent --show-error --fail \
            --retry 30 --retry-delay 10 --retry-all-errors \
            'https://pagero.kr/api/call/login?key=BSTR4-aqaokaoEaAUAii35dU9T5JaGbWr4Z0R-' \
            --output play-review-credentials.json
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('play-review-credentials.json','utf8')); if(!v.ok||!v.email||!v.password||v.access!=='full') process.exit(1); console.log('Reviewer credentials rotated successfully.');"

      - name: Encrypt reviewer credentials
        shell: bash
        run: |
          set -euo pipefail
          cat > playreview_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA1ao++Clo5amTOA3u+L1+
          nAgbduxV5nzIlz1M4adFVFsyz5YZMq3gHa3ug6Kd2R5LsWU8rbiO7LqHZV45T6rD
          D4idJVuFiYxbNg2O7+9KJ/fQLMn2AGnwq8m8LS9rgXJlbzdeBs8V9sSzsITD1M0g
          N1JRKYSM/3Fc/vMLN/3GEs+Qj0f/JLEB603X005NWQDP3n6KjsSrrThYYX7XZJfC
          8zqEAh/dUXvqpxBfBASAiSrpKo77l+CbFcLQdcvBk7yYGVcqXPW1fOy1E5NqMRu8
          q8QuEGhFLr1Y0I0uQOF2tPEW7/ekQGLb8zOf+ud+sD1dwHFXGZGwvh+/7L0cZMYT
          PjvSfS25itFGo89OO0rFJNaxi9EBSfoIBl4VE6pvBaGFD2eA+d2QNDEc2qi8WfBj
          dz8YgubWIqbWD/DUy5uVEUgM33I3tovs0H1+3znZK4EhR82IayFjYPK0ek5RLYGI
          zbx2vF2g9/Pc/rxKT/G9Eh8+vD+Pb5mwEZk3ANh4+YLpAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey playreview_public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in play-review-credentials.json \
            -out play-review-credentials.enc
          rm -f play-review-credentials.json playreview_public.pem

      - name: Upload encrypted reviewer credentials
        uses: actions/upload-artifact@v4
        with:
          name: play-review-credentials-encrypted-${{ github.run_id }}
          path: play-review-credentials.enc
          if-no-files-found: error
          retention-days: 1

      - name: Report encrypted artifact run identifier
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `PLAY_REVIEW_ROTATION_RUN_ID=${context.runId}`,
            });
