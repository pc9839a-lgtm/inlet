name: One-time Play Review Bootstrap

on:
  pull_request:
    paths:
      - .github/play-review-trigger.txt

permissions:
  contents: read
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment and provision reviewer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sleep 90
          curl --silent --show-error --fail \
            --retry 30 --retry-delay 10 --retry-all-errors \
            'https://pagero.kr/api/call/login?key=BSTR3-JAktM5dR_E_c8QmI9m2WlAz_kwAU60N-' \
            --output play-review-credentials.json
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('play-review-credentials.json','utf8')); if(!v.ok||!v.email||!v.password) process.exit(1); console.log('Reviewer account provisioned successfully.');"

      - name: Upload private reviewer credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-review-credentials-${{ github.run_id }}
          path: play-review-credentials.json
          if-no-files-found: error
          retention-days: 1

      - name: Report artifact run identifier
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `PLAY_REVIEW_BOOTSTRAP_RUN_ID=${context.runId}`,
            });
