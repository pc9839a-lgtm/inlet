name: Admin Audit Integration QA

on:
  pull_request:
    paths:
      - 'functions/admin/**'
      - 'functions/api/_audit.js'
      - 'functions/api/admin/**'
      - 'functions/api/auth/**'
      - 'functions/api/pages/**'
      - 'functions/api/projects/**'
      - 'scripts/admin-audit-*.mjs'
      - 'scripts/audit-retention-safe-runner.mjs'
      - 'src/lib/authAccounts.js'
      - 'src/panels/settings/**'
      - '.github/workflows/admin-audit-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-audit-integration-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-audit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Stage latest-main admin registrations for contract QA
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const packagePath = 'package.json';
          const pkg = JSON.parse(await readFile(packagePath, 'utf8'));
          pkg.scripts = {
            ...pkg.scripts,
            'admin:audit:qa': 'node scripts/admin-audit-quality-check.mjs',
            'admin:audit:live': 'node scripts/admin-audit-production-safe-entry.mjs',
            'admin:audit:production:contract:qa': 'node scripts/admin-audit-production-contract-check.mjs',
            'audit:retention:run': 'node scripts/audit-retention-safe-runner.mjs',
          };
          await writeFile(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const qaPath = 'scripts/qa-all.mjs';
          let qa = await readFile(qaPath, 'utf8');
          const anchor = "  ['account:page-limit:qa', ['scripts/account-page-limit-quality-check.mjs']],\n";
          if (!qa.includes("admin:audit:production:contract:qa")) {
            if (!qa.includes(anchor)) throw new Error('qa-all registration anchor missing');
            qa = qa.replace(anchor, `${anchor}  ['admin:audit:qa', ['scripts/admin-audit-quality-check.mjs']],\n  ['admin:audit:production:contract:qa', ['scripts/admin-audit-production-contract-check.mjs']],\n`);
          }
          await writeFile(qaPath, qa);

          const envPath = '.env.example';
          let env = await readFile(envPath, 'utf8');
          if (!env.includes('INLET_AUDIT_HASH_SECRET')) {
            env += `\n# Audit security and scheduled retention.\n# INLET_AUDIT_HASH_SECRET=replace-with-long-random-audit-hash-secret\n# INLET_AUDIT_RETENTION_DAYS=730\n# INLET_AUDIT_RETENTION_BATCH_LIMIT=1000\n# INLET_AUDIT_RETENTION_SECRET=replace-with-at-least-24-random-characters\n# PAGERO_AUDIT_RETENTION_URL=https://pagero.kr/api/admin/audit/retention\n# PAGERO_AUDIT_RETENTION_ALLOWED_ORIGINS=https://pagero.kr\n# PAGERO_AUDIT_RETENTION_SECRET=store-in-github-secrets\n\n# Manual production administrator and audit verification.\n# INLET_ADMIN_AUDIT_BASE_URL=https://pagero.kr\n# PAGERO_ADMIN_AUDIT_ALLOWED_ORIGINS=https://pagero.kr\n# INLET_ADMIN_AUDIT_LIVE_PHASE=read-only\n# INLET_ADMIN_AUDIT_LIVE_WRITE=0\n# INLET_ADMIN_AUDIT_LIVE_APPROVAL=\n# INLET_ADMIN_AUDIT_LIVE_REQUIRE=1\n# INLET_ADMIN_AUDIT_TIMEOUT_MS=12000\n# INLET_ADMIN_AUDIT_PROJECT_SLUG_PREFIX=qa-audit-\n# INLET_ADMIN_AUDIT_PLATFORM_MASTER_SESSION=replace-with-signed-platform-master-session\n# INLET_ADMIN_AUDIT_GENERAL_SESSION=replace-with-signed-disposable-general-session\n# INLET_ADMIN_AUDIT_GENERAL_PASSWORD=replace-with-disposable-account-password\n# INLET_ADMIN_AUDIT_NEXT_EMAIL=controlled-next-email@example.com\n# INLET_ADMIN_AUDIT_EMAIL_CHANGE_TOKEN=replace-with-received-one-time-code\n# INLET_ADMIN_AUDIT_RETENTION_SECRET=replace-with-audit-retention-secret\n`;
          }
          await writeFile(envPath, env);
          NODE

      - name: Administrator and audit quality checks
        run: node scripts/admin-audit-quality-check.mjs

      - name: Production safety contract checks
        run: node scripts/admin-audit-production-contract-check.mjs

      - name: Production build
        run: node scripts/build.mjs
