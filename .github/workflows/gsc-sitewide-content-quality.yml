name: GSC sitewide indexable content diagnostic
on:
  pull_request:
    paths:
      - scripts/gsc-sitewide-content-quality.mjs
      - .github/workflows/gsc-sitewide-content-quality.yml
  push:
    branches: [main]
    paths:
      - scripts/gsc-sitewide-content-quality.mjs
      - .github/workflows/gsc-sitewide-content-quality.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-content-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit script syntax
        run: node --check scripts/gsc-sitewide-content-quality.mjs
      - name: Inspect all public sitemap pages and content duplication signals
        run: node scripts/gsc-sitewide-content-quality.mjs
      - name: Preserve full JSON findings even when audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-sitewide-content-audit
          path: artifacts/gsc-content-audit.json
          retention-days: 14
          if-no-files-found: ignore
