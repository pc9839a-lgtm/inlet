name: Temporary Runtime QA Copy Fallback Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-runtime-qa-copy-fallback.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update current inbox copy fallback contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/runtime-quality-check.mjs')
          s = p.read_text(encoding='utf-8')
          old = "assert(!inboxPanel.includes('window.prompt(') && inboxPanel.includes('lead-copy-fallback'), 'Inbox lead copy fallback must stay inside the app instead of using browser prompts');"
          new = "assert(!inboxPanel.includes('window.prompt(') && inboxPanel.includes('inbox-ops-copy-fallback') && inboxPanel.includes('setCopyFallback({ id: lead.id, text })'), 'Inbox lead copy fallback must stay inside the app instead of using browser prompts');"
          if old not in s:
              raise SystemExit('stale inbox copy fallback assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-runtime-qa-copy-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime-quality-check.mjs .github/workflows/patch-runtime-qa-copy-fallback.yml
          git commit -m 'fix(qa): validate current inbox copy fallback'
          git push origin HEAD:main
      - name: Run full QA on patched main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref main
