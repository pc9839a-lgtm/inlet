name: Temporary Runtime QA Accessibility Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-runtime-qa-accessibility.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update current image action accessibility contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/runtime-quality-check.mjs')
          s = p.read_text(encoding='utf-8')
          old = "assert(imageInputPreview.includes('aria-label={`${label} 수정`}') && imageInputPreview.includes('aria-label={`${label} 삭제`}') && imageInputPreview.includes('aria-label={`${label} 업로드`}'), 'image icon buttons must keep accessible names');"
          new = "assert(imageInputPreview.includes('aria-label={`${label} 교체`}') && imageInputPreview.includes('aria-label={`${label} 삭제`}') && imageInputPreview.includes('aria-label={`${label} 업로드`}'), 'image actions must keep accessible replace, delete, and upload names');"
          if old not in s:
              raise SystemExit('stale image accessibility assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-runtime-qa-accessibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime-quality-check.mjs .github/workflows/patch-runtime-qa-accessibility.yml
          git commit -m 'fix(qa): validate current image action accessibility names'
          git push origin HEAD:main
      - name: Run full QA on patched main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref main
