name: Temporary Runtime QA Project Access Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-runtime-qa-project-access.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update current delegated project access contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/runtime-quality-check.mjs')
          s = p.read_text(encoding='utf-8')
          old = "assert(dashboardScreen.includes('rememberAccountProjectAccess(item)') && accountProjectAccess.includes('rememberedProjects') && pageRepository.includes('delete serverPage.__accountProjectAccess') && pageRepository.includes('if (hasAccountProjectAccess(page)) return false;'), 'Authorized dashboard pages must preserve delegated project context without leaking internal markers or creating account-owned duplicates');"
          new = "assert(dashboardScreen.includes('const editorPage = { ...selectedPage, __accountProjectAccess: true }') && dashboardScreen.includes('rememberAccountProjectAccess(editorPage)') && accountProjectAccess.includes('rememberedProjects') && pageRepository.includes('delete serverPage.__accountProjectAccess') && pageRepository.includes('if (hasAccountProjectAccess(page)) return false;'), 'Authorized dashboard pages must preserve delegated project context without leaking internal markers or creating account-owned duplicates');"
          if old not in s:
              raise SystemExit('stale delegated project access assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-runtime-qa-project-access.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime-quality-check.mjs .github/workflows/patch-runtime-qa-project-access.yml
          git commit -m 'fix(qa): validate current delegated project access flow'
          git push origin HEAD:main
      - name: Run full QA on patched main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref main
