name: Deploy settings finance live

on:
  push:
    branches:
      - ops/settings-finance-live

permissions:
  contents: write

concurrency:
  group: settings-finance-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify unified billing and referral contracts
        run: node scripts/billing-referral-quality-check.mjs

      - name: Build production assets
        run: npm run build

      - name: Capture deployed source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy latest main
        run: >-
          npx wrangler pages deploy dist
          --project-name inlet
          --branch main
          --commit-hash "${{ steps.source.outputs.sha }}"
          --commit-message "Settings finance live ${{ steps.source.outputs.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record successful deployment source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .deployment
          RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > .deployment/cloudflare-status.json <<JSON
          {
            "sourceSha": "${SOURCE_SHA}",
            "outcome": "success",
            "reason": "none",
            "recordedAt": "${RECORDED_AT}"
          }
          JSON
          if git diff --quiet -- .deployment/cloudflare-status.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/cloudflare-status.json
          git commit -m "Record Cloudflare deployment result [skip deploy]"
          git push origin HEAD:main
