name: Auth Email Abuse Rate Limit Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/auth-email-abuse-rate-limit-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/auth-email-abuse-rate-limit-20260804
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply auth email abuse protection patch
        run: python3 scripts/bootstrap-auth-email-abuse-rate-limit.py

      - name: Install
        run: npm ci

      - name: Authentication QA
        run: npm run auth:qa

      - name: Production build
        run: npm run build

      - name: Commit patch
        run: |
          git config user.name "Inlet Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/api/auth/_auth.js functions/api/auth/email-verification.js src/lib/authAccounts.js scripts/auth-email-abuse-quality-check.mjs scripts/auth-quality-check.mjs docs/ops-auth-email-abuse-protection.md
          git commit -m "fix: rate limit verification email abuse"
          git push origin HEAD:fix/auth-email-abuse-rate-limit-20260804
