name: Static SEO Preview

on:
  pull_request:
    paths:
      - 'functions/about.js'
      - 'functions/contact.js'
      - 'functions/privacy.js'
      - 'functions/terms.js'
      - 'functions/lib/pageroStaticSeo.js'
      - 'functions/lib/pageroStaticPageRoute.js'
      - '.github/workflows/static-seo-preview.yml'
  workflow_dispatch:

concurrency:
  group: pagero-static-seo-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Cloudflare preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --branch static-seo-preview \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Static SEO preview $GITHUB_SHA" \
            2>&1 | tee /tmp/static-seo-preview.log

          PREVIEW_URL="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev/?' /tmp/static-seo-preview.log | tail -n 1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo 'Cloudflare preview URL was not detected.' >&2
            exit 1
          fi
          echo "PAGERO_STATIC_SEO_PREVIEW_URL=${PREVIEW_URL%/}" >> "$GITHUB_ENV"

      - name: Verify raw HTML pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PAGERO_STATIC_SEO_PREVIEW_URL"

          verify_page() {
            local path="$1"
            local text="$2"
            local file="$3"
            local headers="${file}.headers"
            local code=""

            for attempt in $(seq 1 20); do
              code="$(curl -sS -D "$headers" -o "$file" -w '%{http_code}' "$BASE$path" || true)"
              if [ "$code" = "200" ]; then break; fi
              sleep 2
            done

            echo "$path -> $code"
            test "$code" = "200"
            grep -qi '^x-pagero-static-seo: raw-html-v1' "$headers"
            grep -q "$text" "$file"
            grep -q '<link rel="canonical" href="https://pagero.kr' "$file"
            grep -q 'data-pagero-seo-shell' "$file"
            grep -Eq '<script[^>]+src="/assets/[^\"]+\.js"' "$file"
          }

          verify_page '/about' '페이지로 소개' /tmp/about.html
          verify_page '/contact' '문의하기' /tmp/contact.html
          verify_page '/privacy' '개인정보처리방침' /tmp/privacy.html
          verify_page '/terms' '이용약관' /tmp/terms.html

          ROOT_CODE="$(curl -sS -o /tmp/root.html -w '%{http_code}' "$BASE/" || true)"
          echo "/ -> $ROOT_CODE"
          test "$ROOT_CODE" = "200"
          grep -q '페이지로' /tmp/root.html
