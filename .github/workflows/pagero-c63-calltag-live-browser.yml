name: Verify live PageRo public marketing and related service links
on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify real public product homepage and secondary services
        shell: bash
        run: |
          python - <<'PY'
          import time,urllib.request
          for trial in range(1,16):
              req=urllib.request.Request('https://pagero.kr/',headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as r:html=r.read(250000).decode('utf-8','replace')
              ok=('class="pagero-public-home"' in html and 'href="/guide/"' in html and
                  'href="/life/"' in html and 'https://calltag.pagero.kr/' in html and
                  'name="google-adsense-account"' in html and 'c63-assets/' not in html)
              if ok:
                  print('PASS: live root is new public marketing page, trial',trial)
                  break
              if trial==15:raise SystemExit('FAIL: canonical public product homepage is not deployed')
              time.sleep(10)
          PY
      - name: Run real Chrome browser - desktop and mobile rendered DOM
        shell: bash
        env:
          INLET_BROWSER_QA_URL: https://pagero.kr/
          INLET_BROWSER_QA_REQUIRE: '1'
          INLET_BROWSER_QA_EXPECT_SELECTOR: ".pagero-public-home .ph-hero,.pagero-public-home .ph-footer a[href='https://calltag.pagero.kr/'],.pagero-public-home .ph-footer a[href='/life/']"
          INLET_BROWSER_QA_EXPECT_TEXT: "페이지는 직접 만들고,문의는 한곳에서 확인하세요.,페이지로 공식 설명서 전체 보기"
          INLET_BROWSER_QA_EXPECT_COMPUTED: ".pagero-public-home .ph-hero|display|block;.pagero-public-home .ph-footer|display|block"
        run: |
          export INLET_BROWSER_QA_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$INLET_BROWSER_QA_CHROME_PATH" ]; then echo 'Chrome not found'; exit 1; fi
          for viewport in desktop mobile; do
            export INLET_BROWSER_QA_VIEWPORTS="$viewport"
            export INLET_BROWSER_QA_SCREENSHOT_DIR=".tmp-pagero-public-home-$viewport"
            node scripts/browser-visual-quality-check.mjs
          done
      - name: Preserve real browser screenshots and QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagero-public-home-live-browser
          path: .tmp-pagero-public-home-*/
          if-no-files-found: ignore
          retention-days: 7
