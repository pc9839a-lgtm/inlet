name: Lead Cookie Duplicate Default Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/lead-cookie-duplicate-default-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/lead-cookie-duplicate-default-20260804
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply lead duplicate default patch
        run: python3 scripts/bootstrap-lead-cookie-duplicate-default.py

      - name: Install
        run: npm ci

      - name: Focused form duplicate contract QA
        run: npm run browser:forms:contract:qa

      - name: Production build
        run: npm run build

      - name: Commit patch
        run: |
          git config user.name "Inlet Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/api/leads.js server/index.mjs src/panels/inbox/DuplicatePolicyPanel.jsx src/preview/renderers/FormBlocks.jsx scripts/form-reservation-browser-regression-contract-check.mjs
          git commit -m "fix: allow unique contacts by default"
          git push origin HEAD:fix/lead-cookie-duplicate-default-20260804
