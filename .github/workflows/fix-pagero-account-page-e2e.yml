name: Temporary PageRo Account Page E2E Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pagero-account-page-e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update browser API mocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected source not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          form_old = """    if (pathname === `/api/pages/${slug}` && method === 'GET') {\n      state.pageGets += 1;\n      await fulfill(requestId, 200, { page });\n      return;\n    }\n\n    if (pathname === '/api/leads' && method === 'POST') {"""
          form_new = """    if (pathname === `/api/pages/${slug}` && method === 'GET') {\n      state.pageGets += 1;\n      await fulfill(requestId, 200, { page });\n      return;\n    }\n\n    if (pathname === '/api/account-page' && method === 'GET') {\n      await fulfill(requestId, 200, { page });\n      return;\n    }\n\n    if (pathname === '/api/leads' && method === 'POST') {"""
          replace_once('scripts/form-reservation-browser-regression-check.mjs', form_old, form_new)

          editor_old = """    if (pathname === '/api/projects' && method === 'GET') {\n      state.projectListCount += 1;\n      const page = state.currentPage;\n      await fulfill(requestId, 200, {\n        pages: [{\n          id: page.id,\n          projectId: page.projectId,\n          ownerId: page.ownerId,\n          title: page.title,\n          slug: page.slug,\n          status: page.status,\n          revision: page.revision,\n          updatedAt: page.updatedAt,\n          leadCount: 0,\n        }],\n      });\n      return;\n    }\n\n    if (pathname === '/api/leads' && method === 'GET') {"""
          editor_new = """    if (pathname === '/api/projects' && method === 'GET') {\n      state.projectListCount += 1;\n      const page = state.currentPage;\n      await fulfill(requestId, 200, {\n        pages: [{\n          id: page.id,\n          projectId: page.projectId,\n          ownerId: page.ownerId,\n          title: page.title,\n          slug: page.slug,\n          status: page.status,\n          revision: page.revision,\n          updatedAt: page.updatedAt,\n          leadCount: 0,\n        }],\n      });\n      return;\n    }\n\n    if (pathname === '/api/account-page' && method === 'GET') {\n      state.pageLoadCount += 1;\n      await fulfill(requestId, 200, { page: state.currentPage });\n      return;\n    }\n\n    if (pathname === '/api/leads' && method === 'GET') {"""
          replace_once('scripts/editor-browser-regression-check.mjs', editor_old, editor_new)
          PY

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-pagero-account-page-e2e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/form-reservation-browser-regression-check.mjs scripts/editor-browser-regression-check.mjs .github/workflows/fix-pagero-account-page-e2e.yml
          git commit -m 'fix(qa): mock account page fetch in browser regressions'
          git push origin HEAD:main
