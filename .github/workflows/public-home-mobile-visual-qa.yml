name: Public home mobile visual QA

on:
  pull_request:
    paths:
      - 'src/styles/base-public-home-v2.css'
      - 'src/screens/PageroCanonicalHome.jsx'
      - '.github/workflows/public-home-mobile-visual-qa.yml'

jobs:
  mobile-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare Korean font
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -o DPkg::Lock::Timeout=45 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null 2>&1 || true

      - name: Build
        run: npm run build

      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium required" >&2
            exit 1
          fi
          cat > /tmp/chrome-reduced-motion <<EOF
          #!/usr/bin/env bash
          exec "$CHROME_BIN" --force-prefers-reduced-motion=reduce "\$@"
          EOF
          chmod +x /tmp/chrome-reduced-motion
          echo "INLET_BROWSER_QA_CHROME_PATH=/tmp/chrome-reduced-motion" >> "$GITHUB_ENV"

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4177 > /tmp/pagero-home-preview.log 2>&1 &
          echo $! > /tmp/pagero-home-preview.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4177/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/pagero-home-preview.log
          exit 1

      - name: Verify 390px public home
        env:
          INLET_BROWSER_QA_URL: http://127.0.0.1:4177/
          INLET_BROWSER_QA_REQUIRE: '1'
          INLET_BROWSER_QA_VIEWPORTS: mobile
          INLET_BROWSER_QA_EXPECT_SELECTOR: '.pagerol-home-v2,.pagerol-nav,.pagerol-actions,.pagerol-hero,.pagerol-hero-showcase,.pagerol-showcase-card'
          INLET_BROWSER_QA_EXPECT_TEXT: '페이지로,로그인,시작하기,모바일 페이지를,빠르게 만드세요'
          INLET_BROWSER_QA_EXPECT_COMPUTED: '.pagerol-hero-showcase|overflow-x|auto;.pagerol-showcase-card|position|relative;.pagerol-logo|display|block;.pagerol-logo|grid-column-start|1;.pagerol-actions|grid-column-start|2;.pagerol-actions button:first-child|display|flex'
          INLET_BROWSER_QA_SCREENSHOT_DIR: .tmp-public-home-mobile-visual
        run: npm run browser:visual:qa

      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-home-mobile-390-${{ github.run_id }}
          path: .tmp-public-home-mobile-visual
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/pagero-home-preview.pid ]; then
            kill "$(cat /tmp/pagero-home-preview.pid)" 2>/dev/null || true
          fi
