name: CallTag Play Billing Live Health

on:
  workflow_dispatch:
  push:
    paths:
      - 'functions/api/billing/google/health.js'
      - '.github/workflows/calltag-play-billing-live-health.yml'

permissions:
  contents: read

jobs:
  play-billing-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check temporary health endpoint source
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/billing/google/health.js
          grep -F "packageName = 'kr.pagero.calltag'" functions/api/billing/google/health.js
          grep -F "scope: 'https://www.googleapis.com/auth/androidpublisher'" functions/api/billing/google/health.js

      - name: Verify production Google Play credentials
        shell: bash
        run: |
          set -uo pipefail
          url='https://pagero.kr/api/billing/google/health'
          body="$RUNNER_TEMP/play-health.json"
          for attempt in $(seq 1 6); do
            code="$(curl -sS --connect-timeout 8 --max-time 25 -o "$body" -w '%{http_code}' "$url" || true)"
            echo "attempt=$attempt http=$code"
            if [ "$code" = '200' ]; then
              python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); keys=('configured','oauthToken','publisherAccess','googleStatus','releaseEnabled','productsReady','code'); print(json.dumps({k:d.get(k) for k in keys},ensure_ascii=False,sort_keys=True)); sys.exit(0 if d.get('configured') is True and d.get('oauthToken') is True and d.get('publisherAccess') is True else 2)" "$body"
              if [ "$?" = '0' ]; then
                echo 'Google Play credential and Publisher API access probe passed.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Google Play credential health is not ready.' >&2
          exit 1
