name: One-time auth email production deploy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  STATUS_FILE: .deployment/auth-email-hotfix-status.json

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          node --check functions/api/auth/_ses-delivery.js
          node --check functions/api/auth/email-verification.js
          npm run build

      - name: Deploy latest main
        run: >-
          npx wrangler pages deploy dist
          --project-name inlet
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Auth email hotfix $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live authentication email API
        shell: bash
        run: |
          sleep 10
          TEST_EMAIL="support+auth-hotfix-$(date +%s)@pagero.kr"
          HTTP_CODE="$(curl -sS -o /tmp/auth-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"purpose\":\"signup\"}" \
            https://pagero.kr/api/auth/email-verification)"
          cat /tmp/auth-response.json
          mkdir -p .deployment
          HTTP_CODE="$HTTP_CODE" node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let response = null;
          try { response = JSON.parse(readFileSync('/tmp/auth-response.json', 'utf8')); } catch {}
          const httpStatus = Number(process.env.HTTP_CODE || 0);
          const ok = httpStatus >= 200 && httpStatus < 300 && response?.ok === true && response?.verification?.delivery?.status === 'sent';
          writeFileSync(process.env.STATUS_FILE, JSON.stringify({
            recordedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA || '',
            httpStatus,
            ok,
            response,
          }, null, 2) + '\n');
          if (!ok) process.exit(1);
          NODE

      - name: Record success and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add "$STATUS_FILE"
          git rm .github/workflows/deploy-auth-email-scheduled.yml
          git commit -m "fix: confirm auth email production delivery"
          git push origin HEAD:main
