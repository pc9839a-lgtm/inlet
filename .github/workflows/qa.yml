      - name: Real browser authenticated editor regression
        env:
          INLET_EDITOR_BROWSER_QA_ORIGIN: http://127.0.0.1:4174
          INLET_EDITOR_BROWSER_QA_SCREENSHOT_DIR: .tmp-editor-browser-regression
