name: QA

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Full offline QA
        run: npm run qa:all

  browser-regression:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Resolve Chrome executable
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome or Chromium is required for browser regression QA." >&2
            exit 1
          fi
          echo "INLET_BROWSER_QA_CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/inlet-preview.log 2>&1 &
          echo $! > /tmp/inlet-preview.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/inlet-preview.log
          exit 1

      - name: Real browser landing regression
        env:
          INLET_BROWSER_QA_ORIGIN: http://127.0.0.1:4173
          INLET_BROWSER_QA_SCREENSHOT_DIR: .tmp-landing-browser-regression
        run: |
          for attempt in 1 2; do
            echo "Browser regression attempt ${attempt}/2"
            if npm run browser:landing:qa; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Retrying once in case Chrome failed to open its debugging endpoint."
              sleep 2
            fi
          done
          exit 1

      - name: Upload browser regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-regression-${{ github.run_id }}
          path: .tmp-landing-browser-regression
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Stop production preview
        if: always()
        run: |
          if [ -f /tmp/inlet-preview.pid ]; then
            kill "$(cat /tmp/inlet-preview.pid)" 2>/dev/null || true
          fi

  editor-browser-regression:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build authenticated editor assets
        env:
          VITE_INLET_PAGE_MODE: server
          VITE_INLET_LEAD_MODE: server
          VITE_INLET_PUBLIC_BASE_URL: http://127.0.0.1:4174
        run: npm run build

      - name: Resolve Chrome executable
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome or Chromium is required for editor browser regression QA." >&2
            exit 1
          fi
          echo "INLET_EDITOR_BROWSER_QA_CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start authenticated editor preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/inlet-editor-preview.log 2>&1 &
          echo $! > /tmp/inlet-editor-preview.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/login > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/inlet-editor-preview.log
          exit 1

      - name: Real browser authenticated editor regression
        env:
          INLET_EDITOR_BROWSER_QA_ORIGIN: http://127.0.0.1:4174
          INLET_EDITOR_BROWSER_QA_SCREENSHOT_DIR: .tmp-editor-browser-regression
        run: |
          for attempt in 1 2; do
            echo "Editor browser regression attempt ${attempt}/2"
            if npm run browser:editor:qa; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Retrying once in case Chrome failed to open its debugging endpoint."
              sleep 2
            fi
          done
          exit 1

      - name: Upload editor browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-browser-regression-${{ github.run_id }}
          path: .tmp-editor-browser-regression
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Stop authenticated editor preview
        if: always()
        run: |
          if [ -f /tmp/inlet-editor-preview.pid ]; then
            kill "$(cat /tmp/inlet-editor-preview.pid)" 2>/dev/null || true
          fi
