name: QA

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Full offline QA
        env:
          INLET_SESSION_AUTH_MODE: production
          INLET_SESSION_SECRET: github-actions-session-secret-change-in-production
        run: npm run qa:all

