name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - .deployment/cloudflare-status.json
  workflow_dispatch:

concurrency:
  group: inlet-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy assets and Pages Functions
        id: cloudflare_deploy
        continue-on-error: true
        run: >-
          npx wrangler pages deploy dist
          --project-name inlet
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Deploy $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment result
        if: always()
        run: |
          mkdir -p .deployment
          printf '{\n  "sourceSha": "%s",\n  "outcome": "%s",\n  "recordedAt": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "${{ steps.cloudflare_deploy.outcome }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .deployment/cloudflare-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/cloudflare-status.json
          git commit -m "Record Cloudflare deployment result [skip deploy]" || exit 0
          git push

      - name: Fail when Cloudflare deployment failed
        if: steps.cloudflare_deploy.outcome != 'success'
        run: exit 1
