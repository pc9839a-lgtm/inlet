name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - .deployment/cloudflare-status.json
      - .deployment/cloudflare-deploy-error.txt
  workflow_dispatch:

concurrency:
  group: inlet-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy assets and Pages Functions
        id: cloudflare_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy $GITHUB_SHA" \
            2>&1 | tee /tmp/cloudflare-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          reason="none"
          if [ "${{ steps.cloudflare_deploy.outcome }}" != "success" ]; then
            reason="deploy_command_failed"
            if grep -Eqi "CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|non-interactive environment|not set" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="missing_cloudflare_credentials"
            elif grep -Eqi "authentication error|invalid api token|code[=: ]+10000|unauthorized|forbidden" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_auth_failed"
            elif grep -Eqi "project.*not found|unknown project|inlet.*not found" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_project_not_found"
            fi
          fi
          mkdir -p .deployment
          printf '{\n  "sourceSha": "%s",\n  "outcome": "%s",\n  "reason": "%s",\n  "recordedAt": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "${{ steps.cloudflare_deploy.outcome }}" \
            "$reason" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .deployment/cloudflare-status.json
          if [ -f /tmp/cloudflare-deploy.log ]; then
            tail -n 50 /tmp/cloudflare-deploy.log \
              | sed -E 's/[A-Za-z0-9_-]{35,}/[REDACTED]/g' \
              > .deployment/cloudflare-deploy-error.txt
          else
            printf 'No Cloudflare deployment log was created.\n' > .deployment/cloudflare-deploy-error.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment/cloudflare-status.json .deployment/cloudflare-deploy-error.txt
          git commit -m "Record Cloudflare deployment result [skip deploy]" || exit 0
          git push

      - name: Fail when Cloudflare deployment failed
        if: steps.cloudflare_deploy.outcome != 'success'
        run: exit 1
