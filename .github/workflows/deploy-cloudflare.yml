name: Deploy Cloudflare Pages

on:
  workflow_run:
    workflows:
      - QA
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: inlet-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_sha == github.sha
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy assets and Pages Functions
        id: cloudflare_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --branch main \
            --commit-hash "${{ steps.source.outputs.sha }}" \
            --commit-message "Deploy ${{ steps.source.outputs.sha }}" \
            2>&1 | tee /tmp/cloudflare-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          reason="none"
          outcome="${{ steps.cloudflare_deploy.outcome }}"
          if [ "$outcome" != "success" ]; then
            reason="deploy_command_failed"
            if grep -Eqi "CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|non-interactive environment|not set" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="missing_cloudflare_credentials"
            elif grep -Eqi "authentication error|invalid api token|code[=: ]+10000|unauthorized|forbidden" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_auth_failed"
            elif grep -Eqi "project.*not found|unknown project|inlet.*not found" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_project_not_found"
            fi
          fi

          {
            echo "## Cloudflare Pages deployment"
            echo ""
            echo "Source: \`${{ steps.source.outputs.sha }}\`"
            echo "Outcome: **$outcome**"
            echo "Reason: \`$reason\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when Cloudflare deployment failed
        if: steps.cloudflare_deploy.outcome != 'success'
        run: exit 1

  production-save-roundtrip:
    name: production-save-roundtrip
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      INLET_PRODUCTION_SAVE_BASE_URL: https://pagero.kr
      INLET_PRODUCTION_SAVE_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_EMPTY_GENERAL_SESSION }}
      PAGERO_PRODUCTION_SAVE_ALLOWED_ORIGINS: ${{ secrets.PAGERO_PAGE_LIMIT_ALLOWED_ORIGINS }}

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify production D1 save roundtrip
        shell: bash
        run: |
          set -o pipefail
          node scripts/production-save-roundtrip-check.mjs | tee production-save-roundtrip-result.json

      - name: Upload production save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-save-roundtrip-${{ github.run_id }}
          path: production-save-roundtrip-result.json
          if-no-files-found: warn
          retention-days: 30
