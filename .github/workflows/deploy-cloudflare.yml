name: Deploy Cloudflare Pages

on:
  workflow_run:
    workflows:
      - QA
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: inlet-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_sha == github.sha
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Ensure production session secret
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/pages-secrets.txt
          if grep -Eq '(^|[^A-Za-z0-9_])INLET_SESSION_SECRET([^A-Za-z0-9_]|$)' /tmp/pages-secrets.txt; then
            echo "INLET_SESSION_SECRET is already configured."
            exit 0
          fi

          echo "INLET_SESSION_SECRET is missing; creating one encrypted Pages secret."
          session_secret="$(openssl rand -hex 64)"
          printf '%s' "$session_secret" | npx wrangler pages secret put INLET_SESSION_SECRET --project-name inlet
          unset session_secret

          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/pages-secrets-after.txt
          if ! grep -Eq '(^|[^A-Za-z0-9_])INLET_SESSION_SECRET([^A-Za-z0-9_]|$)' /tmp/pages-secrets-after.txt; then
            echo "::error::INLET_SESSION_SECRET was not confirmed after secret creation."
            exit 1
          fi
          echo "INLET_SESSION_SECRET created and confirmed without exposing its value."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build production bundle
        run: npm run build

      - name: Deploy assets and Pages Functions
        id: cloudflare_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --commit-hash "${{ steps.source.outputs.sha }}" \
            --commit-message "Deploy ${{ steps.source.outputs.sha }}" \
            2>&1 | tee /tmp/cloudflare-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed readiness
        id: readiness
        if: steps.cloudflare_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          deployment_url="$(grep -Eo 'https://[a-z0-9]+\.inlet-8mr\.pages\.dev' /tmp/cloudflare-deploy.log | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "::error::Could not resolve exact Cloudflare deployment URL from deploy output."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

          probe_readiness() {
            target="$1"
            label="$2"
            output="/tmp/readiness-${label}.json"
            for attempt in $(seq 1 12); do
              http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache, no-store' \
                --output "$output" \
                --write-out '%{http_code}' \
                "$target" || true)"
              if [ "$http_code" = "200" ] && node - "$output" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          try {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            const ready = payload?.ok === true
              && payload?.ready === true
              && payload?.checks?.d1?.ready === true
              && payload?.checks?.session?.ready === true;
            process.exit(ready ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                echo "Readiness passed: $label ($target)"
                return 0
              fi
              echo "Readiness pending: $label attempt=$attempt status=${http_code:-curl-error}"
              sleep 5
            done
            echo "::error::Readiness failed for $label ($target)."
            if [ -f "$output" ]; then
              cat "$output"
            fi
            return 1
          }

          probe_readiness "$deployment_url/api/readiness" exact-deployment
          probe_readiness "https://pagero.kr/api/readiness" production-domain

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          reason="none"
          outcome="${{ steps.cloudflare_deploy.outcome }}"
          readiness_outcome="${{ steps.readiness.outcome }}"
          if [ "$outcome" != "success" ]; then
            reason="deploy_command_failed"
            if grep -Eqi "CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|non-interactive environment|not set" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="missing_cloudflare_credentials"
            elif grep -Eqi "authentication error|invalid api token|code[=: ]+10000|unauthorized|forbidden" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_auth_failed"
            elif grep -Eqi "project.*not found|unknown project|inlet.*not found" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_project_not_found"
            fi
          elif [ "$readiness_outcome" != "success" ]; then
            outcome="failure"
            reason="deployment_not_ready"
          fi

          {
            echo "## Cloudflare Pages deployment"
            echo ""
            echo "Source: \`${{ steps.source.outputs.sha }}\`"
            echo "Outcome: **$outcome**"
            echo "Reason: \`$reason\`"
            echo "Readiness: \`${readiness_outcome:-not-run}\`"
            if [ -n "${{ steps.readiness.outputs.deployment_url }}" ]; then
              echo "Deployment URL: ${{ steps.readiness.outputs.deployment_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when Cloudflare deployment or readiness failed
        if: steps.cloudflare_deploy.outcome != 'success' || steps.readiness.outcome != 'success'
        run: exit 1

  production-save-roundtrip:
    name: production-save-roundtrip
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      INLET_PRODUCTION_SAVE_BASE_URL: https://pagero.kr
      INLET_PRODUCTION_SAVE_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_EMPTY_GENERAL_SESSION || secrets.PAGERO_ADMIN_AUDIT_GENERAL_SESSION }}
      PAGERO_PRODUCTION_SAVE_ALLOWED_ORIGINS: https://pagero.kr

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check production save fixture
        id: fixture
        shell: bash
        run: |
          if [ -n "$INLET_PRODUCTION_SAVE_SESSION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            cat > production-save-roundtrip-result.json <<'JSON'
          {
            "ok": false,
            "status": "skipped-live",
            "reason": "fixture-session-missing",
            "targetOrigin": "https://pagero.kr",
            "writesAttempted": 0,
            "secretValuesIncluded": false
          }
          JSON
            echo "::warning::Production D1 save roundtrip was not executed because no dedicated QA fixture session is configured."
          fi

      - name: Verify production D1 save roundtrip
        if: steps.fixture.outputs.configured == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/production-save-roundtrip-check.mjs | tee production-save-roundtrip-result.json

      - name: Record production save verification
        if: always()
        shell: bash
        run: |
          {
            echo "## Production D1 save roundtrip"
            echo ""
            if [ "${{ steps.fixture.outputs.configured }}" = "true" ]; then
              echo "Fixture: **configured**"
              echo "Result: see production-save-roundtrip evidence"
            else
              echo "Fixture: **missing**"
              echo "Result: **skipped-live** (0 writes attempted)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-save-roundtrip-${{ github.run_id }}
          path: production-save-roundtrip-result.json
          if-no-files-found: error
          retention-days: 30
