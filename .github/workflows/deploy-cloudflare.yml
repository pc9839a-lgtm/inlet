name: Deploy Cloudflare Pages

on:
  workflow_run:
    workflows:
      - QA
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: inlet-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Detect production changes
        id: changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=no_parent_commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD^ HEAD -- . \
            ':(exclude).github/**' \
            ':(exclude).deployment/**' \
            ':(exclude)scripts/**' \
            ':(exclude)docs/**' \
            ':(exclude)*.md'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_production_changes" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=production_changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Record skipped deployment
        if: steps.changes.outputs.deploy != 'true'
        shell: bash
        run: |
          {
            echo "## Cloudflare Pages deployment"
            echo ""
            echo "Skipped: ${{ steps.changes.outputs.reason }}"
            echo "Tested source: \`${{ steps.source.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.changes.outputs.deploy == 'true'
        run: npm ci

      - name: Build production bundle
        if: steps.changes.outputs.deploy == 'true'
        run: npm run build

      - name: Deploy assets and Pages Functions
        if: steps.changes.outputs.deploy == 'true'
        id: cloudflare_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --branch main \
            --commit-hash "${{ steps.source.outputs.sha }}" \
            --commit-message "Deploy ${{ steps.source.outputs.sha }}" \
            2>&1 | tee /tmp/cloudflare-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment result
        if: always() && steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          reason="none"
          outcome="${{ steps.cloudflare_deploy.outcome }}"
          if [ "$outcome" != "success" ]; then
            reason="deploy_command_failed"
            if grep -Eqi "CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|non-interactive environment|not set" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="missing_cloudflare_credentials"
            elif grep -Eqi "authentication error|invalid api token|code[=: ]+10000|unauthorized|forbidden" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_auth_failed"
            elif grep -Eqi "project.*not found|unknown project|inlet.*not found" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_project_not_found"
            fi
          fi

          {
            echo "## Cloudflare Pages deployment"
            echo ""
            echo "Source: \`${{ steps.source.outputs.sha }}\`"
            echo "Outcome: **$outcome**"
            echo "Reason: \`$reason\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when Cloudflare deployment failed
        if: steps.changes.outputs.deploy == 'true' && steps.cloudflare_deploy.outcome != 'success'
        run: exit 1
