name: Deploy Cloudflare Pages

# Production deploys automatically after a successful QA push run on main.
# The existing exact-SHA owner-approved manual fallback remains available.
# Every deployment rechecks the current main SHA and the completed main QA result.
on:
  workflow_run:
    workflows: ["QA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA that passed a main-push QA workflow
        required: true
        type: string
      approval_phrase:
        description: Type I_APPROVE_PAGERO_PRODUCTION_DEPLOY
        required: true
        type: string

concurrency:
  group: inlet-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'QA' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read

    steps:
      - name: Verify QA-approved exact current main SHA
        id: approval
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ] || ! [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production requires current main and an exact commit SHA."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$APPROVAL_PHRASE" != "I_APPROVE_PAGERO_PRODUCTION_DEPLOY" ] || [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Manual deployment requires owner approval and an exact matching main SHA."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            node - "$GITHUB_EVENT_PATH" "$APPROVED_SHA" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sha = process.argv[3];
          const repository = process.argv[4];
          const run = event.workflow_run || {};
          if (run.name !== 'QA' || run.event !== 'push' || run.conclusion !== 'success'
            || run.status !== 'completed' || run.head_branch !== 'main'
            || run.head_sha !== sha || run.head_repository?.full_name !== repository
            || event.repository?.full_name !== repository) {
            console.error('::error::Not a successful completed first-party main-push QA run for the target SHA.');
            process.exit(1);
          }
          console.log('First-party main-push QA event validated.');
          NODE
          else
            echo "::error::Unsupported production deployment trigger."
            exit 1
          fi

          main_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main"
          qa_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/qa.yml/runs?branch=main&head_sha=$APPROVED_SHA&event=push&per_page=50"
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$main_api" -o /tmp/pagero-approved-main.json
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$qa_api" -o /tmp/pagero-approved-qa.json

          node - /tmp/pagero-approved-main.json /tmp/pagero-approved-qa.json "$APPROVED_SHA" <<'NODE'
          const fs = require('node:fs');
          const main = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const qa = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const sha = process.argv[4];
          if (main?.commit?.sha !== sha) {
            console.error('::error::main moved since deployment was approved.');
            process.exit(1);
          }
          const tested = Array.isArray(qa?.workflow_runs) && qa.workflow_runs.some(run =>
            run.head_sha === sha && run.head_branch === 'main' &&
            run.event === 'push' && run.status === 'completed' && run.conclusion === 'success');
          if (!tested) {
            console.error('::error::No successful main-push QA run found for the approved SHA.');
            process.exit(1);
          }
          console.log('Current main and successful exact-SHA QA confirmed.');
          NODE
          echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve source SHA
        id: source
        shell: bash
        run: echo "sha=${{ steps.approval.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Ensure Cloudflare production branch
        shell: bash
        run: |
          set -euo pipefail
          project_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/inlet"

          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$project_api" \
            --output /tmp/pages-project.json

          production_branch="$(node - /tmp/pages-project.json <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.success !== true || typeof payload?.result?.production_branch !== 'string') {
            process.exit(1);
          }
          process.stdout.write(payload.result.production_branch);
          NODE
          )"

          if [ "$production_branch" != "main" ]; then
            echo "::error::Cloudflare Pages production branch is '$production_branch', expected main. Refusing to mutate project settings."
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$project_api" \
            --output /tmp/pages-project-after.json

          verified_branch="$(node - /tmp/pages-project-after.json <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.success !== true || typeof payload?.result?.production_branch !== 'string') {
            process.exit(1);
          }
          process.stdout.write(payload.result.production_branch);
          NODE
          )"

          if [ "$verified_branch" != "main" ]; then
            echo "::error::Cloudflare Pages production branch is '$verified_branch', expected 'main'."
            exit 1
          fi
          echo "Cloudflare Pages production branch confirmed: main."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc

      - name: Verify Cloudflare Git auto-deploy is disabled
        env:
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGERO_CLOUDFLARE_AUTODEPLOY_MODE: audit
        run: node scripts/pagero-cloudflare-git-autodeploy-guard.mjs

      - name: Ensure production session secret
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/pages-secrets.txt

          if grep -Eq '(^|[^A-Za-z0-9_])INLET_SESSION_SECRET([^A-Za-z0-9_]|$)' /tmp/pages-secrets.txt; then
            echo "Legacy INLET_SESSION_SECRET is present and will not be changed."
          else
            echo "Legacy INLET_SESSION_SECRET is not present; no legacy secret mutation will be attempted."
          fi

          if grep -Eq '(^|[^A-Za-z0-9_])INLET_SESSION_SECRET_V2([^A-Za-z0-9_]|$)' /tmp/pages-secrets.txt; then
            echo "INLET_SESSION_SECRET_V2 is already configured."
            exit 0
          fi

          echo "INLET_SESSION_SECRET_V2 is missing; creating one encrypted Pages secret."
          session_secret_v2="$(openssl rand -hex 64)"
          printf '%s' "$session_secret_v2" | npx wrangler pages secret put INLET_SESSION_SECRET_V2 --project-name inlet
          unset session_secret_v2

          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/pages-secrets-after.txt
          if ! grep -Eq '(^|[^A-Za-z0-9_])INLET_SESSION_SECRET_V2([^A-Za-z0-9_]|$)' /tmp/pages-secrets-after.txt; then
            echo "::error::INLET_SESSION_SECRET_V2 was not confirmed after secret creation."
            exit 1
          fi
          echo "INLET_SESSION_SECRET_V2 created and confirmed without exposing its value."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc

      - name: Ensure production custom-domain provider secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DOMAIN_CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${DOMAIN_CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare credentials required for custom-domain runtime are missing."
            exit 1
          fi

          printf '%s' "$DOMAIN_CLOUDFLARE_API_TOKEN" | npx wrangler pages secret put INLET_CLOUDFLARE_API_TOKEN --project-name inlet >/tmp/domain-provider-token-put.log 2>&1
          printf '%s' "$DOMAIN_CLOUDFLARE_ACCOUNT_ID" | npx wrangler pages secret put INLET_CLOUDFLARE_ACCOUNT_ID --project-name inlet >/tmp/domain-provider-account-put.log 2>&1
          printf '%s' 'inlet' | npx wrangler pages secret put INLET_CLOUDFLARE_PAGES_PROJECT --project-name inlet >/tmp/domain-provider-project-put.log 2>&1

          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/pages-secrets-domain-provider.txt
          for name in INLET_CLOUDFLARE_API_TOKEN INLET_CLOUDFLARE_ACCOUNT_ID INLET_CLOUDFLARE_PAGES_PROJECT; do
            if ! grep -Eq "(^|[^A-Za-z0-9_])${name}([^A-Za-z0-9_]|$)" /tmp/pages-secrets-domain-provider.txt; then
              echo "::error::${name} was not confirmed after custom-domain provider setup."
              exit 1
            fi
          done
          echo "Custom-domain provider runtime secrets confirmed without exposing values."
        env:
          DOMAIN_CLOUDFLARE_API_TOKEN: ${{ secrets.INLET_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.INLET_CLOUDFLARE_ACCOUNT_ID || 'eec4828f6c3ab1c52683f0d47767e8fc' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc

      - name: Rotate production save QA secret
        shell: bash
        run: |
          set -euo pipefail
          qa_secret="$(openssl rand -hex 64)"
          echo "::add-mask::$qa_secret"
          printf '%s' "$qa_secret" | npx wrangler pages secret put INLET_PRODUCTION_QA_SECRET --project-name inlet >/tmp/production-qa-secret-put.log 2>&1
          echo "INLET_PRODUCTION_SAVE_QA_SECRET=$qa_secret" >> "$GITHUB_ENV"
          unset qa_secret

          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/pages-secrets-qa.txt
          if ! grep -Eq '(^|[^A-Za-z0-9_])INLET_PRODUCTION_QA_SECRET([^A-Za-z0-9_]|$)' /tmp/pages-secrets-qa.txt; then
            echo "::error::INLET_PRODUCTION_QA_SECRET was not confirmed after rotation."
            exit 1
          fi
          echo "Production save QA secret rotated and masked for this deployment."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc

      - name: Build production bundle
        run: npm run build

      - name: Recheck current main before uploading production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" -o /tmp/pagero-main-before-upload.json
          node - /tmp/pagero-main-before-upload.json "${{ steps.source.outputs.sha }}" <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (state?.commit?.sha !== process.argv[3]) {
            console.error('::error::main moved during build; production upload blocked.');
            process.exit(1);
          }
          NODE

      - name: Deploy assets and Pages Functions
        id: cloudflare_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name inlet \
            --branch main \
            --commit-hash "${{ steps.source.outputs.sha }}" \
            --commit-message "Deploy ${{ steps.source.outputs.sha }}" \
            2>&1 | tee /tmp/cloudflare-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc

      - name: Verify deployment environment metadata
        id: deployment_meta
        if: steps.cloudflare_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(sed -nE 's#^.*Deployment complete! Take a peek over at (https://[^[:space:]]+).*$#\1#p' /tmp/cloudflare-deploy.log | tail -n 1)"
          short_id="$(printf '%s' "$deployment_url" | sed -nE 's#https://([a-z0-9]+)\.inlet-8mr\.pages\.dev.*#\1#p')"
          if [ -z "$short_id" ]; then
            echo "::error::Could not resolve deployment short id from Wrangler output."
            exit 1
          fi

          deployments_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/inlet/deployments?per_page=20"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$deployments_api" \
            --output /tmp/pages-deployments.json

          node - /tmp/pages-deployments.json "$short_id" "${{ steps.source.outputs.sha }}" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const shortId = String(process.argv[3] || '');
          const expectedSha = String(process.argv[4] || '');
          if (payload?.success !== true || !Array.isArray(payload?.result)) {
            console.error('::error::Cloudflare deployment metadata response was invalid.');
            process.exit(1);
          }
          const deployment = payload.result.find((item) => String(item?.short_id || '') === shortId);
          if (!deployment) {
            console.error(`::error::Cloudflare deployment metadata not found for short id ${shortId}.`);
            process.exit(1);
          }

          const environment = String(deployment?.environment || '');
          const branch = String(deployment?.deployment_trigger?.metadata?.branch || '');
          const commitHash = String(deployment?.deployment_trigger?.metadata?.commit_hash || '');
          const legacySecretBinding = deployment?.env_vars?.INLET_SESSION_SECRET;
          const legacySecretBindingType = String(legacySecretBinding?.type || 'missing');
          const secretBinding = deployment?.env_vars?.INLET_SESSION_SECRET_V2;
          const secretBindingType = String(secretBinding?.type || 'missing');
          const secretBindingPresent = secretBindingType === 'secret_text';
          const domainProviderBindings = {
            INLET_CLOUDFLARE_API_TOKEN: String(deployment?.env_vars?.INLET_CLOUDFLARE_API_TOKEN?.type || 'missing'),
            INLET_CLOUDFLARE_ACCOUNT_ID: String(deployment?.env_vars?.INLET_CLOUDFLARE_ACCOUNT_ID?.type || 'missing'),
            INLET_CLOUDFLARE_PAGES_PROJECT: String(deployment?.env_vars?.INLET_CLOUDFLARE_PAGES_PROJECT?.type || 'missing'),
          };
          const domainProviderReady = Object.values(domainProviderBindings).every((type) => type === 'secret_text');
          const commitMatches = commitHash === expectedSha;

          console.log(JSON.stringify({
            shortId,
            environment,
            branch,
            commitMatches,
            sessionSecretV2BindingPresent: secretBindingPresent,
            sessionSecretV2BindingType: secretBindingType,
            legacySessionSecretBindingType: legacySecretBindingType,
            domainProviderBindings,
            domainProviderReady,
            secretValueLogged: false,
          }, null, 2));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `environment=${environment}`,
            `branch=${branch}`,
            `commit_matches=${commitMatches}`,
            `session_secret_present=${secretBindingPresent}`,
            `session_secret_type=${secretBindingType}`,
            `domain_provider_ready=${domainProviderReady}`,
            '',
          ].join('\n'));

          if (environment !== 'production') {
            console.error(`::error::Deployment ${shortId} is '${environment}', expected 'production'.`);
            process.exit(1);
          }
          if (branch !== 'main') {
            console.error(`::error::Deployment ${shortId} branch is '${branch}', expected 'main'.`);
            process.exit(1);
          }
          if (!commitMatches) {
            console.error(`::error::Deployment ${shortId} commit hash does not match tested source SHA.`);
            process.exit(1);
          }
          if (!secretBindingPresent) {
            console.error(`::error::Deployment ${shortId} does not contain INLET_SESSION_SECRET_V2 as a secret_text binding.`);
            process.exit(1);
          }
          if (!domainProviderReady) {
            console.error(`::error::Deployment ${shortId} is missing one or more custom-domain provider secret bindings.`);
            process.exit(1);
          }
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc

      - name: Verify deployed readiness
        id: readiness
        if: steps.cloudflare_deploy.outcome == 'success' && steps.deployment_meta.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          deployment_url="$(sed -nE 's#^.*Deployment complete! Take a peek over at (https://[^[:space:]]+).*$#\1#p' /tmp/cloudflare-deploy.log | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "::error::Could not resolve exact Cloudflare deployment URL from deploy output."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

          probe_readiness() {
            target="$1"
            label="$2"
            attempts="$3"
            output="/tmp/readiness-${label}.json"
            for attempt in $(seq 1 "$attempts"); do
              http_code="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache, no-store' \
                --output "$output" \
                --write-out '%{http_code}' \
                "$target" || true)"
              if [ "$http_code" = "200" ] && node - "$output" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          try {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            const ready = payload?.ok === true
              && payload?.ready === true
              && payload?.checks?.d1?.ready === true
              && payload?.checks?.session?.ready === true
              && payload?.checks?.authEmail?.ready === true;
            process.exit(ready ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                echo "Readiness passed: $label ($target)"
                return 0
              fi
              echo "Readiness pending: $label attempt=$attempt status=${http_code:-curl-error}"
              if [ "$attempt" -lt "$attempts" ]; then
                sleep 5
              fi
            done
            if [ -f "$output" ]; then
              cat "$output"
            fi
            return 1
          }

          exact_ready=false
          production_ready=false

          if probe_readiness "$deployment_url/api/readiness" exact-deployment 3; then
            exact_ready=true
          fi
          echo "exact_deployment_ready=$exact_ready" >> "$GITHUB_OUTPUT"

          if probe_readiness "https://pagero.kr/api/readiness" production-domain 12; then
            production_ready=true
          fi
          echo "production_domain_ready=$production_ready" >> "$GITHUB_OUTPUT"

          if [ "$exact_ready" != "true" ]; then
            echo "::warning::Exact deployment readiness failed; deployment runtime bindings are unhealthy before custom-domain routing is considered."
          fi
          if [ "$production_ready" != "true" ]; then
            echo "::error::Production domain readiness failed."
            exit 1
          fi

      - name: Verify deployed asset and cache graph
        id: asset_check
        if: steps.readiness.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          deployment_url="${{ steps.readiness.outputs.deployment_url }}"
          if [ -z "$deployment_url" ]; then
            echo "::error::Exact deployment URL is missing; asset/cache verification cannot run."
            exit 1
          fi
          node scripts/deployment-live-asset-check.mjs "$deployment_url" | tee deployment-asset-check-exact.json
          node scripts/deployment-live-asset-check.mjs "https://pagero.kr" | tee deployment-asset-check-production.json

      - name: Upload deployed asset evidence
        if: always() && steps.asset_check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-asset-check-${{ github.run_id }}
          path: |
            deployment-asset-check-exact.json
            deployment-asset-check-production.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify PageRo public browser launch smoke
        id: pagero_browser_smoke
        if: steps.asset_check.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          INLET_PRODUCTION_QA_URL: https://pagero.kr
          INLET_PRODUCTION_BROWSER_QA_REQUIRE: '1'
          INLET_PRODUCTION_QA_INCLUDE_AUTHENTICATED: '0'
          INLET_PRODUCTION_QA_INCLUDE_MOCKS: '0'
          INLET_PRODUCTION_QA_INCLUDE_NEXT_SETTINGS: '0'
        run: |
          set -o pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "::error::A real Chrome or Chromium browser is required for the PageRo production launch smoke."
            exit 1
          fi
          export INLET_BROWSER_QA_CHROME_PATH="$chrome_bin"
          npm run browser:production:qa | tee pagero-production-browser-result.json

      - name: Upload PageRo public browser evidence
        if: always() && steps.pagero_browser_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pagero-public-browser-${{ github.run_id }}
          path: |
            pagero-production-browser-result.json
            .tmp-browser-visual/production-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Verify production D1 save roundtrip
        id: production_save
        if: steps.readiness.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          INLET_PRODUCTION_SAVE_BASE_URL: https://pagero.kr
          PAGERO_PRODUCTION_SAVE_ALLOWED_ORIGINS: https://pagero.kr
          INLET_PRODUCTION_SAVE_QA_MINT_RETRY_ATTEMPTS: '12'
          INLET_PRODUCTION_SAVE_QA_MINT_RETRY_DELAY_MS: '2500'
        run: |
          set -o pipefail
          node scripts/production-save-roundtrip-check.mjs | tee production-save-roundtrip-result.json

      - name: Upload production save evidence
        if: always() && steps.production_save.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-save-roundtrip-${{ github.run_id }}
          path: production-save-roundtrip-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify CallTag external integration CRUD
        id: calltag_external_smoke
        if: steps.readiness.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CALLTAG_EXTERNAL_SMOKE_BASE_URL: https://pagero.kr
          CALLTAG_EXTERNAL_SMOKE_MINT_ATTEMPTS: '12'
          CALLTAG_EXTERNAL_SMOKE_MINT_DELAY_MS: '2500'
        run: |
          set -o pipefail
          node scripts/calltag-external-production-smoke.mjs | tee calltag-external-production-smoke-result.json

      - name: Upload CallTag external integration evidence
        if: always() && steps.calltag_external_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: calltag-external-production-smoke-${{ github.run_id }}
          path: calltag-external-production-smoke-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          reason="none"
          outcome="${{ steps.cloudflare_deploy.outcome }}"
          metadata_outcome="${{ steps.deployment_meta.outcome }}"
          readiness_outcome="${{ steps.readiness.outcome }}"
          asset_check_outcome="${{ steps.asset_check.outcome }}"
          pagero_browser_smoke_outcome="${{ steps.pagero_browser_smoke.outcome }}"
          production_save_outcome="${{ steps.production_save.outcome }}"
          calltag_external_smoke_outcome="${{ steps.calltag_external_smoke.outcome }}"
          if [ "$outcome" != "success" ]; then
            reason="deploy_command_failed"
            if grep -Eqi "CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|non-interactive environment|not set" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="missing_cloudflare_credentials"
            elif grep -Eqi "authentication error|invalid api token|code[=: ]+10000|unauthorized|forbidden" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_auth_failed"
            elif grep -Eqi "project.*not found|unknown project|inlet.*not found" /tmp/cloudflare-deploy.log 2>/dev/null; then
              reason="cloudflare_project_not_found"
            fi
          elif [ "$metadata_outcome" != "success" ]; then
            outcome="failure"
            reason="deployment_metadata_invalid"
          elif [ "$readiness_outcome" != "success" ]; then
            outcome="failure"
            reason="deployment_not_ready"
          elif [ "$asset_check_outcome" != "success" ]; then
            outcome="failure"
            reason="deployed_asset_graph_invalid"
          elif [ "$pagero_browser_smoke_outcome" != "success" ]; then
            outcome="failure"
            reason="pagero_public_browser_smoke_failed"
          elif [ "$production_save_outcome" != "success" ]; then
            outcome="failure"
            reason="production_save_roundtrip_failed"
          elif [ "$calltag_external_smoke_outcome" != "success" ]; then
            outcome="failure"
            reason="calltag_external_integration_smoke_failed"
          fi

          {
            echo "## Cloudflare Pages deployment"
            echo ""
            echo "Source: \`${{ steps.source.outputs.sha }}\`"
            echo "Outcome: **$outcome**"
            echo "Reason: \`$reason\`"
            echo "Environment metadata: \`${metadata_outcome:-not-run}\`"
            echo "Environment: \`${{ steps.deployment_meta.outputs.environment || 'unknown' }}\`"
            echo "Branch: \`${{ steps.deployment_meta.outputs.branch || 'unknown' }}\`"
            echo "Session secret V2 binding: \`${{ steps.deployment_meta.outputs.session_secret_type || 'unknown' }}\`"
            echo "Production readiness: \`${{ steps.readiness.outputs.production_domain_ready || 'false' }}\`"
            echo "Exact deployment readiness: \`${{ steps.readiness.outputs.exact_deployment_ready || 'unknown' }}\`"
            echo "Asset/cache graph: \`${asset_check_outcome:-not-run}\`"
            echo "PageRo production browser: \`${pagero_browser_smoke_outcome:-not-run}\`"
            echo "Production save roundtrip: \`${production_save_outcome:-not-run}\`"
            echo "CallTag external integration CRUD: \`${calltag_external_smoke_outcome:-not-run}\`"
            if [ -n "${{ steps.readiness.outputs.deployment_url }}" ]; then
              echo "Deployment URL: ${{ steps.readiness.outputs.deployment_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when PageRo browser, readiness, deployment, live save, or external smoke failed
        if: steps.cloudflare_deploy.outcome != 'success' || steps.deployment_meta.outcome != 'success' || steps.readiness.outcome != 'success' || (steps.readiness.outcome == 'success' && steps.asset_check.outcome != 'success') || (steps.asset_check.outcome == 'success' && steps.pagero_browser_smoke.outcome != 'success') || (steps.readiness.outcome == 'success' && steps.production_save.outcome != 'success') || (steps.readiness.outcome == 'success' && steps.calltag_external_smoke.outcome != 'success')
        run: exit 1

