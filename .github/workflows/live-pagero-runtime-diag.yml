name: Live pagero mobile runtime diagnostic
# rerun-after-root-fix-20260928-1554
on:
  push:
    branches:
      - diag/live-home-runtime-20260928

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture live root and CSS
        run: |
          mkdir -p .tmp-live-diag
          stamp="$(date +%s)"
          curl -sS -D .tmp-live-diag/root-headers.txt -H 'Cache-Control: no-cache, no-store' "https://pagero.kr/?diag=$stamp" -o .tmp-live-diag/root.html
          css="/c63-assets/index-B0Q5rFVf.css"
          curl -sS -D .tmp-live-diag/css-headers.txt -H 'Cache-Control: no-cache, no-store' "https://pagero.kr${css}?diag=$stamp" -o .tmp-live-diag/live.css
          {
            echo "=== live root scripts/styles ==="
            grep -oE '<script[^>]+src="[^"]+"' .tmp-live-diag/root.html || true
            grep -oE '<link[^>]+href="[^"]+"' .tmp-live-diag/root.html || true
            echo "=== live CSS marker ==="
            grep -n 'Mobile-only optimization for the currently deployed pagero-exact-home' .tmp-live-diag/live.css || true
            echo "=== CSS mobile selectors ==="
            grep -n -E '#leads \.form-phone|#leads \.mock-zone|\.fixed-inner|\.pagero-exact-home \.nav' .tmp-live-diag/live.css | tail -40 || true
          } > .tmp-live-diag/summary.txt
      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Capture live mobile screenshots
        run: |
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=430,932             --virtual-time-budget=6000             --screenshot=.tmp-live-diag/live-top-430.png             'https://pagero.kr/?diag=top' >/tmp/chrome-top.log 2>&1 || true
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=430,932             --virtual-time-budget=6000             --screenshot=.tmp-live-diag/live-leads-430.png             'https://pagero.kr/?diag=leads#leads' >/tmp/chrome-leads.log 2>&1 || true
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=430,932             --virtual-time-budget=6000             --dump-dom 'https://pagero.kr/?diag=dom#leads' > .tmp-live-diag/rendered-dom.html 2> .tmp-live-diag/chrome-stderr.txt
          {
            echo "=== rendered class counts ==="
            printf "pagero-exact-home: "; grep -o 'pagero-exact-home' .tmp-live-diag/rendered-dom.html | wc -l
            printf "pagerol-home-v2: "; grep -o 'pagerol-home-v2' .tmp-live-diag/rendered-dom.html | wc -l
          } >> .tmp-live-diag/summary.txt
      - name: Show evidence
        run: |
          cat .tmp-live-diag/summary.txt
          echo "=== css headers ==="
          cat .tmp-live-diag/css-headers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: live-pagero-runtime-diag-${{ github.run_id }}
          path: .tmp-live-diag
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
