name: Deploy and verify auth email hotfix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pagero-auth-email-live-check
  cancel-in-progress: true

jobs:
  verify:
    if: startsWith(github.event.pull_request.head.ref, 'ops/auth-email-deploy-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          node --check functions/api/auth/_ses-delivery.js
          node --check functions/api/auth/email-verification.js
          npm run build

      - name: Deploy latest main to Cloudflare Pages
        run: >-
          npx wrangler pages deploy dist
          --project-name inlet
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "Pagero and CallTag auth email hotfix"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Request real verification email to reported address
        shell: bash
        run: |
          sleep 10
          set +e
          TEST_EMAIL="pc9839a@naver.com"
          curl -sS -D /tmp/headers.txt -o /tmp/body.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"purpose\":\"signup\"}" \
            https://pagero.kr/api/auth/email-verification > /tmp/status.txt
          CURL_CODE=$?
          set -e
          mkdir -p .diagnostics
          CURL_CODE="$CURL_CODE" node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (path) => { try { return readFileSync(path, 'utf8'); } catch { return ''; } };
          let parsed = null;
          try { parsed = JSON.parse(read('/tmp/body.json')); } catch {}
          writeFileSync('.diagnostics/auth-email-live-after-hotfix.json', JSON.stringify({
            recordedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA || '',
            testDomain: 'naver.com',
            httpStatus: Number(read('/tmp/status.txt').trim() || 0),
            curlCode: Number(process.env.CURL_CODE || 0),
            response: parsed || read('/tmp/body.json').slice(0, 4000),
          }, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auth-live-result
          git add .diagnostics/auth-email-live-after-hotfix.json
          git commit -m "Record live Pagero and CallTag auth email response"
          git push --force origin HEAD:auth-live-result

      - name: Require successful verification delivery
        shell: bash
        run: |
          node - <<'NODE'
          const result = require('./.diagnostics/auth-email-live-after-hotfix.json');
          if (result.httpStatus < 200 || result.httpStatus >= 300) process.exit(1);
          if (!result.response?.ok) process.exit(1);
          if (result.response?.verification?.delivery?.status !== 'sent') process.exit(1);
          NODE
