name: Deploy and run auth storage diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npm run deploy:pages 2>&1 | tee /tmp/deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)"
          test -n "$DEPLOYMENT_URL"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Run production-bound D1 diagnostic
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          HTTP_STATUS="$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -o /tmp/auth-storage-live.json \
            -w '%{http_code}' \
            "$DEPLOYMENT_URL/api/diagnostics/auth-verification-storage")"
          CURL_CODE=$?
          set -e
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let body = null;
          try { body = JSON.parse(readFileSync('/tmp/auth-storage-live.json', 'utf8')); }
          catch { body = { parseFailed: true }; }
          const result = {
            sourceSha: process.env.GITHUB_SHA,
            deploymentUrl: process.env.DEPLOYMENT_URL,
            recordedAt: new Date().toISOString(),
            httpStatus: Number(process.env.HTTP_STATUS || 0),
            curlCode: Number(process.env.CURL_CODE || 0),
            result: body,
          };
          writeFileSync('.diagnostics/auth-email-verification-live.json', `${JSON.stringify(result, null, 2)}\n`);
          NODE
        env:
          HTTP_STATUS: ${{ env.HTTP_STATUS }}
          CURL_CODE: ${{ env.CURL_CODE }}

      - name: Record result
        shell: bash
        run: |
          # Recompute status fields because shell-local vars are not exported across steps.
          HTTP_STATUS="$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -o /tmp/auth-storage-live-final.json \
            -w '%{http_code}' \
            "$DEPLOYMENT_URL/api/diagnostics/auth-verification-storage")"
          export HTTP_STATUS
          export CURL_CODE=0
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let body = null;
          try { body = JSON.parse(readFileSync('/tmp/auth-storage-live-final.json', 'utf8')); }
          catch { body = { parseFailed: true }; }
          writeFileSync('.diagnostics/auth-email-verification-live.json', `${JSON.stringify({
            sourceSha: process.env.GITHUB_SHA,
            deploymentUrl: process.env.DEPLOYMENT_URL,
            recordedAt: new Date().toISOString(),
            httpStatus: Number(process.env.HTTP_STATUS || 0),
            curlCode: Number(process.env.CURL_CODE || 0),
            result: body,
          }, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/auth-email-verification-live.json
          git commit -m "Record auth verification live diagnostic [skip diagnostic]"
          git pull --rebase origin main
          git push origin HEAD:main
