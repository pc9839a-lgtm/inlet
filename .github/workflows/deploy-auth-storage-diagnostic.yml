name: Capture live auth storage response

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture live response
        shell: bash
        run: |
          set +e
          curl -sS -D /tmp/headers.txt \
            -o /tmp/body.txt \
            -w '%{http_code}' \
            https://pagero.kr/api/diagnostics/auth-verification-storage \
            > /tmp/status.txt
          CURL_CODE=$?
          set -e
          mkdir -p .diagnostics
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (path) => { try { return readFileSync(path, 'utf8'); } catch { return ''; } };
          writeFileSync('.diagnostics/auth-email-verification-live-response.json', `${JSON.stringify({
            recordedAt: new Date().toISOString(),
            curlCode: Number(process.env.CURL_CODE || 0),
            httpStatus: Number(read('/tmp/status.txt').trim() || 0),
            headers: read('/tmp/headers.txt').slice(0, 4000),
            body: read('/tmp/body.txt').slice(0, 12000),
          }, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auth-diagnostic-result
          git add .diagnostics/auth-email-verification-live-response.json
          git commit -m "Record live auth verification response"
          git push --force origin HEAD:auth-diagnostic-result
        env:
          CURL_CODE: 0
