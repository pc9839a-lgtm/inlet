name: Deploy and run auth storage diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy and query production-bound D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:pages 2>&1 | tee /tmp/deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)"
          test -n "$DEPLOYMENT_URL"

          set +e
          HTTP_STATUS="$(curl -sS \
            -o /tmp/auth-storage-live-body.json \
            -w '%{http_code}' \
            "$DEPLOYMENT_URL/api/diagnostics/auth-verification-storage")"
          CURL_CODE=$?
          set -e

          export DEPLOYMENT_URL HTTP_STATUS CURL_CODE
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let body;
          try { body = JSON.parse(readFileSync('/tmp/auth-storage-live-body.json', 'utf8')); }
          catch { body = { parseFailed: true }; }
          writeFileSync('/tmp/auth-email-verification-live.json', `${JSON.stringify({
            sourceSha: process.env.GITHUB_SHA,
            deploymentUrl: process.env.DEPLOYMENT_URL,
            recordedAt: new Date().toISOString(),
            httpStatus: Number(process.env.HTTP_STATUS || 0),
            curlCode: Number(process.env.CURL_CODE || 0),
            result: body,
          }, null, 2)}\n`);
          NODE

      - name: Record diagnostic result without deploy-file conflicts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .diagnostics
          cp /tmp/auth-email-verification-live.json .diagnostics/auth-email-verification-live.json
          git add .diagnostics/auth-email-verification-live.json
          git commit -m "Record auth verification live diagnostic [skip diagnostic]"
          git push origin HEAD:main
