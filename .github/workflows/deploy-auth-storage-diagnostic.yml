name: Capture exact auth result from production domain

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact live result
        shell: bash
        run: |
          set -euo pipefail
          curl -sS https://pagero.kr/api/diagnostics/auth-verification-storage > /tmp/result.json
          mkdir -p .diagnostics
          cp /tmp/result.json .diagnostics/auth-email-verification-exact-shape.json
          printf '\n' >> .diagnostics/auth-email-verification-exact-shape.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auth-diagnostic-result
          git add .diagnostics/auth-email-verification-exact-shape.json
          git commit -m "Record exact auth verification record diagnostic"
          git push --force origin HEAD:auth-diagnostic-result
