name: Capture auth storage diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth-storage-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy and capture result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:pages 2>&1 | tee /tmp/deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)"
          test -n "$DEPLOYMENT_URL"
          curl -sS "$DEPLOYMENT_URL/api/diagnostics/auth-verification-storage" > /tmp/result.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/result.json','utf8'))"
          mkdir -p .diagnostics
          cp /tmp/result.json .diagnostics/auth-email-verification-live.json
          printf '\n' >> .diagnostics/auth-email-verification-live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B diagnostic/auth-verification-result
          git add .diagnostics/auth-email-verification-live.json
          git commit -m "Record isolated auth verification diagnostic"
          git push --force origin HEAD:diagnostic/auth-verification-result
