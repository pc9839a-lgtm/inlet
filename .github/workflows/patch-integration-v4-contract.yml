name: Patch current integration QA contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-integration-v4-contract.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update integration contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/integration-contract-check.mjs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "'stats-partial-notice',": "'stats-v4-notice',",
              "], 'stats panel contract');": "], 'stats v4 panel contract');",
              "'const hasPartialLeadList = serverTotal > loadedCount',": "'const displaySummary = serverTotal > loadedCount',",
              "'<strong>{serverTotal}</strong>',": "'서버 ${serverTotal}건 중 ${loadedCount}건 로드',",
              "'totalSummaryLabel',": "'{filtered.length} / {serverTotal}건',",
              "'loadedScopeLabel',": "'inbox-ops-table-footer',",
              "'lead-risk-badge',": "'inbox-ops-mini-badge',",
              "'riskInfo.reasons.join',": "'selectedRiskInfo.reasons.join',",
              "'riskInfo.score',": "'selectedRiskInfo.score',",
              "'lead-delivery-badge',": "'inbox-ops-mini-badge delivery',",
              "], 'inbox month and pagination contract');": "], 'inbox current month, pagination, risk, and delivery contract');",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected integration QA token missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and dispatch full QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/patch-integration-v4-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/integration-contract-check.mjs .github/workflows/patch-integration-v4-contract.yml
          git commit -m "fix(qa): validate current stats and inbox integration contracts"
          git push origin HEAD:main
          gh workflow run qa.yml --ref main
