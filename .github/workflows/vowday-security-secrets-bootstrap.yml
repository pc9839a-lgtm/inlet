name: VOWDAY Security Secrets Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vowday-security-secrets-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: vowday-security-secrets-bootstrap
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Rotate VOWDAY relay and bridge secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          relay_secret="$(openssl rand -hex 64)"
          bridge_secret="$(openssl rand -hex 64)"
          echo "::add-mask::$relay_secret"
          echo "::add-mask::$bridge_secret"

          printf '%s' "$relay_secret" | npx wrangler pages secret put VOWDAY_RELAY_SECRET --project-name inlet >/tmp/inlet-relay.log 2>&1
          printf '%s' "$relay_secret" | npx wrangler pages secret put VOWDAY_RELAY_SECRET --project-name wedding-day-service >/tmp/wedding-relay.log 2>&1
          printf '%s' "$bridge_secret" | npx wrangler pages secret put VOWDAY_BRIDGE_SECRET --project-name wedding-day-service >/tmp/wedding-bridge.log 2>&1

          bridge_hash="$(printf '%s' "$bridge_secret" | sha256sum | awk '{print $1}')"
          echo "VOWDAY_BRIDGE_SECRET_SHA256=$bridge_hash"

          unset relay_secret bridge_secret

          npx wrangler pages secret list --project-name inlet 2>&1 | tee /tmp/inlet-secrets.txt
          npx wrangler pages secret list --project-name wedding-day-service 2>&1 | tee /tmp/wedding-secrets.txt

          grep -Eq '(^|[^A-Za-z0-9_])VOWDAY_RELAY_SECRET([^A-Za-z0-9_]|$)' /tmp/inlet-secrets.txt
          grep -Eq '(^|[^A-Za-z0-9_])VOWDAY_RELAY_SECRET([^A-Za-z0-9_]|$)' /tmp/wedding-secrets.txt
          grep -Eq '(^|[^A-Za-z0-9_])VOWDAY_BRIDGE_SECRET([^A-Za-z0-9_]|$)' /tmp/wedding-secrets.txt

          echo "VOWDAY security secrets rotated and confirmed."
