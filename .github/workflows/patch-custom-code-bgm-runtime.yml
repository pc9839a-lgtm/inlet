name: Patch DYJH Hero Flush Top

on:
  push:
    paths:
      - '.github/workflows/patch-custom-code-bgm-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove top gap from DYJH wedding hero only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/preview/renderers/UtilityBlocks.jsx')
          text = path.read_text()

          old = "    marginLeft: '-12px',\n    marginRight: '-12px',\n    borderRadius: 0,\n"
          new = "    marginLeft: '-12px',\n    marginRight: '-12px',\n    marginTop: isDyjhWeddingCover ? '-12px' : undefined,\n    borderRadius: 0,\n"

          if "marginTop: isDyjhWeddingCover ? '-12px' : undefined" not in text:
              if old not in text:
                  raise SystemExit('RenderCustomCode sectionStyle marker not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/preview/renderers/UtilityBlocks.jsx
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix(pagero): remove dyjh hero top gap'
          git pull --rebase origin main
          git push origin HEAD:main

