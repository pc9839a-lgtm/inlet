# This former write-capable workflow is retired to prevent bypassing the
# approved, exact-SHA manual production release of the shared inlet project.
# Keep this inert redirect until all legacy references are removed in a
# separate, reviewed cleanup. It must not run on push/PR/issues/workflow_run.
name: "Patch Page Save Capacity (retired)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Redirect to approved production release
        run: |
          echo "::notice::Legacy workflow retired: no Cloudflare deployment, runtime mutation, or branch write is performed."
          echo "Use the manually approved Deploy Cloudflare Pages workflow on the exact tested main SHA."
