name: Patch Custom Code BGM Runtime

on:
  push:
    paths:
      - '.github/workflows/patch-custom-code-bgm-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route wedding BGM to verified audio CDN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/preview/renderers/UtilityBlocks.jsx')
          text = path.read_text()

          constant = "const WEDDING_BGM_CDN = 'https://res.cloudinary.com/dwz5e6lsq/video/upload/v1787910677/pagero/wedding/wedding-bgm-main.mp3';\n"
          marker = "const CUSTOM_CODE_MESSAGE = 'pagero-custom-code';\n"
          if 'const WEDDING_BGM_CDN =' not in text:
              if marker not in text:
                  raise SystemExit('CUSTOM_CODE_MESSAGE marker not found')
              text = text.replace(marker, marker + constant, 1)

          old = "  const src = String(forcedSrc || s.bgmSrc || extractBgmSrcFromHtml(s.html) || '').trim();"
          new = "  const requestedSrc = String(forcedSrc || s.bgmSrc || extractBgmSrcFromHtml(s.html) || '').trim();\n  const src = /(?:^|\\/)assets\\/wedding\\/(?:wedding-bgm-v2|hitslab-wedding-wedding-trailer-music-269139)\\.mp3(?:[?#].*)?$/i.test(requestedSrc)\n    ? WEDDING_BGM_CDN\n    : requestedSrc;"
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const requestedSrc =' not in text:
              raise SystemExit('BGM src marker not found')

          path.write_text(text)
          PY

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/preview/renderers/UtilityBlocks.jsx
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix(pagero): serve wedding BGM from verified CDN'
          git pull --rebase origin main
          git push origin HEAD:main

