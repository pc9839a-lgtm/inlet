name: Patch Page Save Capacity

on:
  push:
    paths:
      - '.github/workflows/patch-custom-code-bgm-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raise page JSON save capacity within D1 hard limit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server_path = Path('server/storage/d1Adapter.mjs')
          server_text = server_path.read_text()
          old_server = 'const D1_PAGE_JSON_MAX_BYTES = 1_000_000;'
          new_server = 'const D1_PAGE_JSON_MAX_BYTES = 1_850_000;'
          if new_server not in server_text:
              if old_server not in server_text:
                  raise SystemExit('D1 page JSON server limit marker not found')
              server_text = server_text.replace(old_server, new_server, 1)
          server_path.write_text(server_text)

          client_path = Path('src/lib/pageSaveOptimizer.js')
          client_text = client_path.read_text()
          old_client = 'const D1_PAGE_JSON_SAFE_BYTES = 900_000;'
          new_client = 'const D1_PAGE_JSON_SAFE_BYTES = 1_750_000;'
          if new_client not in client_text:
              if old_client not in client_text:
                  raise SystemExit('Page save optimizer limit marker not found')
              client_text = client_text.replace(old_client, new_client, 1)
          client_path.write_text(client_text)

          qa_path = Path('scripts/runtime-quality-check.mjs')
          qa_text = qa_path.read_text()
          qa_text = qa_text.replace("D1_PAGE_JSON_SAFE_BYTES = 900_000", "D1_PAGE_JSON_SAFE_BYTES = 1_750_000")
          qa_text = qa_text.replace("D1_PAGE_JSON_MAX_BYTES = 1_000_000", "D1_PAGE_JSON_MAX_BYTES = 1_850_000")
          qa_path.write_text(qa_text)
          PY

      - name: Commit capacity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/storage/d1Adapter.mjs src/lib/pageSaveOptimizer.js scripts/runtime-quality-check.mjs
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'test(pagero): align page save capacity contract'
          git pull --rebase origin main
          git push origin HEAD:main

