name: Temporary PageRo QA Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pagero-qa-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected source not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Real layout repair: keep desktop workspace inside the viewport,
          # hide the global marketing footer, and scroll panel content below the persistent header.
          css_path = Path('src/styles/editor-workspace-v2.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Stable desktop workspace viewport contract. */'
          if marker not in css:
              css += '''\n\n/* Stable desktop workspace viewport contract. */\n.builder-shell:not(.template-intro-shell) {\n  height: 100dvh !important;\n  overflow: hidden !important;\n  padding-bottom: 0 !important;\n}\n\n.builder-shell:not(.template-intro-shell) ~ .wayzi-global-footer {\n  display: none !important;\n}\n\n.builder-shell:not(.template-intro-shell) .left-workspace {\n  display: grid !important;\n  grid-template-rows: auto minmax(0, 1fr) !important;\n  min-height: 0 !important;\n  overflow: hidden !important;\n}\n\n.builder-shell:not(.template-intro-shell) .workspace-persistent-header {\n  position: sticky !important;\n  top: 0 !important;\n  grid-row: 1 !important;\n  z-index: 90 !important;\n}\n\n.builder-shell:not(.template-intro-shell) .work-panel {\n  grid-row: 2 !important;\n  min-height: 0 !important;\n  overflow-y: auto !important;\n  overscroll-behavior: contain;\n}\n\n@media (max-width: 899px) {\n  .builder-shell.mobile-operations-shell:not(.template-intro-shell) {\n    height: auto !important;\n    min-height: 100dvh !important;\n    overflow: visible !important;\n    padding-bottom: 24px !important;\n  }\n\n  .builder-shell.mobile-operations-shell:not(.template-intro-shell) ~ .wayzi-global-footer {\n    display: grid !important;\n  }\n\n  .builder-shell.mobile-operations-shell:not(.template-intro-shell) .left-workspace {\n    display: block !important;\n    min-height: 100dvh !important;\n    overflow: visible !important;\n  }\n\n  .builder-shell.mobile-operations-shell:not(.template-intro-shell) .work-panel {\n    min-height: 0 !important;\n    overflow: visible !important;\n  }\n}\n'''
              css_path.write_text(css, encoding='utf-8')

          # 2) Form E2E: Inbox was redesigned from legacy lead cards to operations table rows.
          replace_once(
              'scripts/form-reservation-browser-regression-check.mjs',
              "leadCards: document.querySelectorAll('.lead-card-service').length,",
              "leadCards: document.querySelectorAll('.inbox-ops-table-row').length,",
          )

          # 3) Editor E2E: edit tab now uses the three-column EditWorkbench and preview-click selection.
          replace_once(
              'scripts/editor-browser-regression-check.mjs',
              "await waitForBrowser(client, `!!document.querySelector('.builder-shell:not(.mobile-operations-shell)') && !!document.querySelector('#editor-block-editor-hero') && !!document.querySelector('.phone-frame')`, 'desktop editor');",
              "await waitForBrowser(client, `!!document.querySelector('.builder-shell.edit-workbench-shell') && !!document.querySelector('.edit-workbench-inspector') && !!document.querySelector('.phone-frame') && !!document.querySelector('.phone-frame #block-editor-hero')`, 'desktop editor');",
          )
          replace_once(
              'scripts/editor-browser-regression-check.mjs',
              "await clickSelector(client, '#editor-block-editor-hero .screen-order-head');",
              "await clickSelector(client, '.phone-frame #block-editor-hero');",
          )
          replace_once(
              'scripts/editor-browser-regression-check.mjs',
              "await waitForBrowser(client, `!!document.querySelector('#editor-block-editor-hero textarea[placeholder=\"핵심 제목을 입력하세요\"]')`, 'hero editor textarea');",
              "await waitForBrowser(client, `!!document.querySelector('.edit-workbench-inspector textarea[placeholder=\"핵심 제목을 입력하세요\"]')`, 'hero editor textarea');",
          )
          replace_once(
              'scripts/editor-browser-regression-check.mjs',
              "await setInputValue(client, '#editor-block-editor-hero textarea[placeholder=\"핵심 제목을 입력하세요\"]', updatedHeroTitle);",
              "await setInputValue(client, '.edit-workbench-inspector textarea[placeholder=\"핵심 제목을 입력하세요\"]', updatedHeroTitle);",
          )

          # 4) Template mobile E2E: checkbox/radio controls have intentionally smaller boxes;
          # enforce 36px for ordinary controls and 18px for native choice controls.
          replace_once(
              'scripts/template-mobile-browser-regression-check.mjs',
              "assert(metrics.every((control) => control.width > 0 && control.height >= 36), `${templateLabel}: a reservation control is too small or collapsed`);",
              "const invalidControl = metrics.find((control) => {\n    const minHeight = ['checkbox', 'radio'].includes(control.type) ? 18 : 36;\n    return control.width <= 0 || control.height < minHeight;\n  });\n  assert(!invalidControl, `${templateLabel}: a reservation control is too small or collapsed: ${JSON.stringify(invalidControl)}`);",
          )
          PY

      - name: Commit repairs and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-pagero-qa-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/editor-workspace-v2.css \
            scripts/form-reservation-browser-regression-check.mjs \
            scripts/editor-browser-regression-check.mjs \
            scripts/template-mobile-browser-regression-check.mjs \
            .github/workflows/fix-pagero-qa-final.yml
          git commit -m 'fix(pagero): repair workspace and current browser QA contracts'
          git push origin HEAD:main
