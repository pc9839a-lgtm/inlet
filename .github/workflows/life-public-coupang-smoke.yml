name: LIFE public Coupang smoke
on:
  pull_request:
    paths:
      - ".github/workflows/life-public-coupang-smoke.yml"
      - "functions/life/**"
  workflow_dispatch:

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify large body and right sidebar ads on public LIFE pages
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://pagero.kr/life';
          const marker = 'data-life-coupang-banner="sitewide-v4"';
          const routes = [
            ['/', 3],
            ['/car/', 3],
            ['/support/', 3],
            ['/car/car-inspection-period/', 3],
          ];
          async function fetchPage(url) {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: { 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(20000),
            });
            const content = await response.text();
            return { response, content };
          }
          async function check() {
            const {response: cssResponse, content: css} = await fetchPage(base + '/coupang-banner.css?v=20261105-expanded');
            if (!cssResponse.ok || !css.includes('1320px') || !css.includes('max-width:300px')
              || !css.includes('max-width:320px') || !css.includes('.life-coupang-placement--rail{display:none}')) return false;
            for (const [route, expected] of routes) {
              const { response, content: html } = await fetchPage(base + route + '?v=20261105-expanded');
              const counts = [...html.matchAll(/data-life-coupang-banner="sitewide-v4"/g)].length;
              const rail = [...html.matchAll(/data-life-coupang-kind="rail"/g)].length;
              const body = [...html.matchAll(/data-life-coupang-kind="(?:body|middle)"/g)].length;
              console.log('LIVE', route, response.status, response.headers.get('x-pagero-life-upstream'), counts, rail, body);
              if (response.status !== 200
                || response.headers.get('x-pagero-life-upstream') !== 'life-production-alias'
                || !html.includes('<aside class="sidebar">')
                || counts !== expected || rail !== 1 || body !== 2) return false;
              if (!html.includes('AF2358798') || !html.includes('1046806')
                || !html.includes('"height":"500"')
                || !html.includes('"height":"300"')
                || !html.includes('options.height="250"')
                || !html.includes('https://ads-partners.coupang.com/g.js')) return false;
            }
            console.log('LIFE_PUBLIC_LARGE_SIDEBAR_ADS_VERIFIED');
            return true;
          }
          for (let attempt = 1; attempt <= 16; attempt++) {
            try {
              if (await check()) process.exit(0);
            } catch(error) {
              console.warn('Attempt ' + attempt + ': ' + String(error));
            }
            console.log('Live site has not promoted larger sidebar ads, retry', attempt);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Latest LIFE advertisement layout is not yet visible on canonical pages');
          NODE
