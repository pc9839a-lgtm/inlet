name: CallTag Live Subscription Read-Only Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calltag-subscription-readonly-proof.yml'
  pull_request:
    paths:
      - '.github/workflows/calltag-subscription-readonly-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event_name != 'pull_request' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read ONLY production D1 subscription state, never expose tokens or orders
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo 'DIAG_MISSING_CLOUDFLARE_API_TOKEN'; exit 1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo 'DIAG_MISSING_CLOUDFLARE_ACCOUNT_ID'; exit 1; fi
          echo 'DIAG_CREDENTIALS_PRESENT';
          cli="node_modules/wrangler/bin/wrangler.js"
          read_only() {
            local label="$1" sql="$2"
            echo "DIAG_QUERY_START $label"
            if ! node "$cli" d1 execute inlet-prod --remote --command "$sql" --json > /tmp/calltag-readonly.json 2>/tmp/calltag-wrangler-stderr; then
              echo "DIAG_QUERY_FAILED $label"
              node -e 'const fs=require("node:fs");const e=fs.readFileSync("/tmp/calltag-wrangler-stderr","utf8");console.log("DIAG_ERROR_CLASS",(e.includes("Unauthorized")?"Unauthorized":e.includes("not found")?"not_found":e.includes("Forbidden")?"Forbidden":e.slice(0,450).replace(/Bearer[^\\n]*/gi,"[MASKED]"))||"no stderr")'
              exit 1
            fi
            node - "$label" <<'NODE'
          const fs=require('node:fs');
          const label=process.argv[2];
          const data=JSON.parse(fs.readFileSync('/tmp/calltag-readonly.json','utf8'));
          const rows=Array.isArray(data)?data[0]?.results:data.results;
          if(!Array.isArray(rows))throw new Error('Query did not return rows: '+label);
          console.log('READ_ONLY_RESULT',JSON.stringify({label,rows}));
          NODE
          }
          read_only subscription_totals "SELECT channel, status, verification_state, COUNT(*) AS records, COUNT(DISTINCT owner_id) AS owners FROM billing_subscriptions WHERE product_code IN ('call_monthly','message_monthly','all_monthly') GROUP BY channel,status,verification_state ORDER BY channel,status,verification_state;"
          # Temporary OCT 17 registration-spike investigation. SELECT only; no direct member identifiers.
          read_only signup_profiles_daily_kst "SELECT date(datetime(created_at,'+9 hours')) AS day_kst,COUNT(*) AS profiles FROM calllink_profiles WHERE datetime(created_at)>='2026-10-10 00:00:00' AND datetime(created_at)<'2026-10-20 00:00:00' GROUP BY day_kst ORDER BY day_kst;"
          read_only signup_accounts_daily_kst "SELECT date(datetime(created_at,'+9 hours')) AS day_kst,COUNT(*) AS accounts FROM accounts WHERE datetime(created_at)>='2026-10-10 00:00:00' AND datetime(created_at)<'2026-10-20 00:00:00' GROUP BY day_kst ORDER BY day_kst;"
          read_only signup_17_profile_origin "SELECT CASE WHEN a.id IS NULL THEN 'profile_without_account' WHEN date(datetime(a.created_at,'+9 hours'))='2026-10-17' THEN 'account_created_oct17' WHEN datetime(a.created_at)<datetime(p.created_at) THEN 'account_preexisting' ELSE 'account_later_than_profile' END AS account_age,COUNT(*) AS profiles FROM calllink_profiles p LEFT JOIN accounts a ON a.id=p.owner_id WHERE date(datetime(p.created_at,'+9 hours'))='2026-10-17' GROUP BY account_age ORDER BY profiles DESC;"
          read_only signup_17_hourly_kst "SELECT strftime('%Y-%m-%d %H',created_at,'+9 hours') AS hour_kst,COUNT(*) AS profiles FROM calllink_profiles WHERE date(datetime(created_at,'+9 hours'))='2026-10-17' GROUP BY hour_kst ORDER BY hour_kst;"
          read_only signup_17_top_minutes "SELECT strftime('%Y-%m-%d %H:%M',created_at,'+9 hours') AS minute_kst,COUNT(*) AS profiles FROM calllink_profiles WHERE date(datetime(created_at,'+9 hours'))='2026-10-17' GROUP BY minute_kst ORDER BY profiles DESC,minute_kst LIMIT 12;"
          read_only signup_17_profile_paid_coverage "SELECT CASE WHEN EXISTS(SELECT 1 FROM billing_subscriptions s WHERE s.owner_id=p.owner_id AND s.channel='google_play' AND s.verification_state='verified') THEN 'has_verified_play_sub' ELSE 'no_verified_play_sub' END AS play_subscription,CASE WHEN EXISTS(SELECT 1 FROM calllink_entitlements e WHERE e.owner_id=p.owner_id AND e.plan_code='beta_free' AND e.source='beta') THEN 'beta_entitlement' ELSE 'other_or_absent_entitlement' END AS entitlement_class,COUNT(*) AS profiles FROM calllink_profiles p WHERE date(datetime(p.created_at,'+9 hours'))='2026-10-17' GROUP BY play_subscription,entitlement_class ORDER BY profiles DESC;"
          read_only signup_17_account_profile_gap "SELECT CASE WHEN p.owner_id IS NOT NULL THEN 'calltag_profile_present' ELSE 'calltag_profile_absent' END AS calltag_profile,CASE WHEN a.status='active' THEN 'active_account' ELSE 'inactive_or_other' END AS account_status,COUNT(*) AS accounts FROM accounts a LEFT JOIN calllink_profiles p ON p.owner_id=a.id WHERE date(datetime(a.created_at,'+9 hours'))='2026-10-17' GROUP BY calltag_profile,account_status ORDER BY accounts DESC;"
          read_only current_access "SELECT COUNT(DISTINCT owner_id) AS access_owner_count FROM billing_subscriptions WHERE product_code IN ('call_monthly','message_monthly','all_monthly') AND status IN ('active','grace','cancelled') AND (expires_at='' OR julianday(expires_at)>julianday('now'));"
          read_only confirmed_charge_count "SELECT COUNT(DISTINCT owner_id) AS charged_owners FROM billing_payment_events WHERE product_code IN ('call_monthly','message_monthly','all_monthly') AND event_type='charge' AND payment_status='paid' AND amount_krw>0 AND amount_source IN ('provider_confirmed','play_earnings_report','google_play_orders_api');"
          # Do not mistake database records for an exhaustive Google Play sales export.
          # All diagnostics below are aggregate, read-only and contain no identifiers or payment amounts.
          read_only payer_inventory_all_products "SELECT product_code,channel,status,verification_state,COUNT(*) AS records,COUNT(DISTINCT owner_id) AS owners FROM billing_subscriptions GROUP BY product_code,channel,status,verification_state ORDER BY records DESC LIMIT 40;"
          read_only payment_ledger_all_sources "SELECT product_code,channel,event_type,payment_status,amount_source,COUNT(*) AS records,COUNT(DISTINCT owner_id) AS owners FROM billing_payment_events GROUP BY product_code,channel,event_type,payment_status,amount_source ORDER BY records DESC LIMIT 40;"
          read_only payer_account_coverage "SELECT COALESCE(a.status,'account_missing') AS account_status,CASE WHEN p.owner_id IS NULL THEN 'profile_missing' ELSE 'profile_present' END AS legacy_profile,COUNT(DISTINCT s.owner_id) AS owners,COUNT(*) AS subscription_records FROM billing_subscriptions s LEFT JOIN accounts a ON a.id=s.owner_id LEFT JOIN calllink_profiles p ON p.owner_id=s.owner_id WHERE s.product_code IN ('call_monthly','message_monthly','all_monthly') AND s.channel='google_play' AND s.verification_state='verified' GROUP BY account_status,legacy_profile ORDER BY owners DESC;"
          read_only payer_cross_source_totals "SELECT (SELECT COUNT(DISTINCT owner_id) FROM billing_subscriptions WHERE product_code IN ('call_monthly','message_monthly','all_monthly') AND verification_state='verified') AS subscription_verified_owners,(SELECT COUNT(DISTINCT owner_id) FROM billing_payment_events WHERE product_code IN ('call_monthly','message_monthly','all_monthly') AND event_type='charge' AND payment_status='paid' AND amount_krw>0 AND amount_source IN ('provider_confirmed','play_earnings_report','google_play_orders_api')) AS provider_paid_ledger_owners,(SELECT COUNT(DISTINCT owner_id) FROM calllink_entitlements WHERE lower(source) IN ('pagero_payment','web_payment','payment','paid')) AS legacy_payment_marker_owners,(SELECT COUNT(DISTINCT e.owner_id) FROM billing_payment_events e WHERE e.product_code IN ('call_monthly','message_monthly','all_monthly') AND e.event_type='charge' AND e.payment_status='paid' AND e.amount_krw>0 AND NOT EXISTS (SELECT 1 FROM billing_subscriptions s WHERE s.owner_id=e.owner_id AND s.product_code IN ('call_monthly','message_monthly','all_monthly'))) AS paid_ledger_owners_without_subscriptions;"
          read_only subscription_member_expiry "SELECT s.owner_id,COALESCE(substr(a.email,1,2)||'*****@'||substr(a.email,instr(a.email,'@')+1),'') AS masked_email,s.product_code,s.channel,s.status,s.verification_state,s.auto_renewing,s.expires_at,CASE WHEN s.expires_at IS NULL OR s.expires_at='' THEN 'missing' WHEN datetime(s.expires_at) IS NULL THEN 'unparseable' WHEN datetime(s.expires_at)>datetime('now') THEN 'future' ELSE 'past' END AS expiry_class,s.last_verified_at FROM billing_subscriptions s LEFT JOIN accounts a ON a.id=s.owner_id WHERE s.product_code IN ('call_monthly','message_monthly','all_monthly') ORDER BY s.owner_id,s.expires_at LIMIT 20;"
          read_only rtdn_table_presence "SELECT name AS table_name FROM sqlite_master WHERE type='table' AND name IN ('google_play_rtdn_events','billing_subscriptions','billing_payment_events') ORDER BY name;"
          # Query aggregate receipt counters only when the RTDN table exists;
          # absence is a diagnostic result, not a reason to fabricate messages.
          if node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("/tmp/calltag-readonly.json","utf8"));const r=Array.isArray(d)?d[0]?.results:d.results;process.exit(Array.isArray(r)&&r.some(x=>x.table_name==="google_play_rtdn_events")?0:1)'; then
            read_only rtdn_event_summary "SELECT COUNT(*) AS total_receipts, COALESCE(SUM(CASE WHEN event_kind='test' THEN 1 ELSE 0 END),0) AS test_receipts, COALESCE(SUM(CASE WHEN event_kind='subscription' THEN 1 ELSE 0 END),0) AS subscription_receipts, COALESCE(SUM(CASE WHEN created_at >= datetime('now','-7 days') THEN 1 ELSE 0 END),0) AS receipts_7d, MAX(created_at) AS last_receipt_at FROM google_play_rtdn_events;"
            read_only rtdn_event_statuses "SELECT event_kind,status,COUNT(*) AS receipts FROM google_play_rtdn_events GROUP BY event_kind,status ORDER BY receipts DESC LIMIT 15;"
          else
            echo 'RTDN_EVENT_TABLE_ABSENT'
          fi
          read_only possible_account_matches "WITH candidate AS (
            SELECT id AS owner_id, email FROM accounts WHERE lower(email) LIKE 'gg%@gmail.com' OR lower(email) LIKE 'aq%@naver.com'
            UNION SELECT owner_id,email FROM calllink_profiles WHERE lower(email) LIKE 'gg%@gmail.com' OR lower(email) LIKE 'aq%@naver.com'
          )
          SELECT c.owner_id AS owner_id,
            substr(c.email,1,2)||'*****@'||substr(c.email,instr(c.email,'@')+1) AS masked_email,
            (SELECT COUNT(*) FROM billing_subscriptions s WHERE s.owner_id=c.owner_id AND s.product_code IN ('call_monthly','message_monthly','all_monthly')) AS subscription_records,
            (SELECT group_concat(s.channel||':'||s.product_code||':'||s.status||':'||s.verification_state||':renew='||coalesce(s.auto_renewing,0),' | ') FROM billing_subscriptions s WHERE s.owner_id=c.owner_id AND s.product_code IN ('call_monthly','message_monthly','all_monthly')) AS subscription_states,
            (SELECT COUNT(*) FROM billing_subscriptions s WHERE s.owner_id=c.owner_id AND s.status IN ('active','grace','cancelled') AND s.product_code IN ('call_monthly','message_monthly','all_monthly') AND (s.expires_at='' OR julianday(s.expires_at)>julianday('now'))) AS active_access_count,
            (SELECT COUNT(*) FROM billing_payment_events e WHERE e.owner_id=c.owner_id AND e.product_code IN ('call_monthly','message_monthly','all_monthly') AND e.event_type='charge' AND e.payment_status='paid' AND e.amount_krw>0 AND e.amount_source IN ('provider_confirmed','play_earnings_report','google_play_orders_api')) AS confirmed_charge_count
          FROM candidate c ORDER BY c.owner_id LIMIT 20;"
          rm -f /tmp/calltag-readonly.json
      - name: Direct Cloudflare D1 REST read-only SELECT fallback
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "DIAG_API_CREDENTIAL_MISSING"; exit 0; fi
          database_id="$(node -p 'JSON.parse(require("fs").readFileSync("wrangler.jsonc","utf8")).d1_databases.find(x=>x.binding==="DB").database_id')"
          query() {
            local label="$1" sql="$2" code
            payload="$(node -e 'process.stdout.write(JSON.stringify({sql:process.argv[1]}))' "$sql")"
            code="$(curl --silent --show-error --max-time 30 --output /tmp/calltag-api-result.json --write-out '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data "$payload" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${database_id}/query" || true)"
            node -e 'const fs=require("node:fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/calltag-api-result.json","utf8"))}catch{}const label=process.argv[1],http=process.argv[2];const rows=Array.isArray(d.result)?d.result[0]?.results:[];const errs=Array.isArray(d.errors)?d.errors.map(x=>({code:x.code,message:String(x.message||"").slice(0,90)})):[];console.log("DIRECT_D1_READ",JSON.stringify({label,http,success:d.success===true,rows:Array.isArray(rows)?rows.slice(0,25):[],errors:errs}))' "$label" "$code"
          }
          query active_subscription_summary "SELECT channel,status,verification_state,COUNT(*) AS records,COUNT(DISTINCT owner_id) AS owners FROM billing_subscriptions WHERE product_code IN ('call_monthly','message_monthly','all_monthly') GROUP BY channel,status,verification_state;"
          query rtdn_table_presence "SELECT name AS table_name FROM sqlite_master WHERE type='table' AND name='google_play_rtdn_events' LIMIT 1;"
          query possible_email_matches "WITH c AS (SELECT id AS owner_id,email FROM accounts WHERE lower(email) LIKE 'gg%@gmail.com' OR lower(email) LIKE 'aq%@naver.com' UNION SELECT owner_id,email FROM calllink_profiles WHERE lower(email) LIKE 'gg%@gmail.com' OR lower(email) LIKE 'aq%@naver.com') SELECT c.owner_id, substr(c.email,1,2)||'*****@'||substr(c.email,instr(c.email,'@')+1) AS masked_email, (SELECT group_concat(s.channel||':'||s.status||':'||s.verification_state||':renew='||s.auto_renewing,' | ') FROM billing_subscriptions s WHERE s.owner_id=c.owner_id AND s.product_code IN ('call_monthly','message_monthly','all_monthly')) AS subscription_states FROM c ORDER BY c.owner_id LIMIT 25;"
          rm -f /tmp/calltag-api-result.json


      - name: Read Cloudflare inlet production deployment SHA, no runtime writes
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/inlet/deployments?per_page=20" > /tmp/calltag-deploys.json
          node <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('/tmp/calltag-deploys.json','utf8'));
          if(j.success!==true||!Array.isArray(j.result))throw Error('No Cloudflare deployment metadata');
          const deployments=j.result.filter(x=>x.environment==='production');
          console.log('PRODUCTION_INLET_DEPLOY',JSON.stringify(deployments.slice(0,3).map(x=>({
            id:x.short_id,createdAt:x.created_on,
            sha:x.deployment_trigger?.metadata?.commit_hash,
            branch:x.deployment_trigger?.metadata?.branch,
            success:x.latest_stage?.status==='success',
            matchesWorkflowSha:x.deployment_trigger?.metadata?.commit_hash===process.env.GITHUB_SHA
          }))));
          NODE
          rm -f /tmp/calltag-deploys.json

      - name: Inspect RTDN production secret metadata without exposing values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eec4828f6c3ab1c52683f0d47767e8fc
        run: |
          node <<'NODE'
          const names = [
            'GOOGLE_PLAY_RTDN_VERIFICATION_TOKEN',
            'GOOGLE_PLAY_RTDN_AUDIENCE',
            'GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT',
            'GOOGLE_PLAY_CLIENT_EMAIL',
            'GOOGLE_PLAY_PRIVATE_KEY',
          ];
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/'
            + encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)
            + '/pages/projects/inlet';
          const response = await fetch(endpoint, {
            headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, Accept: 'application/json' },
            signal: AbortSignal.timeout(15000),
          });
          const data = await response.json().catch(() => ({}));
          const productionVars = data?.result?.deployment_configs?.production?.env_vars;
          const known = productionVars && typeof productionVars === 'object';
          const flags = names.map(name => {
            const entry = known ? productionVars[name] : undefined;
            return { name, listed: Boolean(entry), secret: entry?.type === 'secret_text' };
          });
          console.log('RTDN_PRODUCTION_SECRET_METADATA', JSON.stringify({
            http: response.status,
            projectReadable: response.ok && data?.success === true,
            productionEnvMetadataVisible: Boolean(known),
            fields: flags,
          }));
          if (!response.ok || data?.success !== true) process.exitCode = 1;
          NODE

      - name: Probe public RTDN route with safe GET only
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://pagero.kr/api/billing/google/rtdn';
          try {
            const response = await fetch(url, {
              method: 'GET',
              redirect: 'manual',
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(12000),
            });
            const body = await response.text().catch(() => '');
            console.log('RTDN_PUBLIC_ROUTE_PROBE', JSON.stringify({
              http: response.status,
              expectedMethodRejection: response.status === 405 && body.includes('METHOD_NOT_ALLOWED'),
              redirected: response.status >= 300 && response.status < 400,
            }));
          } catch (err) {
            console.log('RTDN_PUBLIC_ROUTE_PROBE', JSON.stringify({
              reachable: false, errorType: String(err?.name || 'network')
            }));
          }
          NODE
