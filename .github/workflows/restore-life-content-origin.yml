# Refresh current editorial LIFE content while preserving legacy-host 301 and noindex preview origin.
# Editorial publication: apply verified EV subsidy supplemental sections after compressed content bundles.
# Editorial publication: publish car transfer costs, eligibility, and case-comparison sections.
# Editorial publication: synchronize verified vehicle-tax relief and actual registration-cost comparisons.
# Editorial release 2026-10-21: reviewed TS vehicle inspection reservation and penalty comparison, preserving legacy redirects.
name: Restore renewable LIFE content origin
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-life-content-origin.yml]
  workflow_dispatch:
concurrency:
  group: life-pagero-renewable-origin
  cancel-in-progress: false
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Pages host isolation
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,sys
          token=os.getenv('CLOUDFLARE_API_TOKEN','');account=os.getenv('CLOUDFLARE_ACCOUNT_ID','')
          if not token or not account:sys.exit('Missing Cloudflare auth')
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/life-pagero',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          project=data.get('result') or {}
          domains=set(project.get('domains') or [])
          if project.get('name')!='life-pagero' or not domains.issubset({'life.pagero.kr','life-pagero.pages.dev'}) or 'life.pagero.kr' not in domains:
            sys.exit('Refusing to touch project containing unrelated domains')
          print('Verified isolated legacy project:',project.get('name'),sorted(domains))
          PY
      - uses: actions/checkout@v4
      - name: Checkout active LIFE editorial source
        uses: actions/checkout@v4
        with:
          repository: pc9839a-lgtm/life-pagero
          ref: main
          path: life-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pages deployment CLI
        run: npm ci
      - name: Build the current LIFE content with canonical URL
        shell: bash
        env:
          PUBLIC_SITE_URL: https://pagero.kr/life
        run: |
          set -euo pipefail
          cd life-site
          npm run build
          test -f dist/index.html
          test -f dist/car/car-inspection-period/index.html
          grep -q '생활비서' dist/index.html
          grep -q 'pagero.kr/life/' dist/index.html
      - name: Deploy host-sensitive split (legacy 301; origin 200)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p origin-publish/functions origin-publish/dist
          cp -a life-site/dist/. origin-publish/dist/
          cat > origin-publish/functions/_middleware.js <<'JS'
          export async function onRequest(context) {
            const url = new URL(context.request.url);
            if (url.hostname.toLowerCase() === 'life.pagero.kr') {
              const target = new URL('https://pagero.kr/life/');
              const suffix = url.pathname.replace(/^\/+/, '').replace(/^life\/+/, '');
              target.pathname = '/life/' + suffix;
              target.search = url.search;
              return Response.redirect(target.toString(), 301);
            }
            const response = await context.next();
            const headers = new Headers(response.headers);
            headers.set('X-Robots-Tag', 'noindex, follow, noarchive');
            headers.delete('Content-Length');
            return new Response(response.body, {
              status: response.status,
              statusText: response.statusText,
              headers
            });
          }
          JS
          cd origin-publish
          ../node_modules/.bin/wrangler pages deploy dist --project-name life-pagero --branch main --commit-hash "$(git -C ../life-site rev-parse HEAD)"
      - name: Prove old host redirects and default origin serves live HTML
        shell: bash
        run: |
          python - <<'PY'
          import time,urllib.request,urllib.error,sys
          class Manual(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(Manual)
          pages=['/','/car/car-inspection-period/','/support/basic-pension-2026/']
          missing=set(pages)
          legacy=set(pages)
          for attempt in range(1,9):
            for p in list(missing):
              url='https://life-pagero.pages.dev'+p
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
                  body=r.read(500000).decode('utf-8','replace')
                  robots=r.headers.get('x-robots-tag','')
                  good=r.status==200 and ('생활비서' in body or '기초연금' in body or '자동차' in body) and 'noindex' in robots
                print('ORIGIN',url,'good',good,'robots',robots,flush=True)
                if good:missing.remove(p)
              except Exception as e:print('WAIT ORIGIN',url,str(e)[:120],flush=True)
            for p in list(legacy):
              url='https://life.pagero.kr'+p
              try:
                with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
                  status=r.status;location=r.headers.get('Location','')
              except urllib.error.HTTPError as e:
                status=e.code;location=e.headers.get('Location','')
              except Exception as e:
                status=0;location='';print('WAIT OLD',type(e).__name__,flush=True)
              expected='https://pagero.kr/life'+p
              print('LEGACY',url,status,location,'expected',expected,flush=True)
              if status==301 and location==expected:legacy.remove(p)
            if not missing and not legacy:break
            if attempt<8:time.sleep(12)
          if missing or legacy:sys.exit('ERROR: default LIFE origin or old domain verification failed: '+str({'missing':list(missing),'legacy':list(legacy)}))
          print('OK: renewable LIFE content origin and old-host 301 work independently')
          PY
