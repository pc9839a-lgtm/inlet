# 2026-10-23 editorial reader-value refresh: deploy 4 task-first guides from life-pagero main, verify immutable homepage and record the new origin.
# 2026-10-23 phase 3: publish consent disclosure in a verified immutable snapshot and record its deployment URL.
# 2026-10-23 AdSense phase 2: publish verified 18-guide source precision and five first-page comparisons; preserve customer-page ad exclusion.
# 2026-10-22 publisher batch 3: source-depth review, 2026 practical benefit comparisons, expired car tax date corrections.
# 2026-10-22 editorial factual update: KDCA 2026-27 flu schedule + emergency welfare and disability benefit comparisons.
# 2026-10-22: publish full LIFE editorial archive (45 guides linked on the index), matching Cruise editorial discoverability.
# AdSense /life publisher refresh 2026-10-22: deploy corrected official-source URLs from life-pagero main.
# Refresh current editorial LIFE content while preserving legacy-host 301 and noindex preview origin.
# Editorial publication: apply verified EV subsidy supplemental sections after compressed content bundles.
# Editorial publication: publish car transfer costs, eligibility, and case-comparison sections.
# Editorial publication: synchronize verified vehicle-tax relief and actual registration-cost comparisons.
# Editorial release 2026-10-21: reviewed TS vehicle inspection reservation and penalty comparison, preserving legacy redirects.
# Editorial release: preserve verified scrappage, subsidy eligibility, grant search and used-car transfer documents across bundles.
name: Restore renewable LIFE content origin
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-life-content-origin.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: life-pagero-renewable-origin
  cancel-in-progress: false
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Pages host isolation
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,sys
          token=os.getenv('CLOUDFLARE_API_TOKEN','');account=os.getenv('CLOUDFLARE_ACCOUNT_ID','')
          if not token or not account:sys.exit('Missing Cloudflare auth')
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/life-pagero',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          project=data.get('result') or {}
          domains=set(project.get('domains') or [])
          if project.get('name')!='life-pagero' or not domains.issubset({'life.pagero.kr','life-pagero.pages.dev'}) or 'life.pagero.kr' not in domains:
            sys.exit('Refusing to touch project containing unrelated domains')
          print('Verified isolated legacy project:',project.get('name'),sorted(domains))
          PY
      - uses: actions/checkout@v4
      - name: Checkout active LIFE editorial source
        uses: actions/checkout@v4
        with:
          repository: pc9839a-lgtm/life-pagero
          ref: main
          path: life-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pages deployment CLI
        run: npm ci
      - name: Build the current LIFE content with canonical URL
        shell: bash
        env:
          PUBLIC_SITE_URL: https://pagero.kr/life
        run: |
          set -euo pipefail
          cd life-site
          npm run build
          test -f dist/index.html
          test -f dist/car/car-inspection-period/index.html
          grep -q '생활비서' dist/index.html
          grep -q 'pagero.kr/life/' dist/index.html
          # Fail closed: never publish this phase's snapshot with an old policy.
          grep -q 'https://adssettings.google.com/' dist/privacy-policy/index.html
          grep -q 'https://policies.google.com/technologies/partner-sites' dist/privacy-policy/index.html
          # Two historic JSON filenames are re-used by the compressed bundle for
          # published 2026 policy pages. Verify the actual slug and prevent generic
          # grant-help overlays from silently contaminating those policy articles.
          python - <<'PY'
          from pathlib import Path
          import json
          pages = {
              'government-support-search': ('energy-voucher-2026', '에너지바우처', '찾았다\'와 \'신청할 수 있다'),
              'support-eligibility-check': ('earned-income-tax-credit-late-2026', '근로장려금', '자격충족·신청완료·선정완료'),
          }
          for original,(slug,subject,wrong_fragment) in pages.items():
              data = json.loads((Path('content/posts/support') / (original + '.json')).read_text(encoding='utf-8'))
              page = Path('dist/support') / slug / 'index.html'
              if data.get('category') != 'support' or data.get('slug') != slug:
                  raise SystemExit('Unexpected restored policy slug: '+original+' -> '+str(data.get('slug')))
              if not page.is_file():
                  raise SystemExit('Expected policy page not published: '+str(page))
              html = page.read_text(encoding='utf-8')
              if subject not in html or wrong_fragment in html:
                  raise SystemExit('Policy article topic/evidence contaminated: '+slug)
              print('PASS POLICY PAGE:',slug,'bytes',len(html),flush=True)
          PY

      - name: Deploy host-sensitive split (legacy 301; origin 200)
        id: deployed_life
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p origin-publish/functions origin-publish/dist
          cp -a life-site/dist/. origin-publish/dist/
          cat > origin-publish/functions/_middleware.js <<'JS'
          export async function onRequest(context) {
            const url = new URL(context.request.url);
            if (url.hostname.toLowerCase() === 'life.pagero.kr') {
              const target = new URL('https://pagero.kr/life/');
              const suffix = url.pathname.replace(/^\/+/, '').replace(/^life\/+/, '');
              target.pathname = '/life/' + suffix;
              target.search = url.search;
              return Response.redirect(target.toString(), 301);
            }
            const response = await context.next();
            const headers = new Headers(response.headers);
            headers.set('X-Robots-Tag', 'noindex, follow, noarchive');
            headers.delete('Content-Length');
            return new Response(response.body, {
              status: response.status,
              statusText: response.statusText,
              headers
            });
          }
          JS
          cd origin-publish
          ../node_modules/.bin/wrangler pages deploy dist --project-name life-pagero --branch main --commit-hash "$(git -C ../life-site rev-parse HEAD)" 2>&1 | tee "$GITHUB_WORKSPACE/life-deploy.log"
          python - <<'PY'
          import os,re,pathlib
          log=pathlib.Path(os.environ['GITHUB_WORKSPACE'],'life-deploy.log').read_text(encoding='utf-8',errors='replace')
          log=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',log)
          urls=re.findall(r'https://[0-9a-f]{8,}\.life-pagero\.pages\.dev/?',log,re.I)
          if not urls:
            raise SystemExit('FAIL: Wrangler returned no immutable life-pagero.pages.dev deployment URL')
          url=urls[-1].rstrip('/')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
            output.write('immutable_url='+url+'\n')
          print('Immutable deployment candidate:',url,flush=True)
          PY
      - name: Verify exact immutable privacy-policy deployment
        shell: bash
        env:
          IMMUTABLE_URL: ${{ steps.deployed_life.outputs.immutable_url }}
        run: |
          python - <<'PY'
          import os,sys,time,urllib.request
          origin=os.environ.get('IMMUTABLE_URL','').rstrip('/')
          pages={
            '/':['id="life-pathways-title"','data-path="inspection"','data-path="transfer"','data-path="parenting"','data-path="livelihood"'],
            '/privacy-policy/':['Google AdSense','https://adssettings.google.com/','https://policies.google.com/technologies/partner-sites'],
            '/car/car-inspection-period/':['생활비서','rel="canonical"','https://pagero.kr/life/car/car-inspection-period/'],
            '/editorial-standards/':['광고와 편집의 분리'],
          }
          for path,needles in pages.items():
            verified=False
            for i in range(1,9):
              try:
                req=urllib.request.Request(origin+path,headers={'User-Agent':'Mozilla/5.0 (LIFEImmutablePhase3Gate)'})
                with urllib.request.urlopen(req,timeout=18) as response:
                  body=response.read(750000).decode('utf-8','replace')
                  robots=response.headers.get('X-Robots-Tag','')
                  verified=(response.status==200 and 'noindex' in robots.lower() and all(n in body for n in needles))
                print('IMMUTABLE_GUARD',path,i,verified,flush=True)
                if verified:break
              except Exception as error:print('IMMUTABLE_RETRY',path,i,type(error).__name__,flush=True)
              time.sleep(5)
            if not verified:sys.exit('FAIL: new immutable snapshot not verified: '+origin+path)
          print('PASS verified immutable source',origin,flush=True)
          PY
      - name: Prove old host redirects and default origin serves live HTML
        shell: bash
        run: |
          python - <<'PY'
          import time,urllib.request,urllib.error,sys
          class Manual(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(Manual)
          pages=['/','/car/car-inspection-period/','/support/basic-pension-2026/']
          missing=set(pages)
          legacy=set(pages)
          for attempt in range(1,9):
            for p in list(missing):
              url='https://life-pagero.pages.dev'+p
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
                  body=r.read(500000).decode('utf-8','replace')
                  robots=r.headers.get('x-robots-tag','')
                  good=r.status==200 and ('생활비서' in body or '기초연금' in body or '자동차' in body) and 'noindex' in robots
                print('ORIGIN',url,'good',good,'robots',robots,flush=True)
                if good:missing.remove(p)
              except Exception as e:print('WAIT ORIGIN',url,str(e)[:120],flush=True)
            for p in list(legacy):
              url='https://life.pagero.kr'+p
              try:
                with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
                  status=r.status;location=r.headers.get('Location','')
              except urllib.error.HTTPError as e:
                status=e.code;location=e.headers.get('Location','')
              except Exception as e:
                status=0;location='';print('WAIT OLD',type(e).__name__,flush=True)
              expected='https://pagero.kr/life'+p
              print('LEGACY',url,status,location,'expected',expected,flush=True)
              if status==301 and location==expected:legacy.remove(p)
            if not missing and not legacy:break
            if attempt<8:time.sleep(12)
          if missing or legacy:sys.exit('ERROR: default LIFE origin or old domain verification failed: '+str({'missing':list(missing),'legacy':list(legacy)}))
          print('OK: renewable LIFE content origin and old-host 301 work independently')
          PY
      - name: Record immutable deployment for canonical proxy promotion
        shell: bash
        env:
          VERIFIED_LIFE_URL: ${{ steps.deployed_life.outputs.immutable_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['GITHUB_SHA']
          target=os.environ['VERIFIED_LIFE_URL'].strip()
          payload={
            'state':'success',
            'context':'life-origin/verified-immutable-snapshot',
            'description':'Privacy, editorial and legacy redirect gates verified',
            'target_url':target,
          }
          req=urllib.request.Request(
            f'https://api.github.com/repos/{repo}/statuses/{sha}',
            data=json.dumps(payload).encode('utf-8'),
            headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
            },method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
            if response.status!=201:raise SystemExit('GitHub immutable origin status publish failed')
          print('Verified deployment URL recorded as commit status:',target,flush=True)
          PY
