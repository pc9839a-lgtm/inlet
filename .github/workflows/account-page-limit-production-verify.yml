name: Account Page Limit Production Verify

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview API origin
        required: true
        default: https://pagero.kr
        type: string
      allow_writes:
        description: Create and delete disposable QA pages
        required: true
        default: false
        type: boolean
      require_live:
        description: Fail instead of skipped-live when fixtures are unavailable
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: account-page-limit-production-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INLET_ACCOUNT_PAGE_LIMIT_BASE_URL: ${{ inputs.base_url }}
      INLET_ACCOUNT_PAGE_LIMIT_LIVE_WRITE: ${{ inputs.allow_writes && '1' || '0' }}
      INLET_ACCOUNT_PAGE_LIMIT_LIVE_REQUIRE: ${{ inputs.require_live && '1' || '0' }}
      INLET_ACCOUNT_PAGE_LIMIT_EMPTY_GENERAL_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_EMPTY_GENERAL_SESSION }}
      INLET_ACCOUNT_PAGE_LIMIT_OCCUPIED_GENERAL_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_OCCUPIED_GENERAL_SESSION }}
      INLET_ACCOUNT_PAGE_LIMIT_ARCHIVED_GENERAL_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_ARCHIVED_GENERAL_SESSION }}
      INLET_ACCOUNT_PAGE_LIMIT_PLATFORM_MASTER_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_PLATFORM_MASTER_SESSION }}
      INLET_ACCOUNT_PAGE_LIMIT_GOOGLE_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_GOOGLE_SESSION }}
      INLET_ACCOUNT_PAGE_LIMIT_MANAGER_SESSION: ${{ secrets.PAGERO_PAGE_LIMIT_MANAGER_SESSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify production account page limit
        shell: bash
        run: |
          set -o pipefail
          npm run account:page-limit:live | tee account-page-limit-live-result.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-page-limit-production-evidence
          path: account-page-limit-live-result.json
          if-no-files-found: warn
          retention-days: 30
