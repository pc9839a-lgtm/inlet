name: SES Auth Email Production Verify

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS SES region
        required: true
        default: ap-northeast-2
        type: string
      require_dmarc:
        description: Require a valid DMARC TXT record
        required: true
        default: true
        type: boolean
      require_custom_mail_from:
        description: Require custom MAIL FROM and Amazon SES SPF
        required: true
        default: false
        type: boolean
      require_live:
        description: Fail unless every required live check succeeds
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ses-auth-email-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify SES account and identity
        id: verify
        continue-on-error: true
        env:
          INLET_SES_REGION: ${{ inputs.region }}
          INLET_SES_ACCESS_KEY_ID: ${{ secrets.PAGERO_SES_ACCESS_KEY_ID }}
          INLET_SES_SECRET_ACCESS_KEY: ${{ secrets.PAGERO_SES_SECRET_ACCESS_KEY }}
          INLET_AUTH_EMAIL_FROM: ${{ vars.PAGERO_AUTH_EMAIL_FROM }}
          INLET_SES_IDENTITY: ${{ vars.PAGERO_SES_IDENTITY }}
          INLET_SES_REQUIRE_DMARC: ${{ inputs.require_dmarc && '1' || '0' }}
          INLET_SES_REQUIRE_CUSTOM_MAIL_FROM: ${{ inputs.require_custom_mail_from && '1' || '0' }}
          INLET_SES_REQUIRE_LIVE: ${{ inputs.require_live && '1' || '0' }}
          INLET_SES_TIMEOUT_MS: '15000'
        run: |
          set +e
          npm run auth:email:ses:live > ses-auth-email-production-evidence.json
          code=$?
          cat ses-auth-email-production-evidence.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-auth-email-production-evidence-${{ github.run_id }}
          path: ses-auth-email-production-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce result
        if: always()
        run: |
          test "${{ steps.verify.outputs.exit_code }}" = "0"
