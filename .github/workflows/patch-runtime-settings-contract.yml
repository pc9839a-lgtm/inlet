name: Temporary Runtime Settings Contract Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-runtime-settings-contract.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update settings runtime contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/runtime-quality-check.mjs')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (
              "assert(settingsSection.includes('const stateLabel = open ?') && settingsSection.includes('settings-section-state') && settingsSection.includes('aria-hidden=\"true\"') && settingsSection.includes('{stateLabel}</span>'), 'Settings sections must render explicit open/close action labels');",
              "assert(settingsSection.includes(\"import SettingsActionBar from './SettingsActionBar.jsx'\") && settingsSection.includes('const ACTION_LABELS = {') && settingsSection.includes('primaryLabel={locked ? editLabel || labels[1] : saveLabel || labels[0]}') && settingsSection.includes('onPrimary={locked ? onEdit : onSave}'), 'Settings sections must expose explicit save/edit actions through the shared action bar');"
            ),
            (
              "assert(settingsAdvancedGroup.includes('aria-label={`') && settingsAdvancedGroup.includes('advancedOpen ?') && settingsAdvancedGroup.includes('<em aria-hidden=\"true\">{advancedOpen ?'), 'Settings advanced section must render explicit open/close action labels');",
              "assert(settingsAdvancedGroup.includes(\"activeSection === 'seo'\") && settingsAdvancedGroup.includes(\"activeSection === 'tracking'\") && settingsAdvancedGroup.includes(\"activeSection === 'conversion'\") && settingsAdvancedGroup.includes(\"activeSection === 'duplicate'\"), 'Settings advanced group must route each advanced section explicitly');"
            ),
            (
              "assert(settingsPanelCss.includes('grid-template-columns:minmax(0,1fr) 64px'), 'Settings section headers must reserve readable action label space');",
              "assert(settingsPanelCss.includes('.settings-section-body{padding:16px') && settingsPanelCss.includes('display:grid;gap:14px'), 'Settings section bodies must keep a readable grid layout');"
            ),
            (
              "assert(settingsPanelCss.includes('.settings-section-state{justify-self:end;width:58px;height:38px') && settingsPanelCss.includes('white-space:nowrap'), 'Settings action controls must stay horizontal and unclipped');",
              "assert(settingsPanelCss.includes('.settings-grid,.account-settings-grid{display:grid') && settingsPanelCss.includes('@media(max-width:1180px){.settings-grid,.account-settings-grid{grid-template-columns:1fr}}'), 'Settings forms must remain responsive without relying on obsolete section-state controls');"
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('stale settings assertion not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-runtime-settings-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime-quality-check.mjs .github/workflows/patch-runtime-settings-contract.yml
          git commit -m 'fix(qa): validate current settings action model'
          git push origin HEAD:main
      - name: Run full QA on patched main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qa.yml --ref main
