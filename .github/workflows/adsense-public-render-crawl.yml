name: AdSense public render and 45-guide discovery audit
on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  indexability-and-discovery:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load published LIFE editorial source as manifest of expected articles
        uses: actions/checkout@v4
        with:
          repository: pc9839a-lgtm/life-pagero
          ref: main
          path: life-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehydrate published LIFE articles; do not deploy or modify remote site
        run: npm run build
        working-directory: life-source
      - name: Crawl live PageRo home, LIFE hub, both sitemaps, and all published guides
        run: node scripts/adsense-public-crawl.mjs
      - name: Save inspectable report even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsense-public-crawl-report
          path: artifacts/adsense-public-crawl.json
          retention-days: 14
          if-no-files-found: ignore
  visible-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Find real Chrome executable
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          echo "INLET_BROWSER_QA_CHROME_PATH=$browser" >> "$GITHUB_ENV"
      - name: Verify hydrated, publicly visible home (desktop)
        env:
          INLET_BROWSER_QA_URL: https://pagero.kr/
          INLET_BROWSER_QA_REQUIRE: '1'
          INLET_BROWSER_QA_VIEWPORTS: desktop
          INLET_BROWSER_QA_EXPECT_SELECTOR: ".pagero-exact-home .c63-life-bridge,.pagero-exact-home .c63-life-post,.pagero-exact-home .c63-calltag-bridge,.pagero-exact-home .footer-links a[href='/life/']"
          INLET_BROWSER_QA_EXPECT_TEXT: "생활에 필요한 정보,생활정보 전체보기,문의가 오면"
          INLET_BROWSER_QA_EXPECT_COMPUTED: ".pagero-exact-home .c63-life-bridge|display|block;.pagero-exact-home .c63-calltag-bridge|display|block"
        run: node scripts/browser-visual-quality-check.mjs
      - name: Verify hydrated, publicly visible home (mobile)
        env:
          INLET_BROWSER_QA_URL: https://pagero.kr/
          INLET_BROWSER_QA_REQUIRE: '1'
          INLET_BROWSER_QA_VIEWPORTS: mobile
          INLET_BROWSER_QA_EXPECT_SELECTOR: ".pagero-exact-home .c63-life-bridge,.pagero-exact-home .c63-life-post,.pagero-exact-home .c63-calltag-bridge,.pagero-exact-home .footer-links a[href='/life/']"
          INLET_BROWSER_QA_EXPECT_TEXT: "생활에 필요한 정보,생활정보 전체보기,문의가 오면"
          INLET_BROWSER_QA_EXPECT_COMPUTED: ".pagero-exact-home .c63-life-bridge|display|block;.pagero-exact-home .c63-calltag-bridge|display|block"
        run: node scripts/browser-visual-quality-check.mjs
      - name: Verify LIFE 45-guide editorial archive is visible after rendering
        env:
          INLET_BROWSER_QA_URL: https://pagero.kr/life/
          INLET_BROWSER_QA_REQUIRE: '1'
          INLET_BROWSER_QA_VIEWPORTS: mobile
          INLET_BROWSER_QA_EXPECT_SELECTOR: ".life-archive-grid,.life-archive-group,.life-archive-note"
          INLET_BROWSER_QA_EXPECT_TEXT: "분야별 생활정보 전체보기,LIFE EDITORIAL ARCHIVE"
          INLET_BROWSER_QA_EXPECT_COMPUTED: ".life-archive-grid|display|grid"
        run: node scripts/browser-visual-quality-check.mjs
  publish-result:
    needs: [indexability-and-discovery, visible-browser]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record post-deploy crawl verdict on the deployed commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          CRAWL_RESULT: ${{ needs.indexability-and-discovery.result }}
          BROWSER_RESULT: ${{ needs.visible-browser.result }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          good=(os.environ['CRAWL_RESULT']=='success' and os.environ['BROWSER_RESULT']=='success')
          state='success' if good else 'failure'
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['TARGET_SHA']
          payload={
            'state':state,
            'context':'adsense/phase3-public-after-deploy',
            'description':'LIFE 45-guide live crawl and desktop/mobile browser passed' if good else 'LIFE public crawl or browser verification failed',
            'target_url':f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          req=urllib.request.Request(
            f'https://api.github.com/repos/{repo}/statuses/{sha}',
            data=json.dumps(payload).encode('utf-8'),
            headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
            },method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
            if response.status != 201: raise SystemExit('Could not record postdeploy audit status')
          print('POSTDEPLOY_AUDIT',state,'deployed_sha',sha,'crawl',os.environ['CRAWL_RESULT'],'browser',os.environ['BROWSER_RESULT'],flush=True)
          if not good:raise SystemExit('Postdeploy audit failed; never report this commit as verified')
          PY
