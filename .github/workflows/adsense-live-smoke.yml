name: AdSense pagero production check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adsense-live-smoke.yml
      - functions/_middleware.js
      - functions/lib/pageroRootSeo.js
      - public/tools/**
      - public/sitemap.xml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate public article/tool delivery and legacy domain redirect
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error
          pages = {
            'https://pagero.kr/': '페이지로',
            'https://pagero.kr/tools/lead-calculator/': '광고는 클릭이 아니라',
            'https://pagero.kr/life/': '생활비서',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, msg, headers, newurl):
              return None
          opener = urllib.request.build_opener(NoRedirect)
          missing = dict(pages)
          redirect_ok = False
          for attempt in range(1, 7):
            print(f'Attempt {attempt}/6', flush=True)
            for url, needle in list(missing.items()):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=13) as r:
                  html=r.read().decode('utf-8','replace')
                  status=r.status
                  good=status==200 and needle in html
                  print(f'{status} {url} marker={needle in html}',flush=True)
                  if good: missing.pop(url)
              except Exception as e:
                print(f'WAIT {url} {str(e)[:100]}',flush=True)
            if not redirect_ok:
              try:
                req=urllib.request.Request('https://life.pagero.kr/car/car-inspection-period/',headers={'User-Agent':'Mozilla/5.0'})
                response=opener.open(req,timeout=13)
                status=response.status
                location=response.headers.get('Location','')
                response.close()
              except urllib.error.HTTPError as e:
                status=e.code
                location=e.headers.get('Location','')
              except Exception as e:
                print(f'WAIT redirect {str(e)[:100]}',flush=True)
                status=0;location=''
              redirect_ok=status==301 and location.startswith('https://pagero.kr/life/car/car-inspection-period/')
              print(f'legacy redirect={status} location={location} valid={redirect_ok}',flush=True)
            if not missing and redirect_ok:break
            if attempt < 6:time.sleep(24)
          if missing or not redirect_ok:
            print('ERROR: missing live pages or unredirected duplicate host; pages='+str(list(missing))+' redirect='+str(redirect_ok))
            raise SystemExit(1)
          print('OK: pagero public routes and legacy canonical redirect verified')
          PY
