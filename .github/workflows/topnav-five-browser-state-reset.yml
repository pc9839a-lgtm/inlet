name: Topnav Five Browser State Reset

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/topnav-five-left-align-v2-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/topnav-five-left-align-v2-20260804
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply browser state reset
        run: python3 scripts/bootstrap-topnav-five-browser-state-reset.py

      - name: Install
        run: npm ci

      - name: Browser contract
        run: npm run browser:landing:contract:qa

      - name: Build
        run: npm run build

      - name: Commit browser state reset
        run: |
          git config user.name "Inlet Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/landing-browser-regression-check.mjs scripts/landing-browser-regression-contract-check.mjs
          git commit -m "test: reset topnav browser fixture after five-menu check"
          git push origin HEAD:fix/topnav-five-left-align-v2-20260804
