name: Meta lead live diagnosis — 2026-11-11
on:
  push:
    branches:
      - ops/meta-lead-20261111-recovery
    paths:
      - .github/workflows/meta-lead-20261111-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query production D1 metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error('Production Cloudflare credentials unavailable');
          const url = 'https://api.cloudflare.com/client/v4/accounts/' + account +
            '/d1/database/b68d3820-001f-4dbe-87cd-dc9fc0be17ee/query';
          async function get(sql, params = []) {
            const res = await fetch(url, {
              method: 'POST',
              headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
              body: JSON.stringify({sql, params}),
              signal: AbortSignal.timeout(20000)
            });
            const obj = await res.json();
            if (!res.ok || !obj.success) {
              console.log('D1 status:',res.status,
                'error codes:',JSON.stringify((obj.errors||[]).map(e=>({code:e.code,message:String(e.message||'').slice(0,160)}))));
              throw new Error('D1 metadata query unsuccessful');
            }
            return obj.result?.[0]?.results || [];
          }
          const lead = await get(
            "SELECT event_id, ct_status, ad_status, ct_attempts, ad_attempts, ct_error, ad_error, created_at, updated_at FROM meta_sheet_dual_queue WHERE event_id=? LIMIT 1",
            ['meta-l1870743443942053']);
          console.log('QUEUE_STATUS',JSON.stringify({
            present:lead.length > 0,
            rows:lead.map(r=>({
              id:r.event_id,ct_status:r.ct_status,ad_status:r.ad_status,
              ct_attempts:r.ct_attempts,ad_attempts:r.ad_attempts,
              ct_error:String(r.ct_error||'').slice(0,100),
              ad_error:String(r.ad_error||'').slice(0,100),
              updated:r.updated_at
            }))
          }));
          const saved = await get(
            "SELECT COUNT(*) AS n FROM calltag_lead_events WHERE external_id=?",
            ['meta-l1870743443942053']);
          console.log('CALLTAG_COUNT',Number(saved[0]?.n||0));
          JS
