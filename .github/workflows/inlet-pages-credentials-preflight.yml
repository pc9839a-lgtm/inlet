name: Inlet Pages Credentials Read-Only Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inlet-pages-credentials-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEFAULT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEFAULT_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INLET_TOKEN: ${{ secrets.INLET_CLOUDFLARE_API_TOKEN }}
      INLET_ACCOUNT: ${{ secrets.INLET_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check existing Cloudflare Pages project permissions without writes
        shell: bash
        run: |
          node <<'NODE'
          const accounts=[
            ['default',process.env.DEFAULT_ACCOUNT],
            ['inlet',process.env.INLET_ACCOUNT],
          ];
          const tokens=[
            ['default',process.env.DEFAULT_TOKEN],
            ['inlet',process.env.INLET_TOKEN],
          ];
          const combinations=[];
          for (const [tokenName, token] of tokens) {
            if (!token) {
              console.log('PREFLIGHT',JSON.stringify({token:tokenName,present:false}));
              continue;
            }
            try {
              const r=await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify',{
                headers:{Authorization:'Bearer '+token,Accept:'application/json'},
                signal:AbortSignal.timeout(12000),
              });
              const body=await r.json().catch(()=>({}));
              console.log('TOKEN_VERIFY',JSON.stringify({
                token:tokenName,http:r.status,active:body.success===true&&body.result?.status==='active',
                errors:Array.isArray(body.errors)?body.errors.map(e=>String(e.code||'unknown')).slice(0,3):[],
              }));
            } catch (err) {
              console.log('TOKEN_VERIFY',JSON.stringify({token:tokenName,transport:String(err.name||'network')}));
            }
            for (const [accountName, account] of accounts) {
              if (!account) {
                console.log('PREFLIGHT',JSON.stringify({token:tokenName,account:accountName,accountPresent:false}));
                continue;
              }
              const url='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/pages/projects/inlet';
              let outcome={token:tokenName,account:accountName};
              try {
                const response=await fetch(url,{
                  headers:{Authorization:'Bearer '+token,Accept:'application/json'},
                  signal:AbortSignal.timeout(12000),
                });
                const body=await response.json().catch(()=>({}));
                outcome={...outcome,http:response.status,
                  success:body.success===true,
                  branch:body.success===true?String(body?.result?.production_branch||''):'',
                  errorCodes:Array.isArray(body.errors)?body.errors.map(e=>String(e.code||'unknown')).slice(0,4):[],
                };
              } catch (error) {
                outcome={...outcome,transport:String(error.name||'network')};
              }
              console.log('PREFLIGHT',JSON.stringify(outcome));
              combinations.push(outcome);
            }
          }
          const usable=combinations.filter(x=>x.http===200&&x.success&&x.branch==='main');
          console.log('PREFLIGHT_RESULT',JSON.stringify({validPairs:usable.map(x=>x.token+'/'+x.account)}));
          if (!usable.length) process.exitCode=1;
          NODE
