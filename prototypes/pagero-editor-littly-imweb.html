<body>
<header class="topbar">
 <button id="toggleNav" type="button" class="header-action list-toggle" aria-label="블록 목록 열기">☰ <span class="desktop-label">블록</span></button>
 <div class="brand"><div class="brand-icon" aria-hidden="true">P</div><span>페이지로</span></div>
 <div class="top-sep" aria-hidden="true"></div>
 <div class="page-title-group"><span class="kicker">편집 중인 페이지</span><strong id="pageTitleText">라움 스튜디오 · 상담 안내</strong></div>
 <div class="top-grow"></div>
 <div id="saveIndicator" class="save-indicator" aria-live="polite"><i></i>이 브라우저에 임시보관</div>
 <button id="undoBtn" class="header-action subtle" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)">↶</button>
 <button id="previewBtn" class="header-action" type="button"><span class="ic">◫</span> <span id="previewBtnLabel" class="desktop-label">미리보기</span></button>
 <button id="publishBtn" class="header-action primary" type="button"><span class="ic">↗</span><span class="desktop-label">발행</span></button>
</header>
<main class="workspace" id="workspace">
  <aside class="navigator" id="navigator" aria-label="페이지 블록 구성">
    <div class="panel-heading"><h2 class="panel-title">페이지 구성</h2><button type="button" class="btn-add" id="addBlockBtn"><span style="font-size:19px;font-weight:400;line-height:12px">+</span> 블록 추가</button></div>
    <div class="search-box"><span class="search-symbol" aria-hidden="true">⌕</span><input id="blockSearch" placeholder="블록 이름 검색" aria-label="블록 이름 검색"></div>
    <div class="nav-scroll" id="blockList" aria-label="블록 순서"></div>
    <div class="navigator-footer"><button class="footer-link" id="themeBtn">◈ <span>전체 디자인</span></button><button class="footer-link" id="pageBtn">⚙ <span>페이지 설정</span></button><div class="bottom-note">목록에서 순서 변경 · 미리보기에서 직접 수정</div></div>
  </aside>
  <section class="inspector" aria-label="선택 항목 편집">
    <div class="inspector-head"><div class="inspector-icon" id="inspectorIcon">✎</div><div class="inspector-labels"><h2 id="inspectorTitle">대표 화면</h2><p id="inspectorType">선택한 블록의 내용과 모양</p></div><button class="btn-small" id="inspectorMore" title="선택 블록 더보기" aria-label="선택 블록 더보기">···</button></div>
    <div id="inspectorBody" class="inspector-scroll"></div>
  </section>
  <section class="stage" aria-label="실시간 모바일 미리보기">
    <div class="stage-header"><span class="stage-tag">모바일 390px</span><span style="font-size:11px">화면을 클릭해 선택 · 글을 더블클릭해 수정</span></div>
    <div class="phone" id="phone"><div class="phone-content" id="phoneContent" aria-label="모바일 페이지"><div id="canvasBlocks"></div><div class="phone-bottom"><button id="stickyCTA" type="button">상담 문의하기 ↗</button></div></div></div>

function blockHTML(b){const selected=(state.selectedId===b.id&&mode==='block'&&!preview),label=labels[b.type];const wrap=(str)=>`<section class="canvas-block ${selected?'selected':''}" tabindex="0" role="button" aria-label="${esc(label)} 블록 선택 또는 직접 편집" data-block-id="${esc(b.id)}" data-selection-label="${esc(label)}">${str}</section>`;const edit=(key,cls,tag='div')=>`<${tag} class="${cls}" data-edit="${key}" data-id="${esc(b.id)}">${esc(b[key]||'').replace(/\n/g,'<br>')}</${tag}>`;

function addBlock(type){const templates={hero:{title:'새 대표 화면',desc:'새로운 소개 문구를 입력하세요',eyebrow:'BRAND',cta:'문의하기'},text:{title:'새로운 제목',desc:'여기에 내용을 입력하세요.'},image:{title:'새 이미지',desc:'사진 설명을 입력하세요',image:''},button:{title:'이곳에서 시작하세요',desc:'버튼을 눌러 문의할 수 있습니다.',cta:'상담 문의',target:''},form:{title:'문의 신청',desc:'내용을 남겨주세요.',cta:'문의 접수'},faq:{title:'자주 묻는 질문',desc:'질문을 입력하세요.'},spacer:{},divider:{}};const block={id:idNew(),type,accent:state.accent,align:'left',space:type==='hero'?38:32,hidden:false,...(templates[type]||{})};commit(()=>{const index=state.blocks.findIndex(b=>b.id===state.selectedId);state.blocks.splice(index<0?state.blocks.length:index+1,0,block);state.selectedId=block.id;mode='block'});closeModal();setTimeout(()=>document.querySelector(`[data-block-id="${block.id}"]`)?.scrollIntoView({block:'nearest'}),0)}

if(kind==='cta')inner=`<div class="modal-header"><h2>버튼 동작 미리보기</h2><button class="modal-close" data-close aria-label="닫기">×</button></div><p class="modal-intro">이 버튼은 시안에서 실제 연락처나 외부 사이트를 열지 않습니다. 실제 편집기에서는 버튼을 선택해 연결 대상을 설정합니다.</p><div class="modal-actions"><button class="primary" data-close>확인</button></div>`;
if(kind==='publish')inner=`<div class="modal-header"><h2>발행 미리보기</h2><button class="modal-close" data-close aria-label="닫기">×</button></div><p class="modal-intro">이것은 동작 검토용 독립 시안입니다. 이 버튼은 실제 페이지로에 발행하거나 서버에 저장하지 않습니다.</p><div class="notice"><strong>실제 제품에서의 목표 동작</strong><br>편집본 확인 → 발행 → 공개 페이지 반영 확인. 저장 실패나 충돌 시에는 발행 완료로 표시하지 않습니다.</div><div class="modal-actions"><button class="primary" data-close>확인</button></div>`;
root.innerHTML=`<div class="overlay" role="presentation" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-label="${kind==='add'?'블록 추가':kind==='delete'?'블록 삭제':kind==='cta'?'버튼 동작 안내':kind==='actions'?'블록 작업':'발행 안내'}">${inner}</div></div>`;root.querySelector('button')?.focus();}
function closeModal(){$('modalRoot').innerHTML='';modalType=''}
$('addBlockBtn').addEventListener('click',()=>openModal('add'));
$('toggleNav').addEventListener('click',()=> $('navigator').classList.toggle('drawer-open'));
$('themeBtn').addEventListener('click',()=>{mode='theme';openedMenu='';render();$('navigator').classList.remove('drawer-open')});
$('pageBtn').addEventListener('click',()=>{mode='page';openedMenu='';render();$('navigator').classList.remove('drawer-open')});
$('undoBtn').addEventListener('click',undo);
$('previewBtn').addEventListener('click',()=>{preview=!preview;render()});
$('publishBtn').addEventListener('click',()=>openModal('publish'));
$('blockSearch').addEventListener('input',e=>{currentQuery=e.target.value;renderList(false)});
$('blockList').addEventListener('click',e=>{const selectBtn=e.target.closest('[data-select]');const menuBtn=e.target.closest('[data-menu]');const actBtn=e.target.closest('[data-act]');if(selectBtn){select(selectBtn.dataset.select);return}if(menuBtn){openedMenu=openedMenu===menuBtn.dataset.menu?'':menuBtn.dataset.menu;renderList();return}if(actBtn){act(actBtn.dataset.act,actBtn.dataset.id)}});
let draggedId='';$('blockList').addEventListener('dragstart',e=>{const row=e.target.closest('[data-row]');if(row){draggedId=row.dataset.row;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedId)}});$('blockList').addEventListener('dragover',e=>{if(e.target.closest('[data-row]'))e.preventDefault()});$('blockList').addEventListener('drop',e=>{const row=e.target.closest('[data-row]');if(!row||!draggedId||row.dataset.row===draggedId)return;e.preventDefault();const target=row.dataset.row;commit(()=>{const from=state.blocks.findIndex(b=>b.id===draggedId),to=state.blocks.findIndex(b=>b.id===target);if(from<0||to<0)return;const [block]=state.blocks.splice(from,1);state.blocks.splice(to,0,block)});draggedId=''});
let activeEditSnapshot=null;
$('inspectorBody').addEventListener('focusin',e=>{if(e.target.matches('input, textarea, select'))activeEditSnapshot=structuredClone(state)});
$('inspectorBody').addEventListener('focusout',e=>{if(activeEditSnapshot&&JSON.stringify(activeEditSnapshot)!==JSON.stringify(state)){history.push(activeEditSnapshot);if(history.length>40)history.shift();$('undoBtn').disabled=false;}activeEditSnapshot=null});
$('inspectorBody').addEventListener('input',e=>{const el=e.target;if(el.dataset.prop){setProp(el.dataset.prop,el.value)}if(el.id==='globalPageName'){state.pageName=el.value;noteChange();$('pageTitleText').textContent=state.pageName}if(el.id==='globalColor'){state.accent=el.value;noteChange();renderCanvas();el.nextElementSibling.textContent=el.value}if(el.id==='blockColor'){setProp('accent',el.value);const display=$('blockColor')?.nextElementSibling;if(display)display.textContent=el.value}if(el.id==='blockSpace'){setProp('space',Number(el.value));const display=$('spaceValue');if(display)display.textContent=el.value+'px'}});
$('inspectorBody').addEventListener('click',e=>{if(e.target.closest('#toggleDesign')){const b=$('styleControls');b.hidden=!b.hidden;$('toggleDesign').setAttribute('aria-expanded',String(!b.hidden));$('toggleDesign span').textContent=b.hidden?'⌄':'⌃';return}const align=e.target.closest('[data-align]');if(align){history.push(structuredClone(state));if(history.length>40)history.shift();setProp('align',align.dataset.align);$('inspectorBody').querySelectorAll('[data-align]').forEach(x=>x.classList.toggle('active',x===align))}if(e.target.closest('#changeImageBtn'))$('imageFile')?.click();});
$('inspectorBody').addEventListener('change',e=>{if(e.target.id==='imageFile'){const file=e.target.files?.[0];if(file&&file.type.startsWith('image/')&&file.size<4*1024*1024){const reader=new FileReader();reader.onload=()=>setProp('image',reader.result);reader.readAsDataURL(file)}else if(file){alert('4MB 이하의 이미지 파일을 선택해주세요.')}}});
$('inspectorMore').addEventListener('click',()=>{if(chosen())openModal('actions')});
$('canvasBlocks').addEventListener('click',e=>{if(preview)return;const block=e.target.closest('[data-block-id]');if(block){if(e.target.closest('[data-cta]'))e.preventDefault();if(e.target.closest('[contenteditable=true]'))return;if(state.selectedId!==block.dataset.blockId || mode!=='block')select(block.dataset.blockId)}});
function beginInlineEdit(id,key='title'){if(preview)return;if(state.selectedId!==id||mode!=='block')select(id);const fresh=$('canvasBlocks').querySelector(`[data-block-id="${id}"] [data-edit="${key}"]`)||$('canvasBlocks').querySelector(`[data-block-id="${id}"] [data-edit]`);if(!fresh)return;fresh.setAttribute('contenteditable','true');fresh.setAttribute('role','textbox');fresh.setAttribute('aria-label','텍스트 직접 수정');fresh.focus();const range=document.createRange();range.selectNodeContents(fresh);range.collapse(false);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}
$('canvasBlocks').addEventListener('dblclick',e=>{const node=e.target.closest('[data-edit]');const block=node?.closest('[data-block-id]');if(block)beginInlineEdit(block.dataset.blockId,node.dataset.edit)});
$('canvasBlocks').addEventListener('keydown',e=>{const el=e.target.closest('[contenteditable=true]');if(!el){const block=e.target.closest('[data-block-id]');if(!preview&&block&&(e.key==='Enter'||e.key===' ')){e.preventDefault();beginInlineEdit(block.dataset.blockId)}return}if(e.key==='Escape'){e.preventDefault();renderCanvas()}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}});
$('canvasBlocks').addEventListener('focusout',e=>{const el=e.target.closest('[contenteditable=true]');if(!el)return;const b=state.blocks.find(x=>x.id===el.dataset.id);if(!b)return;const value=el.innerText.replace(/\r/g,'').trim();if(value!==(b[el.dataset.edit]||'')){history.push(structuredClone(state));b[el.dataset.edit]=value;noteChange();$('undoBtn').disabled=false;renderInspector();renderList()}renderCanvas()});
$('selectionBar').addEventListener('click',e=>{const b=chosen();const btn=e.target.closest('[data-quick]');if(btn&&b)act(btn.dataset.quick,b.id)});
$('stickyCTA').addEventListener('click',()=>{if(preview){openModal('cta');return}const b=state.blocks.find(x=>x.type==='form');if(b){select(b.id);document.querySelector(`[data-block-id="${b.id}"]`)?.scrollIntoView({block:'center',behavior:'smooth'})}});
$('modalRoot').addEventListener('click',e=>{if(e.target.matches('[data-overlay]')||e.target.closest('[data-close]')){closeModal();return}const add=e.target.closest('[data-add]');if(add)addBlock(add.dataset.add);const a=e.target.closest('[data-modal-act]');if(a){closeModal();act(a.dataset.modalAct,a.dataset.id)}const del=e.target.closest('[data-delete]');if(del){const id=del.dataset.delete;commit(()=>{state.blocks=state.blocks.filter(b=>b.id!==id);state.selectedId=state.blocks.at(0)?.id||''});closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();openedMenu='';$('navigator').classList.remove('drawer-open');renderList()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!document.activeElement?.isContentEditable){e.preventDefault();undo()}});
render();saved();
</script>
</body>
</html>
