<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>페이지로 요금제 결제</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(720px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid #d8dde5;border-radius:12px;overflow:hidden}.head{padding:24px 26px;border-bottom:1px solid #e3e6ea}.head small{display:block;margin-bottom:6px;color:#6b7280;font-size:12px;font-weight:700}.head h1{margin:0;font-size:24px}.plans{display:grid}.plan{min-height:86px;padding:16px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;border-bottom:1px solid #eceef1}.plan:last-child{border-bottom:0}.plan strong{display:block;font-size:15px}.plan span{display:block;margin-top:5px;color:#6b7280;font-size:12px}.price{text-align:right;font-size:16px;font-weight:900}.action{padding:22px 26px;border-top:1px solid #e3e6ea;background:#f7f8fa}.action p{margin:0 0 14px;color:#4b5563;font-size:13px;line-height:1.55}.button{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;background:#111827;color:#fff;text-decoration:none;font-size:14px;font-weight:850}.back{display:block;margin-top:14px;text-align:center;color:#6b7280;text-decoration:none;font-size:12px}@media(max-width:520px){main{margin:20px auto}.plan{grid-template-columns:1fr}.price{text-align:left}}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <header class="head"><small>페이지로</small><h1>요금제 결제</h1></header>
      <div class="plans">
        <div class="plan"><div><strong>페이지로</strong><span>랜딩페이지 운영과 접수 관리</span></div><div class="price">월 3,500원</div></div>
      </div>
      <div class="action">
        <p>자동 결제 연동 전에는 계정과 선택한 요금제를 확인한 뒤 결제를 안내합니다. 결제 제공자 연결 후에는 결제창이 바로 열립니다.</p>
        <a class="button" href="mailto:support@pagero.kr?subject=%ED%8E%98%EC%9D%B4%EC%A7%80%EB%A1%9C%20%EA%B2%B0%EC%A0%9C%20%EB%AC%B8%EC%9D%98">결제 문의</a>
        <a class="back" href="/app">설정으로 돌아가기</a>
      </div>
    </section>
  </main>
</body>
</html>
