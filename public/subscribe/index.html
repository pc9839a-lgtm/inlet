<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>페이지로 요금제 결제</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(780px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid #d8dde5;border-radius:12px;overflow:hidden}.head{padding:26px 28px;border-bottom:1px solid #e3e6ea}.head small{display:block;margin-bottom:7px;color:#6b7280;font-size:12px;font-weight:700}.head h1{margin:0;font-size:26px}.plans{display:grid}.plan{min-height:94px;padding:18px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;border-bottom:1px solid #eceef1}.plan:last-child{border-bottom:0}.plan strong{display:block;font-size:16px}.plan span{display:block;margin-top:6px;color:#6b7280;font-size:13px}.plan.active{background:#f8fbff;box-shadow:inset 4px 0 #2563eb}.price{text-align:right;font-size:17px;font-weight:900}.action{padding:24px 28px;border-top:1px solid #e3e6ea;background:#f7f8fa}.action p{margin:0 0 15px;color:#4b5563;font-size:13px;line-height:1.6}.button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:8px;background:#111827;color:#fff;text-decoration:none;font-size:14px;font-weight:850}.back{display:block;margin-top:15px;text-align:center;color:#6b7280;text-decoration:none;font-size:12px}@media(max-width:520px){main{margin:20px auto}.plan{grid-template-columns:1fr}.price{text-align:left}}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <header class="head"><small>페이지로</small><h1 id="page-title">요금제 결제</h1></header>
      <div class="plans">
        <div class="plan" data-product="pagero_free"><div><strong>무료</strong><span>기본 페이지 제작과 운영</span></div><div class="price">무료</div></div>
        <div class="plan" data-product="pagero_monthly"><div><strong>클래식</strong><span>페이지 운영과 고객 접수 관리</span></div><div class="price">월 3,500원</div></div>
        <div class="plan" data-product="pagero_pro_monthly"><div><strong>프로</strong><span>고급 연동 + 개인 도메인 1개 + HTTPS/SSL 관리 포함</span></div><div class="price">월 5,500원</div></div>
        <div class="plan" data-product="pagero_domain_monthly"><div><strong>개인 도메인 + HTTPS</strong><span>무료·클래식용 추가 옵션 · 도메인 연결, SSL 발급·갱신 및 HTTPS 관리</span></div><div class="price">월 1,000원</div></div>
      </div>
      <div class="action">
        <p id="checkout-copy">자동 결제 연동 전에는 계정과 선택한 요금제를 확인한 뒤 결제를 안내합니다. 결제 제공자 연결 후에는 선택한 요금제의 결제창이 바로 열립니다.</p>
        <a class="button" id="checkout-link" href="mailto:support@pagero.kr?subject=%ED%8E%98%EC%9D%B4%EC%A7%80%EB%A1%9C%20%EA%B2%B0%EC%A0%9C%20%EB%AC%B8%EC%9D%98">결제 문의</a>
        <a class="back" href="/app?tab=settings">설정으로 돌아가기</a>
      </div>
    </section>
  </main>
  <script>
    const product = new URLSearchParams(location.search).get('product') || '';
    const selected = document.querySelector(`[data-product="${CSS.escape(product)}"]`);
    if (selected) selected.classList.add('active');
    if (product === 'pagero_domain_monthly') {
      document.getElementById('page-title').textContent = '개인 도메인 + HTTPS';
      document.getElementById('checkout-copy').textContent = '월 1,000원에 개인 도메인 1개 연결과 SSL 인증서 발급·갱신, HTTPS 관리를 제공합니다. 페이지로 프로 요금제에는 1개가 포함되어 별도 결제가 필요하지 않습니다.';
      document.getElementById('checkout-link').href = 'mailto:support@pagero.kr?subject=' + encodeURIComponent('페이지로 개인 도메인 + HTTPS 결제 문의');
    }
  </script>
</body>
</html>
