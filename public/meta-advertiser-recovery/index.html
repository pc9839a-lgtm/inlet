<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>광고주 DB 전송 진단</title>
<style>
:root{font-family:system-ui,-apple-system,"Pretendard",sans-serif;background:#f8f9fb;color:#17191d}
*{box-sizing:border-box}body{margin:0;padding:25px;display:flex;justify-content:center}
main{width:min(100%,670px);background:white;border:1px solid #e0e5ec;border-radius:18px;padding:30px}
h1{font-size:24px;letter-spacing:-.5px;margin:0 0 10px}h2{font-size:16px;margin:25px 0 12px}
p{font-size:14px;line-height:1.7;color:#475569}
label{font-size:14px;font-weight:650;display:block;margin:18px 0 8px}
input[type=password]{width:100%;height:49px;padding:12px;border:1px solid #cad3de;border-radius:10px}
button{height:48px;width:100%;border-radius:10px;border:0;background:#265ed6;color:white;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:white;border:1px solid #265ed6;color:#265ed6}
button:disabled{opacity:.5;cursor:wait}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f9;border-radius:10px;padding:16px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}
#details,#report{display:none}
.note{border-left:3px solid #cbd5e1;padding-left:13px;font-size:13px}
.log{border:1px solid #e3e7ee;border-radius:10px;padding:14px;margin:10px 0;background:#fcfdff}
.log pre{margin:8px 0 0}.warn{color:#9a5400}
</style>
</head>
<body><main>
<h1>광고주 DB 전송 진단</h1>
<p>메타 개인회생 신청 1건의 전송 기록을 확인합니다. 콜태그 등록은 변경하지 않으며, 이 페이지에서 고객정보를 광고주에게 재전송하지 않습니다.</p>
<label for="webhook">기존 콜태그 Webhook 주소</label>
<input id="webhook" type="password" autocomplete="off" spellcheck="false" placeholder="https://pagero.kr/api/calltag/v1/hooks/ctwh_...">
<button id="check">저장된 전송 기록 조회</button>
<div id="report" role="status" aria-live="polite"><h2>전송 기록</h2><pre id="summary"></pre></div>
<section id="details">
<p id="historyNotice" class="note"></p>
<h2>광고주 API 요청·응답 로그</h2>
<div id="logContainer"></div>
<button id="probe" class="secondary">광고주 서버 연결 검사 (HEAD · 고객정보 전송 안 함)</button>
<p class="note">HEAD 검사로 HTTP·리다이렉트·연결 오류만 확인합니다. 실제 POST를 수행하지 않으므로 광고주 DB 저장 성공을 증명하지는 못합니다.</p>
</section>
</main>
<script>
(()=>{
 const key=document.getElementById('webhook');
 const button=document.getElementById('check');
 const probe=document.getElementById('probe');
 const summary=document.getElementById('summary');
 const report=document.getElementById('report');
 const details=document.getElementById('details');
 const history=document.getElementById('historyNotice');
 const logs=document.getElementById('logContainer');
 const show=text=>{report.style.display='block';summary.textContent=text;};
 async function request(action){
   if(!key.value.trim())throw Error('콜태그 Webhook 주소를 입력하세요.');
   const response=await fetch('/api/integrations/meta-sheets/recovery',{
     method:'POST',
     headers:{'X-Meta-Relay-Token':key.value.trim(),'Content-Type':'application/json'},
     body:JSON.stringify({action}),cache:'no-store',redirect:'error'
   });
   const data=await response.json();
   if(!response.ok)throw Error(({
     UNAUTHORIZED:'Webhook 주소가 다르거나 연결이 비활성 상태입니다.',
     DIAGNOSTICS_ERROR:'로그 조회 실패. 서버 실행 로그 확인이 필요합니다.'
   })[data.error]||('HTTP '+response.status+' / '+String(data.error||'UNKNOWN')));
   return data;
 }
 function display(data){
   if(!data.found){
     details.style.display='none';show('Cloudflare에 대상 신청 데이터가 없습니다. 구글시트 릴레이부터 확인해야 합니다.');return;
   }
   const empty=data.requestShape?.empty||[];
   show('콜태그 상태: '+data.calltagStatus+
     '\n광고주 상태: '+data.advertiserStatus+
     '\n광고주 POST 시도: '+data.advertiserAttempts+'회'+
     '\n최종 기록: '+(data.lastError||'(없음)')+
     '\n광고주 ITEM: '+(data.requestShape?.item||'확인 필요')+
     '\n비어 있는 필드: '+(empty.length?empty.join(', '):'없음')+
     '\n최종 업데이트: '+data.updatedAt);
   details.style.display='block';
   history.textContent=data.historicalResponsesUnavailable
     ? '과거 전송에서 HTTP 상태·응답 본문을 저장하지 않아 이전 시도 원인은 소급 조회할 수 없습니다. 지금부터 발생하는 요청은 상세 기록됩니다.'
     : '아래는 서버 D1에 기록된 HTTP 진단 내용입니다.';
   logs.replaceChildren();
   if(!(data.logs||[]).length){
     const p=document.createElement('p');p.textContent='이전 HTTP 상세 로그 없음 (기록 기능 도입 전 전송)';logs.append(p);
   }
   for(const x of data.logs||[]){
     const div=document.createElement('div');div.className='log';
     const pre=document.createElement('pre');
     pre.textContent='구분: '+(x.method==='HEAD'?'연결 검사 (고객 미전송)':'광고주 실제 POST')+
       '\n기록 시각: '+x.createdAt+
       '\n시도: '+x.attempt+
       '\n목적지: '+x.target+
       '\nITEM: '+x.item+
       '\nHTTP: '+(x.httpStatus||'응답 없음')+
       '\n소요: '+x.elapsedMs+'ms'+
       '\n결과: '+x.outcome+
       '\n응답 Content-Type: '+(x.responseType||'없음')+
       '\n응답 내용(마스킹): '+(x.responsePreview||'없음')+
       '\n리다이렉트: '+(x.redirectHost?x.redirectHost+x.redirectPath:'없음')+
       '\n네트워크 오류: '+(x.exceptionType||'없음')+
       (x.exceptionCode?' / '+x.exceptionCode:'')+
       '\n누락 필드: '+(x.emptyFields?.join(', ')||'없음');
     div.append(pre);logs.append(div);
   }
 }
 button.addEventListener('click',async()=>{
   button.disabled=true;show('서버에 저장된 전송 기록 조회 중...');
   try{display(await request('status'));}catch(e){show('조회 실패: '+e.message)}
   finally{button.disabled=false}
 });
 probe.addEventListener('click',async()=>{
   probe.disabled=true;show('광고주 서버 HEAD 연결 테스트 중 (고객정보 없음)...');
   try{display(await request('probe-connection'));}catch(e){show('연결 검사 실패: '+e.message)}
   finally{probe.disabled=false}
 });
})();
</script></body></html>
