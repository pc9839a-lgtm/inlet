<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>광고주 DB 전송 복구 · 개인회생</title>
<style>
:root{font-family:system-ui,-apple-system,"Pretendard",sans-serif;background:#f8f9fb;color:#151719}
*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center}
main{width:min(100%,500px);border:1px solid #dfe3ea;border-radius:16px;background:white;padding:28px}
h1{font-size:23px;margin:0 0 12px;letter-spacing:-.5px}
p{font-size:14px;line-height:1.65;color:#475569;margin:0 0 16px}
label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}
input{width:100%;height:50px;padding:10px;border-radius:9px;border:1px solid #cbd5e1;font-size:14px}
button{width:100%;height:48px;background:#2363db;color:white;border:0;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
button:disabled{opacity:.55;cursor:default}
button.secondary{background:white;color:#2363db;border:1px solid #2363db}
#status{display:none;background:#f1f5f9;border-radius:9px;padding:16px;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0}
#resendArea{display:none;margin-top:20px;border-top:1px solid #e2e8f0;padding-top:18px}
.check{display:flex;gap:10px;font-size:13px;line-height:1.55;align-items:flex-start}
.check input{height:18px;width:18px;flex:none;margin:2px 0 0}
small{display:block;font-size:12px;line-height:1.6;color:#64748b;margin-top:12px}
</style>
</head>
<body><main>
<h1>광고주 DB 전송 복구</h1>
<p>개인회생 신청 1건의 광고주 전송 상태만 확인합니다. 콜태그 고객 등록에는 영향을 주지 않습니다.</p>
<label for="key">기존 콜태그 Webhook 주소</label>
<input type="password" id="key" autocomplete="off" spellcheck="false" placeholder="https://pagero.kr/api/calltag/v1/hooks/ctwh_..." />
<button id="check" class="secondary">광고주 전송 상태 확인</button>
<div id="status" role="status" aria-live="polite"></div>
<section id="resendArea">
<p>광고주 전산에서 해당 접수 건이 없다는 사실을 확인한 경우에만 재전송할 수 있습니다. 중복 접수 여부를 확인하지 못했다면 누르지 마세요.</p>
<label class="check"><input id="confirmed" type="checkbox"/> 광고주 전산에 이 접수가 없음을 확인했고, 이 1건만 재전송하는 데 동의합니다.</label>
<button id="resend" disabled>광고주 DB에 기존 신청 1건 전송</button>
</section>
<small>대상: 2026-11-10 메타 접수 1건 · 광고주 캠페인 ITEM=64 · Webhook 주소는 저장하지 않습니다.</small>
</main>
<script>
(()=>{
 const key=document.getElementById('key'), check=document.getElementById('check');
 const status=document.getElementById('status'), panel=document.getElementById('resendArea');
 const confirmed=document.getElementById('confirmed'),resend=document.getElementById('resend');
 let state=null;
 const say=(text)=>{status.style.display='block';status.textContent=text};
 const send=async(action,confirmation=false)=>{
  const token=key.value.trim();
  if(!token)throw Error('콜태그 Webhook 주소를 입력하세요.');
  const response=await fetch('/api/integrations/meta-sheets/recovery',{
   method:'POST',headers:{'X-Meta-Relay-Token':token,'Content-Type':'application/json'},
   body:JSON.stringify({action,confirmedNotReceived:confirmation}),
   cache:'no-store',redirect:'error'
  });
  const data=await response.json();
  if(!response.ok)throw Error(({
   UNAUTHORIZED:'Webhook 주소가 틀렸거나 연결이 비활성 상태입니다.',
   NOT_IN_CLOUDFLARE:'현재 이 신청이 서버 접수 대기열에 없습니다. 구글시트 전송 단계 점검이 필요합니다.',
   ALREADY_MARKED_SENT:'서버에서는 이미 광고주 전송 성공으로 기록했습니다. 중복 전송하지 않았습니다.',
   NOT_RETRYABLE:'현재 광고주 전송이 진행 중입니다. 완료 뒤 다시 확인하세요.',
   MAX_ATTEMPTS:'재전송 횟수 제한에 도달했습니다. 광고주 접수 여부 확인이 필요합니다.'
  })[data.error]||('서버 응답: '+data.error+' (HTTP '+response.status+')'));
  return data;
 };
 check.addEventListener('click',async()=>{
  check.disabled=true; panel.style.display='none'; confirmed.checked=false; state=null;
  say('기존 신청 전송 상태 확인 중...');
  try{
   state=await send('status');
   if(!state.found){say('해당 리드가 Cloudflare 접수 대기열에 없습니다. 구글시트 연결 상태를 먼저 확인해야 합니다.');return;}
   say('콜태그 등록 상태: '+(state.calltagStatus||'확인 필요')+
       '\n광고주 상태: '+(state.advertiserStatus||'확인 필요')+
       '\n광고주 전송 시도: '+state.advertiserAttempts+'회'+
       (state.advertiserError?'\n기록: '+state.advertiserError:''));
   if(['PENDING','REVIEW','ERROR'].includes(state.advertiserStatus)&&state.advertiserAttempts<2)panel.style.display='block';
  }catch(e){say('확인 실패: '+e.message)}
  finally{check.disabled=false}
 });
 confirmed.addEventListener('change',()=>resend.disabled=!confirmed.checked);
 resend.addEventListener('click',async()=>{
  if(!state||!confirmed.checked)return;
  resend.disabled=true;check.disabled=true;say('광고주 API에 기존 신청 1건 전송 중...');
  try{
   const d=await send('retry-advertiser',true);
   say('광고주 전송 요청: 완료\n광고주 응답 HTTP: '+d.advertiserHttpStatus+
     '\n서버 접수 판정: '+d.advertiserStatus+
     (d.receiptVerified?'\n광고주 성공 응답 확인':'\n광고주 실제 전산 접수 여부를 확인해야 합니다'));
   panel.style.display='none';
  }catch(e){say('전송 확인 필요: '+e.message)}
  finally{check.disabled=false}
 });
})();
</script>
</body></html>
