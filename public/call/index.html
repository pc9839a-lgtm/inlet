<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>페이지로 콜링크 계정</title>
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f3f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#edf2ff,#f8fafc 48%,#ecfdf3)}main{width:min(520px,calc(100% - 28px));margin:0 auto;padding:40px 0 64px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:46px;height:46px;border-radius:15px;background:#3156d9;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 12px 30px rgba(49,86,217,.28)}h1{font-size:25px;margin:0}.sub{font-size:13px;color:#667085;margin:4px 0 0}.card{background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:22px;box-shadow:0 20px 55px rgba(16,24,40,.09)}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f4f7;border-radius:14px;padding:4px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:11px;border-radius:11px;font-weight:800;color:#667085}.tabs button.active{background:#fff;color:#3156d9;box-shadow:0 2px 9px rgba(16,24,40,.08)}form{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:#344054}.field input{width:100%;min-height:50px;border:1px solid #d0d5dd;border-radius:13px;padding:0 14px;font-size:15px;background:#fff}.field input:focus{outline:3px solid #dbe4ff;border-color:#3156d9}.row{display:grid;grid-template-columns:1fr 120px;gap:8px}.primary,.secondary{border:0;border-radius:13px;min-height:50px;font-weight:900;font-size:15px;cursor:pointer}.primary{background:#3156d9;color:#fff}.secondary{background:#eef2ff;color:#3156d9}.notice{display:none;margin-top:14px;border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.55}.notice.show{display:block}.notice.ok{background:#ecfdf3;color:#067647}.notice.error{background:#fef3f2;color:#b42318}.links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:20px;font-size:12px}.links a{color:#667085;text-decoration:none}.hidden{display:none!important}.account{display:none}.account.show{display:block}.status{padding:14px;border-radius:15px;background:#fff6ed;color:#b54708;margin:14px 0;font-size:14px;line-height:1.6}.status.active{background:#ecfdf3;color:#067647}@media(max-width:420px){main{padding-top:24px}.card{padding:18px}.row{grid-template-columns:1fr}.row .secondary{min-height:46px}}
  </style>
</head>
<body>
<main>
  <header class="brand"><div class="logo">P</div><div><h1>페이지로 콜링크</h1><p class="sub">통화 후 고객 안내문자를 관리하는 전용 계정</p></div></header>
  <section class="card" id="authCard">
    <div class="tabs"><button id="tabLogin" class="active" type="button">로그인</button><button id="tabSignup" type="button">회원가입</button></div>
    <form id="loginForm">
      <div class="field"><label>이메일</label><input id="loginEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label>비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">로그인</button>
      <button class="secondary" id="openReset" type="button">비밀번호 찾기</button>
    </form>
    <form id="signupForm" class="hidden">
      <div class="field"><label>이름</label><input id="signupName" maxlength="80" required></div>
      <div class="field"><label>휴대폰번호</label><input id="signupPhone" inputmode="tel" maxlength="20" required></div>
      <div class="field"><label>이메일</label><div class="row"><input id="signupEmail" type="email" autocomplete="email" required><button class="secondary" id="requestCode" type="button">인증메일</button></div></div>
      <div class="field"><label>이메일 인증번호</label><input id="signupCode" inputmode="numeric" maxlength="6" placeholder="6자리 인증번호" required></div>
      <div class="field"><label>브랜드명</label><input id="signupBrand" maxlength="100" required></div>
      <div class="field"><label>업종</label><input id="signupIndustry" maxlength="100" placeholder="예: 병원, 미용실, 온라인 쇼핑몰" required></div>
      <div class="field"><label>비밀번호</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="영문+숫자 6자리 이상" required></div>
      <button class="primary" type="submit">이메일 인증 후 가입</button>
    </form>
    <form id="resetForm" class="hidden">
      <div class="field"><label>가입 이메일</label><div class="row"><input id="resetEmail" type="email" required><button class="secondary" id="requestResetCode" type="button">인증메일</button></div></div>
      <div class="field"><label>인증번호</label><input id="resetCode" inputmode="numeric" maxlength="6" required></div>
      <div class="field"><label>새 비밀번호</label><input id="resetPassword" type="password" placeholder="영문+숫자 6자리 이상" required></div>
      <button class="primary" type="submit">비밀번호 변경</button>
      <button class="secondary" id="closeReset" type="button">로그인으로 돌아가기</button>
    </form>
    <div id="notice" class="notice"></div>
  </section>
  <section class="card account" id="accountCard">
    <h2 style="margin:0">계정 상태</h2><p class="sub" id="profileText"></p><div class="status" id="entitlementText"></div>
    <a class="primary" id="paymentLink" href="/call/subscribe/" style="display:grid;place-items:center;text-decoration:none">이용권 결제 안내</a>
    <button class="secondary" id="logout" type="button" style="width:100%;margin-top:8px">로그아웃</button>
  </section>
  <nav class="links"><a href="/call/privacy/">개인정보처리방침</a><a href="/call/terms/">이용약관</a><a href="mailto:admin@pagero.kr">문의</a></nav>
</main>
<script>
const $=(id)=>document.getElementById(id);const notice=$('notice');
function show(message,type='ok'){notice.textContent=message;notice.className=`notice show ${type}`}
function clear(){notice.className='notice';notice.textContent=''}
async function post(url,body,session=''){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(session?{'X-Inlet-Session':session}:{})},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false){const error=new Error(data.error||'요청을 처리하지 못했습니다.');error.code=data.details?.code||'';throw error}return data}
function authView(name){clear();$('loginForm').classList.toggle('hidden',name!=='login');$('signupForm').classList.toggle('hidden',name!=='signup');$('resetForm').classList.toggle('hidden',name!=='reset');$('tabLogin').classList.toggle('active',name==='login');$('tabSignup').classList.toggle('active',name==='signup')}
$('tabLogin').onclick=()=>authView('login');$('tabSignup').onclick=()=>authView('signup');$('openReset').onclick=()=>authView('reset');$('closeReset').onclick=()=>authView('login');
$('requestCode').onclick=async()=>{try{await post('/api/auth/email-verification',{email:$('signupEmail').value,purpose:'signup'});show('인증번호를 이메일로 보냈습니다. 30분 안에 입력해주세요.')}catch(e){show(e.message,'error')}};
$('requestResetCode').onclick=async()=>{try{await post('/api/auth/email-verification',{email:$('resetEmail').value,purpose:'password_reset'});show('비밀번호 변경용 인증번호를 이메일로 보냈습니다.')}catch(e){show(e.message,'error')}};
$('signupForm').onsubmit=async(e)=>{e.preventDefault();try{const data=await post('/api/call/register',{name:$('signupName').value,phone:$('signupPhone').value,email:$('signupEmail').value,token:$('signupCode').value,brandName:$('signupBrand').value,industry:$('signupIndustry').value,password:$('signupPassword').value});accept(data)}catch(err){show(err.message,'error')}};
$('loginForm').onsubmit=async(e)=>{e.preventDefault();try{const data=await post('/api/call/login',{email:$('loginEmail').value,password:$('loginPassword').value});accept(data)}catch(err){show(err.message,'error')}};
$('resetForm').onsubmit=async(e)=>{e.preventDefault();try{await post('/api/auth/password',{email:$('resetEmail').value,token:$('resetCode').value,password:$('resetPassword').value});show('비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.');setTimeout(()=>authView('login'),900)}catch(err){show(err.message,'error')}};
function accept(data){localStorage.setItem('calllink-session',data.session||'');$('authCard').style.display='none';$('accountCard').classList.add('show');const p=data.profile||data.user||{};$('profileText').textContent=`${p.name||''} · ${p.brandName||''} · ${p.email||''}`;const active=!!data.entitlement?.active;$('entitlementText').classList.toggle('active',active);$('entitlementText').textContent=active?'결제 확인 완료 · 앱 기능을 사용할 수 있습니다.':'회원가입 완료 · 페이지로 이용권 결제 확인 후 앱 기능이 활성화됩니다.';$('paymentLink').style.display=active?'none':'grid'}
$('logout').onclick=()=>{localStorage.removeItem('calllink-session');location.reload()};
(async()=>{const session=localStorage.getItem('calllink-session')||'';if(!session)return;try{const data=await post('/api/call/session',{session},session);accept(data)}catch{localStorage.removeItem('calllink-session')}})();
</script>
</body>
</html>
