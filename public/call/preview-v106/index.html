<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111214">
  <title>페이지로 콜링크 v1.0.7 미리보기</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111214;color:#fff;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.loading{padding:28px;text-align:center}.loading b{display:block;font-size:20px}.loading span{display:block;margin-top:10px;color:#a7abb2;font-size:13px}
  </style>
</head>
<body>
  <div class="loading"><b>페이지로 콜링크</b><span>미리보기를 불러오는 중입니다.</span></div>
  <script>
    (async () => {
      try {
        const response = await fetch('/call/preview/index.html?v=107', {cache: 'no-store'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        html = html
          .replace(/페이지로\s+(?!콜링크)[가-힣]{2,4}(?=입니다|`|'|"|\n)/g, '페이지로')
          .replace('</head>', '<link rel="stylesheet" href="/call/preview/v106.css?v=107"></head>')
          .replace('</body>', '<script src="/call/preview/v106.js?v=107"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="loading"><b>미리보기를 불러오지 못했습니다.</b><span>' + String(error.message || error) + '</span></div>';
      }
    })();
  </script>
</body>
</html>
