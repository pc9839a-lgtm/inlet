<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>페이지로 콜링크 이용권 활성화</title><style>body{margin:0;background:linear-gradient(145deg,#eef2ff,#f8fafc);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828}main{width:min(520px,calc(100% - 28px));margin:36px auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:24px;box-shadow:0 20px 55px rgba(16,24,40,.1)}h1{margin:0;font-size:26px}p{color:#667085;line-height:1.7;font-size:14px}.step{padding:14px 16px;border-radius:15px;background:#f8fafc;margin-top:10px;font-size:14px;line-height:1.6}.button{display:grid;place-items:center;min-height:52px;border-radius:14px;background:#3156d9;color:#fff;text-decoration:none;font-weight:900;margin-top:16px}.back{display:block;text-align:center;margin-top:14px;color:#667085;text-decoration:none;font-size:13px}</style></head><body><main><section class="card"><h1>콜링크 이용권 활성화</h1><p>회원가입만으로 계정은 만들 수 있지만, 통화 감지와 문자 발송 기능은 페이지로 결제 확인 후 활성화됩니다.</p><div class="step"><strong>1.</strong> 페이지로 이용권을 결제합니다.</div><div class="step"><strong>2.</strong> 결제 이메일 또는 휴대폰번호와 콜링크 회원정보가 일치하는지 확인합니다.</div><div class="step"><strong>3.</strong> 결제 확인이 완료되면 앱을 다시 열거나 로그인해 기능을 활성화합니다.</div><p>현재 초기 운영 단계에서는 결제 확인 후 관리자가 계정을 활성화합니다. 자동 결제 연동이 완료되면 결제 즉시 자동 활성화 방식으로 전환됩니다.</p><a class="button" href="https://open.kakao.com/o/sr5Qyjph">결제·활성화 문의</a><a class="back" href="/call/">계정 화면으로 돌아가기</a></section></main></body></html>
