<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>콜태그 통합 요금제 결제</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(720px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid #d8dde5;border-radius:12px;overflow:hidden}.head{padding:26px 28px;border-bottom:1px solid #e3e6ea}.head small{display:block;margin-bottom:7px;color:#6b7280;font-size:12px;font-weight:700}.head h1{margin:0;font-size:26px}.plans{display:grid}.plan{min-height:112px;padding:22px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px}.plan strong{display:block;font-size:18px}.plan span{display:block;margin-top:7px;color:#6b7280;font-size:13px}.price{text-align:right;font-size:19px;font-weight:900}.action{padding:24px 28px;border-top:1px solid #e3e6ea;background:#f7f8fa}.action p{margin:0 0 15px;color:#4b5563;font-size:13px;line-height:1.6}.button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:8px;background:#111827;color:#fff;text-decoration:none;font-size:14px;font-weight:850}.back{display:block;margin-top:15px;text-align:center;color:#6b7280;text-decoration:none;font-size:12px}@media(max-width:520px){main{margin:20px auto}.plan{grid-template-columns:1fr}.price{text-align:left}}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <header class="head"><small>콜태그</small><h1>통합 요금제 결제</h1></header>
      <div class="plans">
        <div class="plan"><div><strong>콜태그 통합</strong><span>통화 고객관리와 문자 자동화를 하나로 이용합니다.</span></div><div class="price">월 6,000원</div></div>
      </div>
      <div class="action">
        <p>페이지로와 같은 계정으로 이용하면 파트너 수익과 정산 금액은 동일한 계정 원장에 합산됩니다.</p>
        <a class="button" href="mailto:support@pagero.kr?subject=%EC%BD%9C%ED%83%9C%EA%B7%B8%20%ED%86%B5%ED%95%A9%20%EA%B2%B0%EC%A0%9C%20%EB%AC%B8%EC%9D%98">결제 문의</a>
        <a class="back" href="/">콜태그로 돌아가기</a>
      </div>
    </section>
  </main>
</body>
</html>
