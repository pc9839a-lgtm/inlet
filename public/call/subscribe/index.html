<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>콜태그 요금제 결제</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(760px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid #d8dde5;border-radius:12px;overflow:hidden}.head{padding:26px 28px;border-bottom:1px solid #e3e6ea}.head small{display:block;margin-bottom:7px;color:#6b7280;font-size:13px;font-weight:700}.head h1{margin:0;font-size:28px}.plans{display:grid}.plan{min-height:104px;padding:20px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;border-bottom:1px solid #eceef1}.plan:last-child{border-bottom:0}.plan strong{display:block;font-size:19px}.plan span{display:block;margin-top:7px;color:#6b7280;font-size:14px;line-height:1.45}.price{text-align:right;font-size:22px;font-weight:900;white-space:nowrap}.featured{background:#f8faff}.action{padding:24px 28px;border-top:1px solid #e3e6ea;background:#f7f8fa}.action p{margin:0 0 15px;color:#4b5563;font-size:14px;line-height:1.6}.button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:8px;background:#111827;color:#fff;text-decoration:none;font-size:14px;font-weight:850}.back{display:block;margin-top:15px;text-align:center;color:#6b7280;text-decoration:none;font-size:12px}@media(max-width:520px){main{margin:20px auto}.plan{grid-template-columns:1fr}.price{text-align:left}}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <header class="head"><small>콜태그</small><h1>요금제 결제</h1></header>
      <div class="plans">
        <div class="plan"><div><strong>전화관리</strong><span>통화 후 태그, 고객 상태, 재연락 일정과 상담 이력 관리</span></div><div class="price">월 1,900원</div></div>
        <div class="plan"><div><strong>문자자동화</strong><span>자동문자, 후속문자 예약, 중복발송 방지</span></div><div class="price">월 990원</div></div>
        <div class="plan featured"><div><strong>통합권</strong><span>페이지로 클래식 + 콜태그 전화관리 + 콜태그 문자자동화</span></div><div class="price">월 6,000원</div></div>
      </div>
      <div class="action">
        <p>통합권은 페이지로 클래식과 콜태그 전화·문자 기능을 한 번에 이용하는 상품입니다.</p>
        <a class="button" href="mailto:support@pagero.kr?subject=%EC%BD%9C%ED%83%9C%EA%B7%B8%20%EA%B2%B0%EC%A0%9C%20%EB%AC%B8%EC%9D%98">결제 문의</a>
        <a class="back" href="/">콜태그로 돌아가기</a>
      </div>
    </section>
  </main>
</body>
</html>
