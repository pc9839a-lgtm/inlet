function showScreen(name){Object.values(screens).forEach(v=>v.classList.remove('active'));screens[name].classList.add('active')}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1700)}
function setTab(tab){currentTab=tab;showScreen('app');$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#rootTitle').textContent=tab==='home'?'콜링크':tab==='messages'?'메시지':tab==='history'?'발송내역':'전체';$('#main').innerHTML=tab==='home'?homeHtml():tab==='messages'?messagesHtml():tab==='history'?historyHtml():moreHtml();$('#main').scrollTop=0;bindRoot()}
function homeHtml(){return `<p class="eyebrow">오늘의 콜링크</p><div class="hero"><h2>자동문자가 정상<br>작동 중이에요</h2><div class="toggle"></div></div><p class="line">● SKT 010-12**-56**</p><div class="card stats"><div class="stat"><b>12</b><small>발송 완료</small></div><div class="stat"><b>0</b><small>실패</small></div><div class="stat"><b>2</b><small>수동 대기</small></div></div><div class="section-title">빠른 메뉴</div><div class="quick"><button data-go="messages"><span>▤</span>메시지</button><button data-open="customers"><span>♙</span>고객</button><button data-open="bulk"><span>▦</span>단체문자</button></div><div class="section-title">최근 활동</div><div class="card list"><button class="row"><div class="grow"><strong>김민수 · 통화 완료 문자</strong><span class="sub">방금 전 · 발송 완료</span></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row"><div class="grow"><strong>박지현 · 부재중 문자</strong><span class="sub">오늘 18:21 · 발송 완료</span></div><span class="badge">완료</span><span class="chev">›</span></button></div>`}
function messagesHtml(){const d=messages[messageTab];return `<button class="template-open" id="openTemplates">상황별 기본문구 불러오기  ›</button><div class="tabs"><button class="tab ${messageTab==='answered'?'active':''}" data-message="answered">받은 전화</button><button class="tab ${messageTab==='missed'?'active':''}" data-message="missed">부재중·거절</button><button class="tab ${messageTab==='outgoing'?'active':''}" data-message="outgoing">내가 건 전화</button></div><div class="editor-title">${d.title}</div><div class="card editor"><div class="switch-row"><span>${d.switchText}</span><div class="small-toggle"></div></div><div class="field"><label>문자 내용</label><textarea class="input" id="messageText">${d.text}</textarea></div><div class="field"><label>연결할 페이지 주소</label><input class="input" value="https://pagero.kr/demo"></div><div class="card preview"><b>${d.title} 미리보기</b>\n\n<span id="messagePreview">${d.text}</span>\n\nhttps://pagero.kr/demo</div><button class="primary save" id="saveMessage">현재 메시지 저장</button></div><p class="hint">기본문구 적용 전 기존 문구는 저장된 템플릿 보관함에 자동 백업됩니다.</p>`}
function historyHtml(){return `<div class="section-title" style="margin-top:0">오늘 발송 기록 12건</div><div class="card list"><button class="row" data-open="history"><div class="grow"><strong>김민수 · 통화 완료</strong><span class="sub">오늘 19:42 · 자동 발송</span></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row" data-open="history"><div class="grow"><strong>박지현 · 부재중</strong><span class="sub">오늘 18:21 · 자동 발송</span></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row"><div class="grow"><strong>이서준 · 발신 통화</strong><span class="sub">오늘 17:42 · 수동 확인 대기</span></div><span class="chev">›</span></button></div>`}
function moreHtml(){return `<div class="card profile"><div class="avatar">김</div><div class="grow"><strong>페이지로 콜링크</strong><span class="sub">계정·기기·발송 기능 관리</span></div><span class="chev">›</span></div><div class="menu-label">고객 관리</div><div class="card list"><button class="row" data-open="customers"><div class="grow"><strong>고객 목록</strong></div><span class="chev">›</span></button><button class="row"><div class="grow"><strong>고객 그룹</strong></div><span class="chev">›</span></button><button class="row"><div class="grow"><strong>발송 제외번호</strong></div><span class="chev">›</span></button></div><div class="menu-label">발송 서비스</div><div class="card list"><button class="row" data-open="bulk"><div class="grow"><strong>단체문자 보내기</strong></div><span class="chev">›</span></button><button class="row" data-go="history"><div class="grow"><strong>전체 발송 기록</strong></div><span class="chev">›</span></button><button class="row" data-go="messages"><div class="grow"><strong>메시지 설정</strong></div><span class="chev">›</span></button></div><div class="menu-label">앱 설정</div><div class="card list"><button class="row"><div class="grow"><strong>자동문자·업무시간·중복방지</strong></div><span class="chev">›</span></button><button class="row"><div class="grow"><strong>전화·통화기록·문자 권한</strong></div><span class="badge">정상</span><span class="chev">›</span></button></div>`}
function bindRoot(){$$('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));$$('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));$$('[data-message]').forEach(b=>b.onclick=()=>{messageTab=b.dataset.message;setTab('messages')});if($('#openTemplates'))$('#openTemplates').onclick=openSituationList;if($('#messageText'))$('#messageText').oninput=e=>$('#messagePreview').textContent=e.target.value;if($('#saveMessage'))$('#saveMessage').onclick=()=>toast('현재 메시지를 저장했습니다.')}
function openSituationList(){openModal('상황별 기본문구',situationTemplates.map((s,i)=>`<button class="card situation" data-situation="${i}"><strong>${s.title}</strong><small>${s.desc}</small></button>`).join(''),'');$$('[data-situation]').forEach(b=>b.onclick=()=>openSituationPreview(Number(b.dataset.situation)))}
function openSituationPreview(index){const s=situationTemplates[index];$('#sheetTitle').textContent=s.title;$('#sheetBody').innerHTML=`<button class="back-link" id="backSituations">‹ 상황 다시 선택</button><p class="hint" style="margin:0 0 12px">${s.desc}</p>${templatePreviewBlock('answered','받은 전화 후 문구 적용',s.answered)}${templatePreviewBlock('missed','부재중·거절 문구 적용',s.missed)}${templatePreviewBlock('outgoing','내가 건 전화 후 문구 적용',s.outgoing)}<p class="hint">적용 전 현재 문구는 저장된 템플릿 보관함에 자동 백업됩니다.</p>`;$('#sheetActions').innerHTML=`<button class="primary" id="applyTemplates">선택한 문구 적용</button>`;$('#backSituations').onclick=openSituationList;$('#applyTemplates').onclick=()=>{const selected=['answered','missed','outgoing'].filter(k=>$(`#check-${k}`).checked);if(!selected.length){toast('적용할 문구를 하나 이상 선택해주세요.');return}selected.forEach(k=>messages[k].text=s[k]);closeModal();setTab('messages');toast(`${s.title} 문구를 적용했습니다.`)}}
function templatePreviewBlock(key,label,text){return `<label class="checkline"><input type="checkbox" id="check-${key}" checked>${label}</label><div class="card template-card">${text}</div>`}
function openModal(title,body,actions){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#sheetActions').innerHTML=actions;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function openDetail(type){showScreen('detail');$('#detailAction').textContent='';$('#detailBottom').innerHTML='';if(type==='customers'){renderCustomers();return}if(type==='customerAdd'){renderCustomerAdd();return}$('#detailTitle').textContent=type==='bulk'?'단체문자':'발송 상세';$('#detailBody').innerHTML=type==='bulk'?`<div class="field" style="margin-top:0"><label>받는 고객</label><div class="card row"><div class="grow"><strong>신규 문의 그룹</strong><span class="sub">24명 선택됨</span></div><span class="chev">›</span></div></div><div class="field"><label>문자 내용</label><textarea class="input">안녕하세요. 요청하신 안내 내용을 보내드립니다.</textarea></div><button class="primary save">24명에게 발송</button>`:`<div class="card preview"><b>김민수 · 통화 완료 문자</b>\n\n오늘 19:42 · 자동 발송 완료\n\n안녕하세요. 오늘 상담드린 내용을 다시 안내드립니다.</div>`}
function renderCustomers(){$('#detailTitle').textContent='고객';$('#detailAction').textContent='＋';$('#detailAction').onclick=()=>openDetail('customerAdd');const visible=customers.filter(c=>customerFilter==='all'||(customerFilter==='send'&&c.status==='발송 가능')||(customerFilter==='block'&&c.status==='수신거부'));$('#detailBody').innerHTML=`<input class="input search" placeholder="이름 또는 전화번호 검색"><div class="filters"><button class="filter ${customerFilter==='all'?'active':''}" data-filter="all">전체</button><button class="filter ${customerFilter==='send'?'active':''}" data-filter="send">발송 가능</button><button class="filter ${customerFilter==='block'?'active':''}" data-filter="block">수신거부</button></div><div class="menu-label">전체 고객 ${visible.length}명</div><div class="card list">${visible.map(c=>`<button class="row customer"><div class="grow"><div class="customer-name">${c.name}</div><div class="phone-no">${c.phone}</div><div class="customer-note">${c.memo}</div></div><span class="badge">${c.status}</span><span class="chev">›</span></button>`).join('')}</div>`;$$('[data-filter]').forEach(b=>b.onclick=()=>{customerFilter=b.dataset.filter;renderCustomers()})}
function renderCustomerAdd(){$('#detailTitle').textContent='고객 추가';$('#detailAction').textContent='';$('#detailBody').innerHTML=`<div class="field" style="margin-top:0"><label>고객명</label><input class="input" id="newName" placeholder="이름 입력"></div><div class="field"><label>전화번호</label><input class="input" id="newPhone" placeholder="010-0000-0000"></div><div class="field"><label>고객 그룹</label><select class="input"><option>신규 문의</option><option>기존 고객</option><option>VIP</option></select></div><div class="field"><label>메모</label><textarea class="input" style="height:110px"></textarea></div>`;$('#detailBottom').innerHTML=`<div class="bottom-action"><button class="secondary" id="cancelAdd">취소</button><button class="primary" id="saveAdd">저장</button></div>`;$('#cancelAdd').onclick=renderCustomers;$('#saveAdd').onclick=()=>{customers.unshift({name:$('#newName').value||'새 고객',phone:$('#newPhone').value||'010-0000-0000',memo:'신규 문의',status:'발송 가능'});toast('고객을 추가했습니다.');renderCustomers()}}
$('#loginBtn').onclick=()=>setTab('home');$$('.nav').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#back').onclick=()=>setTab(currentTab);$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
</script>
