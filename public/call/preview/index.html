<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111214">
  <title>페이지로 콜링크 UI 미리보기</title>
  <style>
    :root{color-scheme:dark;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#111214;--surface:#1d1f22;--surface2:#25282c;--line:#34373c;--text:#f5f6f7;--sub:#a7abb2;--muted:#747982;--blue:#4389ff;--danger:#ff858d;--safe:max(12px,env(safe-area-inset-bottom))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#08090a;color:var(--text)}body{display:grid;place-items:center;padding:16px}button,input,textarea,select{font:inherit}button{border:0;color:inherit;cursor:pointer}h1,h2,h3,p{margin:0}.phone{position:relative;width:min(420px,100%);height:min(880px,calc(100dvh - 32px));min-height:640px;background:var(--bg);overflow:hidden;border:1px solid #292c31;border-radius:34px;box-shadow:0 30px 90px rgba(0,0,0,.48)}.screen{position:absolute;inset:0;display:none;background:var(--bg)}.screen.active{display:flex;flex-direction:column}.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 20px 106px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.preview-chip{position:absolute;z-index:80;right:14px;top:14px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.62);font-size:10px;color:#d8dadd;pointer-events:none;white-space:nowrap}.preview-chip.hidden{display:none}.appbar{height:66px;flex:none;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;padding:0 8px;border-bottom:1px solid rgba(52,55,60,.72);background:rgba(17,18,20,.98)}.appbar.root{grid-template-columns:minmax(0,1fr) auto;padding:0 20px}.appbar-title{font-size:22px;font-weight:850;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-btn{width:48px;height:48px;background:transparent;display:grid;place-items:center;border-radius:12px;font-size:28px}.icon-btn svg,.nav-btn svg,.search svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.icon-btn svg{width:27px;height:27px}.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:15px}.primary,.secondary{height:54px;border-radius:11px;font-weight:850}.primary{background:var(--blue);color:#fff}.secondary{background:var(--surface2);color:var(--text)}.input{width:100%;height:54px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);padding:0 15px;color:var(--text);outline:none}.input:focus{border-color:var(--blue)}textarea.input{height:128px;padding-top:14px;resize:none}.eyebrow{margin-bottom:8px;color:var(--sub);font-size:13px}.desc{margin-top:10px;color:var(--sub);font-size:14px;line-height:1.55}.section-label{margin:28px 0 12px;font-size:18px;font-weight:850}.chev{margin-left:auto;color:var(--muted);font-size:24px}.badge,.pill{height:25px;padding:0 8px;border-radius:7px;background:rgba(67,137,255,.15);color:#82b1ff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;white-space:nowrap}.muted-pill{background:#2a2d31;color:#adb1b7}.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:82px;padding-bottom:var(--safe);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(24,25,28,.99);border-top:1px solid var(--line);z-index:20}.nav-btn{background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding-top:9px}.nav-btn.active{color:var(--text)}.nav-btn svg{display:block;width:28px;height:28px;margin:0 auto 4px}.row{width:100%;min-height:68px;padding:0 16px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left}.row+.row{border-top:1px solid var(--line)}.row-main{flex:1;min-width:0}.row-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{margin-top:5px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-card{overflow:hidden}
    .login{padding:20px 22px 34px;overflow:auto}.login-wrap{margin:auto 0;width:100%}.login-brand{display:grid;justify-items:center;text-align:center}.brand{width:74px;height:74px;border-radius:22px;background:var(--blue);display:grid;place-items:center;font-size:38px;font-weight:900;margin-bottom:24px}.login-brand h1{font-size:31px;letter-spacing:-.045em}.login-brand p{margin-top:12px;color:var(--sub);font-size:14px;font-weight:700}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:32px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px}.auth-tab{height:58px;border-radius:16px;background:transparent;color:var(--blue);font-weight:850;font-size:16px}.auth-tab.active{background:var(--blue);color:#fff}.login-card{margin-top:14px;padding:20px 18px 22px}.login-form{display:grid;gap:12px}.forgot{margin-top:16px;width:100%;height:44px;background:transparent;color:var(--blue);font-weight:800}.login-note{margin-top:14px;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}
    .hero{display:flex;gap:14px;align-items:flex-start}.hero h1{flex:1;font-size:28px;line-height:1.25;letter-spacing:-.04em}.toggle{width:50px;height:30px;border-radius:18px;background:var(--blue);position:relative;flex:none}.toggle:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;right:3px;top:3px}.line-link{margin-top:14px;background:transparent;color:var(--sub);padding:0;display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;padding:18px 0}.stat{text-align:center}.stat+.stat{border-left:1px solid var(--line)}.stat b{display:block;font-size:23px;margin-bottom:6px}.stat span{font-size:12px;color:var(--sub)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{height:82px;background:var(--surface);border:1px solid var(--line);border-radius:13px;font-weight:750;line-height:1.6}.quick-icon{display:block;font-size:21px;color:var(--blue)}
    .tabs,.filters,.mode-tabs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tab,.filter,.mode-tab{height:44px;border-radius:10px;background:var(--surface2);color:var(--sub);font-size:13px;font-weight:800;white-space:nowrap}.tab.active,.filter.active,.mode-tab.active{background:var(--blue);color:#fff}.editor-title{margin:24px 0 12px;font-size:18px;font-weight:850}.editor-card{padding:16px}.switch-row{height:50px;display:flex;align-items:center;gap:12px}.switch-row span{flex:1;font-size:15px;font-weight:800}.small-toggle{width:44px;height:26px;border-radius:14px;background:var(--blue);position:relative}.small-toggle:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}.mode-tabs{grid-template-columns:1fr 1fr;margin-top:12px}.field{margin-top:14px}.field label{display:block;margin-bottom:8px;color:var(--sub);font-size:13px;font-weight:800}.preview-box{margin-top:14px;padding:16px;min-height:110px;line-height:1.65;color:var(--sub);font-size:13px}.save-btn{width:100%;margin-top:12px}.hint{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}
    .search{position:relative}.search svg{position:absolute;left:15px;top:16px;width:21px;height:21px;color:var(--muted)}.search input{padding-left:46px}.filters{margin-top:10px}.count{margin:16px 0 9px;color:var(--sub);font-size:13px;font-weight:800}.customer-list{overflow:hidden}.customer{width:100%;min-height:86px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left}.customer+.customer{border-top:1px solid var(--line)}.customer-main{flex:1;min-width:0}.customer-head{display:flex;align-items:center;gap:8px}.customer-name{flex:1;font-size:16px;font-weight:850}.phone-no{margin-top:4px;color:var(--sub);font-size:14px}.customer-note{margin-top:6px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-form{display:grid;gap:16px}.detail-form .field{margin-top:0}.bottom-action{height:82px;flex:none;padding:12px 20px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2fr;gap:10px;background:var(--surface);border-top:1px solid var(--line)}.bottom-action button{height:54px}.menu-label{margin:27px 0 10px;color:var(--sub);font-size:13px;font-weight:800}.profile{padding:17px 16px;display:flex;align-items:center;gap:13px}.avatar{width:42px;height:42px;border-radius:13px;background:var(--blue);display:grid;place-items:center;font-weight:900}.status-line{display:flex;align-items:center;gap:10px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.toast{position:absolute;left:20px;right:20px;bottom:98px;z-index:70;padding:14px 16px;border-radius:13px;background:#25282c;border:1px solid var(--line);text-align:center;font-size:13px;font-weight:750;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:540px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;min-height:620px;border:0;border-radius:0;box-shadow:none}.preview-chip{top:10px;right:10px}}
  </style>
</head>
<body>
<div class="phone">
  <div class="preview-chip" id="previewChip">UI 미리보기 · 실제 기능 없음</div>
  <div class="toast" id="toast"></div>

  <section class="screen login active" id="loginScreen">
    <div class="login-wrap">
      <div class="login-brand"><div class="brand">P</div><h1>페이지로 콜링크</h1><p>통화가 끝난 뒤 고객 안내문자를 놓치지 마세요</p></div>
      <div class="auth-tabs"><button class="auth-tab active">로그인</button><button class="auth-tab">회원가입</button></div>
      <div class="card login-card">
        <div class="login-form">
          <input class="input" value="demo@pagero.kr" aria-label="이메일">
          <input class="input" type="password" value="12345678" aria-label="비밀번호">
          <button class="primary" id="demoLogin">미리보기 로그인</button>
        </div>
        <button class="forgot">비밀번호를 잊으셨나요?</button>
      </div>
      <p class="login-note">입력한 내용은 전송되지 않습니다. 화면 확인 전용입니다.</p>
    </div>
  </section>

  <section class="screen" id="appScreen">
    <header class="appbar root" id="rootHeader"><div class="appbar-title">콜링크</div></header>
    <main class="scroll" id="mainScroll"></main>
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9h-6v-7H9v7H3Z"/></svg>홈</button>
      <button class="nav-btn" data-tab="messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4Z"/><path d="M8 9h8M8 12h6"/></svg>메시지</button>
      <button class="nav-btn" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>발송내역</button>
      <button class="nav-btn" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>전체</button>
    </nav>
  </section>

  <section class="screen" id="detailScreen">
    <header class="appbar"><button class="icon-btn" id="detailBack"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="appbar-title" id="detailTitle">상세</div><button class="icon-btn" id="detailAction"></button></header>
    <main class="scroll" id="detailContent" style="padding-bottom:30px"></main><div id="detailBottom"></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const screens={login:$('#loginScreen'),app:$('#appScreen'),detail:$('#detailScreen')};
let activeTab='home',lastTab='home',messageTab='answered',customerFilter='all';
const customers=[
{name:'김민수',phone:'010-1234-5678',group:'신규 문의',memo:'오늘 오후 재통화 예정',status:'발송 가능'},
{name:'박지현',phone:'010-8821-3490',group:'기존 고객',memo:'크루즈 상품 상담',status:'발송 가능'},
{name:'이서준',phone:'010-4402-1187',group:'VIP',memo:'견적서 전달 완료',status:'발송 가능'},
{name:'최유진',phone:'010-9301-6624',group:'미지정',memo:'수신거부 요청',status:'수신거부'},
{name:'정하늘',phone:'010-7281-0049',group:'신규 문의',memo:'예약 일정 확인 필요',status:'발송 가능'}
];
const messageData={
answered:{title:'통화 완료 메시지',switchText:'통화 완료 후 발송',text:'안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.',badge:'자동 발송'},
missed:{title:'부재중·거절 메시지',switchText:'부재중·거절 후 발송',text:'전화를 받지 못했습니다. 확인 후 다시 연락드리겠습니다.',badge:'자동 발송'},
outgoing:{title:'발신 통화 메시지',switchText:'발신 통화 후 발송',text:'방금 전화드린 페이지로입니다. 상담 내용은 아래 링크에서 확인해주세요.',badge:'수동 확인'}
};
function show(name){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[name].classList.add('active')}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
function setTab(tab){activeTab=lastTab=tab;show('app');$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const h=$('#rootHeader'),m=$('#mainScroll');h.innerHTML=`<div class="appbar-title">${tab==='home'?'콜링크':tab==='messages'?'메시지':tab==='history'?'발송내역':'전체'}</div>`;m.innerHTML=tab==='home'?homeHtml():tab==='messages'?messagesHtml():tab==='history'?historyHtml():moreHtml();m.scrollTop=0;bindRoot(tab)}
function homeHtml(){return `<p class="eyebrow">오늘의 콜링크</p><div class="hero"><h1>자동문자가 정상<br>작동 중이에요</h1><div class="toggle"></div></div><button class="line-link"><span class="dot"></span><b>SKT</b> 010-12**-56** <span class="chev">›</span></button><div class="card stats"><div class="stat"><b>12</b><span>발송 완료</span></div><div class="stat"><b>0</b><span>실패</span></div><div class="stat"><b>2</b><span>수동 대기</span></div></div><div class="section-label">빠른 메뉴</div><div class="quick"><button data-tabgo="messages"><span class="quick-icon">▤</span>메시지</button><button data-open="customers"><span class="quick-icon">♙</span>고객</button><button data-open="bulk"><span class="quick-icon">▦</span>단체문자</button></div><div class="section-label">최근 활동</div><div class="card list-card"><button class="row"><div class="row-main"><div class="row-title">김민수 · 통화 완료 문자</div><div class="row-sub">방금 전 · 발송 완료</div></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">박지현 · 부재중 문자</div><div class="row-sub">오늘 18:21 · 발송 완료</div></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">이서준 · 발신 통화 문자</div><div class="row-sub">오늘 17:42 · 수동 확인 대기</div></div><span class="pill muted-pill">대기</span><span class="chev">›</span></button></div>`}
function messagesHtml(){const d=messageData[messageTab];return `<div class="tabs"><button class="tab ${messageTab==='answered'?'active':''}" data-message="answered">받은 전화</button><button class="tab ${messageTab==='missed'?'active':''}" data-message="missed">부재중·거절</button><button class="tab ${messageTab==='outgoing'?'active':''}" data-message="outgoing">내가 건 전화</button></div><div class="editor-title">${d.title}</div><div class="card editor-card"><div class="switch-row"><span>${d.switchText}</span><div class="small-toggle"></div></div>${messageTab==='outgoing'?`<div class="mode-tabs"><button class="mode-tab">자동 발송</button><button class="mode-tab active">수동 확인</button></div>`:''}<div class="field"><label>문자 내용</label><textarea class="input" id="messageText">${d.text}</textarea></div><div class="field"><label>연결할 페이지 주소</label><input class="input" value="https://pagero.kr/demo"></div><div class="card preview-box"><b>${d.title} 미리보기</b><br><br><span id="messagePreview">${d.text}</span><br><br>https://pagero.kr/demo</div><button class="primary save-btn" id="saveMessage">현재 메시지 저장</button></div><p class="hint">미리보기에서는 화면만 변경되며 실제 문자 설정은 저장되지 않습니다.</p>`}
function historyHtml(){return `<div class="status-line"><span class="status-dot"></span><b>오늘 발송 기록</b></div><div class="section-label" style="margin-top:18px">전체 12건</div><div class="card list-card"><button class="row" data-open="historyDetail"><div class="row-main"><div class="row-title">김민수 · 통화 완료</div><div class="row-sub">오늘 19:42 · 자동 발송</div></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row" data-open="historyDetail"><div class="row-main"><div class="row-title">박지현 · 부재중</div><div class="row-sub">오늘 18:21 · 자동 발송</div></div><span class="badge">완료</span><span class="chev">›</span></button><button class="row" data-open="historyDetail"><div class="row-main"><div class="row-title">이서준 · 발신 통화</div><div class="row-sub">오늘 17:42 · 수동 확인</div></div><span class="pill muted-pill">대기</span><span class="chev">›</span></button><button class="row" data-open="historyDetail"><div class="row-main"><div class="row-title">정하늘 · 통화 완료</div><div class="row-sub">오늘 16:05 · 자동 발송</div></div><span class="badge">완료</span><span class="chev">›</span></button></div>`}
function moreHtml(){return `<div class="card profile"><div class="avatar">김</div><div class="row-main"><div class="row-title">페이지로 콜링크</div><div class="row-sub">계정·기기·발송 기능 관리</div></div><span class="chev">›</span></div><div class="menu-label">고객 관리</div><div class="card list-card"><button class="row" data-open="customers"><div class="row-main"><div class="row-title">고객 목록</div></div><span class="chev">›</span></button><button class="row" data-open="groups"><div class="row-main"><div class="row-title">고객 그룹</div></div><span class="chev">›</span></button><button class="row" data-open="exclusions"><div class="row-main"><div class="row-title">발송 제외번호</div></div><span class="chev">›</span></button></div><div class="menu-label">발송 서비스</div><div class="card list-card"><button class="row" data-open="bulk"><div class="row-main"><div class="row-title">단체문자 보내기</div></div><span class="chev">›</span></button><button class="row" data-tabgo="history"><div class="row-main"><div class="row-title">전체 발송 기록</div></div><span class="chev">›</span></button><button class="row" data-tabgo="messages"><div class="row-main"><div class="row-title">저장된 템플릿</div></div><span class="chev">›</span></button></div><div class="menu-label">앱 설정</div><div class="card list-card"><button class="row" data-open="settings"><div class="row-main"><div class="row-title">자동문자·업무시간·중복방지</div></div><span class="chev">›</span></button><button class="row" data-open="permissions"><div class="row-main"><div class="row-title">전화·통화기록·문자 권한</div></div><span class="badge">정상</span><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">로그아웃</div></div><span class="chev">›</span></button></div>`}
function bindRoot(tab){$$('[data-tabgo]').forEach(b=>b.onclick=()=>setTab(b.dataset.tabgo));$$('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));if(tab==='messages'){$$('[data-message]').forEach(b=>b.onclick=()=>{messageTab=b.dataset.message;setTab('messages')});const text=$('#messageText'),preview=$('#messagePreview');if(text&&preview)text.oninput=()=>preview.textContent=text.value;const save=$('#saveMessage');if(save)save.onclick=()=>toast('미리보기에서 저장한 화면입니다.')}}
function customerRows(){const visible=customers.filter(c=>customerFilter==='all'||(customerFilter==='send'&&c.status==='발송 가능')||(customerFilter==='block'&&c.status==='수신거부'));return visible.map((c,i)=>`<button class="customer" data-customer="${customers.indexOf(c)}"><div class="customer-main"><div class="customer-head"><div class="customer-name">${c.name}</div><span class="pill ${c.status==='수신거부'?'muted-pill':''}">${c.status}</span></div><div class="phone-no">${c.phone}</div><div class="customer-note">${c.group} · ${c.memo}</div></div><span class="chev">›</span></button>`).join('')}
function openDetail(type,index=-1){show('detail');const title=$('#detailTitle'),content=$('#detailContent'),action=$('#detailAction'),bottom=$('#detailBottom');action.innerHTML='';action.onclick=null;bottom.innerHTML='';content.scrollTop=0;if(type==='customers'){title.textContent='고객';action.textContent='＋';action.onclick=()=>openDetail('customerEdit',-1);content.innerHTML=`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" placeholder="이름 또는 전화번호 검색"></div><div class="filters"><button class="filter ${customerFilter==='all'?'active':''}" data-filter="all">전체</button><button class="filter ${customerFilter==='send'?'active':''}" data-filter="send">발송 가능</button><button class="filter ${customerFilter==='block'?'active':''}" data-filter="block">수신거부</button></div><div class="count">전체 고객 ${customers.length}명</div><div class="card customer-list">${customerRows()}</div>`;$$('[data-filter]').forEach(b=>b.onclick=()=>{customerFilter=b.dataset.filter;openDetail('customers')});$$('[data-customer]').forEach(b=>b.onclick=()=>openDetail('customerEdit',Number(b.dataset.customer)));return}if(type==='customerEdit'){const edit=index>=0,c=edit?customers[index]:{name:'',phone:'',group:'미지정',memo:'',status:'발송 가능'};title.textContent=edit?'고객 정보':'고객 추가';content.innerHTML=`<div class="detail-form"><div class="field"><label>고객명</label><input class="input" id="customerName" value="${c.name}" placeholder="이름 입력"></div><div class="field"><label>전화번호</label><input class="input" id="customerPhone" value="${c.phone}" placeholder="010-0000-0000"></div><div class="field"><label>고객 그룹</label><select class="input" id="customerGroup"><option>${c.group}</option><option>신규 문의</option><option>기존 고객</option><option>VIP</option><option>미지정</option></select></div><div class="field"><label>메모</label><textarea class="input" id="customerMemo" placeholder="고객 메모">${c.memo}</textarea></div><div class="card switch-row"><span>문자 발송 가능</span><div class="small-toggle"></div></div></div>`;bottom.innerHTML=`<div class="bottom-action"><button class="secondary" id="deleteCustomer">${edit?'삭제':'취소'}</button><button class="primary" id="saveCustomer">저장</button></div>`;$('#deleteCustomer').onclick=()=>openDetail('customers');$('#saveCustomer').onclick=()=>{const name=$('#customerName').value.trim()||'새 고객',phone=$('#customerPhone').value.trim()||'010-0000-0000',group=$('#customerGroup').value,memo=$('#customerMemo').value.trim();if(edit)customers[index]={...customers[index],name,phone,group,memo};else customers.unshift({name,phone,group,memo,status:'발송 가능'});toast('고객 정보를 저장했습니다.');openDetail('customers')};return}if(type==='historyDetail'){title.textContent='발송 상세';content.innerHTML=`<div class="card" style="padding:18px"><div class="row-title">김민수 · 통화 완료 문자</div><div class="row-sub">오늘 19:42 · 자동 발송 완료</div></div><div class="menu-label">발송 정보</div><div class="card list-card"><div class="row"><div class="row-main"><div class="row-title">전화번호</div><div class="row-sub">010-1234-5678</div></div></div><div class="row"><div class="row-main"><div class="row-title">발송 회선</div><div class="row-sub">SKT 010-12**-56**</div></div></div><div class="row"><div class="row-main"><div class="row-title">발송 유형</div><div class="row-sub">SMS · 자동 발송</div></div></div></div><div class="menu-label">실제 발송 문구</div><div class="card preview-box">안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.<br><br>https://pagero.kr/demo</div>`;return}const titles={bulk:'단체문자',groups:'고객 그룹',exclusions:'발송 제외번호',settings:'자동문자 설정',permissions:'권한 확인'};title.textContent=titles[type]||'상세';content.innerHTML=placeholderHtml(type)}
function placeholderHtml(type){if(type==='bulk')return `<div class="field" style="margin-top:0"><label>받는 고객</label><div class="card row"><div class="row-main"><div class="row-title">신규 문의 그룹</div><div class="row-sub">24명 선택됨</div></div><span class="chev">›</span></div></div><div class="field"><label>문자 내용</label><textarea class="input">안녕하세요. 요청하신 안내 내용을 보내드립니다.</textarea></div><button class="primary save-btn" onclick="toast('미리보기 발송 화면입니다.')">24명에게 발송</button>`;if(type==='permissions')return `<div class="card list-card"><div class="row"><div class="row-main"><div class="row-title">전화 상태</div><div class="row-sub">통화 시작·종료 확인</div></div><span class="badge">허용됨</span></div><div class="row"><div class="row-main"><div class="row-title">통화기록</div><div class="row-sub">수신·발신·부재중 구분</div></div><span class="badge">허용됨</span></div><div class="row"><div class="row-main"><div class="row-title">문자 발송</div><div class="row-sub">설정한 안내문자 전송</div></div><span class="badge">허용됨</span></div><div class="row"><div class="row-main"><div class="row-title">배터리 제한</div><div class="row-sub">백그라운드 동작 유지</div></div><span class="badge">해제됨</span></div></div>`;return `<div class="card list-card"><div class="row"><div class="row-main"><div class="row-title">${type==='groups'?'신규 문의':'설정 항목 1'}</div><div class="row-sub">미리보기용 화면입니다.</div></div><span class="chev">›</span></div><div class="row"><div class="row-main"><div class="row-title">${type==='exclusions'?'010-9301-6624':'설정 항목 2'}</div><div class="row-sub">실제 데이터는 변경되지 않습니다.</div></div><span class="chev">›</span></div></div>`}
$('#demoLogin').onclick=()=>{$('#previewChip').classList.add('hidden');setTab('home')};$$('.auth-tab').forEach((b,i)=>b.onclick=()=>{$$('.auth-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(i===0?'로그인 화면':'회원가입 화면은 실제 앱에서 확인할 수 있습니다.')});$$('.nav-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#detailBack').onclick=()=>setTab(lastTab);setTab('home');show('login');
</script>
