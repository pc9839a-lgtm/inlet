<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111214">
  <title>페이지로 콜링크 UI 미리보기</title>
  <style>
    :root{color-scheme:dark;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#111214;--surface:#1d1f22;--surface2:#25282c;--line:#34373c;--text:#f5f6f7;--sub:#a7abb2;--muted:#747982;--blue:#4389ff;--safe:max(14px,env(safe-area-inset-bottom))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#08090a;color:var(--text)}body{display:grid;place-items:center;padding:16px}button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.phone{position:relative;width:min(420px,100%);height:min(880px,calc(100dvh - 32px));min-height:640px;background:var(--bg);overflow:hidden;border:1px solid #292c31;border-radius:34px;box-shadow:0 30px 90px rgba(0,0,0,.48)}.screen{position:absolute;inset:0;display:none;background:var(--bg)}.screen.active{display:flex;flex-direction:column}.preview-chip{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.66);font-size:11px;color:#d8dadd;pointer-events:none;white-space:nowrap}.preview-chip.hidden{display:none}.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 20px 106px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.login{padding:42px 24px;justify-content:center}.brand{width:52px;height:52px;border-radius:15px;background:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:900;margin-bottom:22px}.eyebrow{margin:0 0 8px;color:var(--sub);font-size:13px}h1,h2,h3,p{margin:0}h1{font-size:29px;line-height:1.24;letter-spacing:-.04em}.desc{margin-top:10px;color:var(--sub);font-size:14px;line-height:1.55}.login-form{margin-top:30px;display:grid;gap:12px}.input{width:100%;height:54px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);padding:0 15px;color:var(--text);outline:none}.input:focus{border-color:var(--blue)}textarea.input{height:112px;padding-top:14px;resize:none}.primary,.secondary{height:54px;border-radius:11px;font-weight:800}.primary{background:var(--blue)}.secondary{background:var(--surface2)}.login-note{margin-top:15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}.appbar{height:66px;flex:none;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;padding:0 8px;border-bottom:1px solid rgba(52,55,60,.7);background:rgba(17,18,20,.98)}.appbar.root{grid-template-columns:minmax(0,1fr) auto;padding:0 20px}.appbar-title{font-size:22px;font-weight:850;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-btn{width:48px;height:48px;background:transparent;display:grid;place-items:center;border-radius:12px}.icon-btn svg,.nav-btn svg,.search svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.icon-btn svg{width:27px;height:27px}.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:15px}.section-label{margin:28px 0 12px;font-size:18px;font-weight:850}.hero{display:flex;gap:14px;align-items:flex-start}.hero h1{flex:1;font-size:28px}.toggle{width:50px;height:30px;border-radius:18px;background:var(--blue);position:relative;flex:none}.toggle:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:white;right:3px;top:3px}.line-link{margin-top:14px;background:transparent;color:var(--sub);padding:0;display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.chev{margin-left:auto;color:var(--muted);font-size:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;padding:18px 0}.stat{text-align:center}.stat+.stat{border-left:1px solid var(--line)}.stat b{display:block;font-size:23px;margin-bottom:6px}.stat span{font-size:12px;color:var(--sub)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{height:82px;background:transparent;border-radius:12px;font-weight:750}.list-card{overflow:hidden}.row{width:100%;min-height:68px;padding:0 16px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left}.row+.row{border-top:1px solid var(--line)}.row-main{flex:1;min-width:0}.row-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{margin-top:5px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:82px;padding-bottom:var(--safe);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(24,25,28,.99);border-top:1px solid var(--line);z-index:20}.nav-btn{background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding-top:9px}.nav-btn.active{color:var(--text)}.nav-btn svg{display:block;width:28px;height:28px;margin:0 auto 4px}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tab,.filter{height:44px;border-radius:10px;background:var(--surface2);color:var(--sub);font-size:13px;font-weight:800;white-space:nowrap}.tab.active,.filter.active{background:var(--blue);color:white}.message-card{display:block;width:100%;margin:0;padding:17px 16px;text-align:left}.message-card+.message-card{margin-top:10px}.message-top{display:flex;align-items:center;gap:10px}.message-top h3{flex:1;font-size:16px;text-align:left}.badge{padding:5px 8px;border-radius:7px;background:rgba(67,137,255,.15);color:#82b1ff;font-size:11px;font-weight:800;white-space:nowrap}.message-preview{margin-top:13px;color:var(--sub);font-size:13px;line-height:1.6}.search{position:relative}.search svg{position:absolute;left:15px;top:16px;width:21px;height:21px;color:var(--muted)}.search input{padding-left:46px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.count{margin:16px 0 9px;color:var(--sub);font-size:13px;font-weight:800}.customer-list{overflow:hidden}.customer{width:100%;min-height:86px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left}.customer+.customer{border-top:1px solid var(--line)}.customer-main{flex:1;min-width:0}.customer-head{display:flex;align-items:center;gap:8px}.customer-name{flex:1;font-size:16px;font-weight:850}.pill{height:25px;padding:0 8px;border-radius:7px;background:rgba(67,137,255,.15);color:#82b1ff;font-size:11px;font-weight:800;display:flex;align-items:center}.phone-no{margin-top:4px;color:var(--sub);font-size:14px}.customer-note{margin-top:6px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-form{display:grid;gap:18px}.field label{display:block;margin-bottom:8px;color:var(--sub);font-size:13px;font-weight:800}.switch-row{height:60px;padding:0 16px;display:flex;align-items:center}.switch-row span{flex:1;font-size:14px;font-weight:750}.bottom-action{height:78px;flex:none;padding:12px 20px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2fr;gap:10px;background:var(--surface);border-top:1px solid var(--line)}.bottom-action button{height:54px}.menu-label{margin:27px 0 10px;color:var(--sub);font-size:13px;font-weight:800}.profile{padding:17px 16px;display:flex;align-items:center;gap:13px}.avatar{width:42px;height:42px;border-radius:13px;background:var(--blue);display:grid;place-items:center;font-weight:900}.spacer{height:14px}
    @media(max-width:540px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;min-height:620px;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
<div class="phone">
  <div class="preview-chip" id="previewChip">UI 미리보기 · 실제 기능 없음</div>
  <section class="screen login active" id="loginScreen">
    <div class="brand">P</div><p class="eyebrow">페이지로 콜링크</p><h1>통화 후 고객 응대를<br>놓치지 마세요</h1><p class="desc">설치 없이 앱 디자인을 확인하는 미리보기입니다.</p>
    <div class="login-form"><input class="input" value="demo@pagero.kr"><input class="input" type="password" value="12345678"><button class="primary" id="demoLogin">미리보기 로그인</button></div><p class="login-note">실제 로그인이나 문자 기능은 작동하지 않습니다.</p>
  </section>
  <section class="screen" id="appScreen">
    <header class="appbar root" id="rootHeader"><div class="appbar-title">콜링크</div></header><main class="scroll" id="mainScroll"></main>
    <nav class="bottom-nav"><button class="nav-btn active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9h-6v-7H9v7H3Z"/></svg>홈</button><button class="nav-btn" data-tab="messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4Z"/><path d="M8 9h8M8 12h6"/></svg>메시지</button><button class="nav-btn" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>발송내역</button><button class="nav-btn" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>전체</button></nav>
  </section>
  <section class="screen" id="detailScreen"><header class="appbar"><button class="icon-btn" id="detailBack"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="appbar-title" id="detailTitle">상세</div><button class="icon-btn" id="detailAction"></button></header><main class="scroll" id="detailContent" style="padding-bottom:30px"></main><div id="detailBottom"></div></section>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const screens={login:$('#loginScreen'),app:$('#appScreen'),detail:$('#detailScreen')};let activeTab='home',lastTab='home',filter='all';const customers=[{name:'김민수',phone:'010-1234-5678',group:'신규 문의',memo:'오늘 오후 재통화 예정',status:'발송 가능'},{name:'박지현',phone:'010-8821-3490',group:'기존 고객',memo:'크루즈 상품 상담',status:'발송 가능'},{name:'이서준',phone:'010-4402-1187',group:'VIP',memo:'견적서 전달 완료',status:'발송 가능'},{name:'최유진',phone:'010-9301-6624',group:'미지정',memo:'수신거부 요청',status:'수신거부'},{name:'정하늘',phone:'010-7281-0049',group:'신규 문의',memo:'예약 일정 확인 필요',status:'발송 가능'}];
function show(name){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[name].classList.add('active')}
function setTab(tab){activeTab=lastTab=tab;show('app');$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const h=$('#rootHeader'),m=$('#mainScroll');h.innerHTML=`<div class="appbar-title">${tab==='home'?'콜링크':tab==='messages'?'메시지':tab==='history'?'발송내역':'전체'}</div>`;m.innerHTML=tab==='home'?homeHtml():tab==='messages'?messagesHtml():tab==='history'?historyHtml():moreHtml();m.scrollTop=0;bindRoot(tab)}
function homeHtml(){return `<p class="eyebrow">오늘의 콜링크</p><div class="hero"><h1>자동문자가 정상<br>작동 중이에요</h1><div class="toggle"></div></div><button class="line-link"><span class="dot"></span><b>SKT</b> 010-12**-56** <span class="chev">›</span></button><div class="card stats"><div class="stat"><b>12</b><span>발송 완료</span></div><div class="stat"><b>0</b><span>실패</span></div><div class="stat"><b>2</b><span>수동 대기</span></div></div><div class="section-label">빠른 메뉴</div><div class="quick"><button data-tabgo="messages">▤<br>템플릿</button><button data-open="customers">♙<br>고객</button><button data-open="bulk">▦<br>단체문자</button></div><div class="section-label">최근 활동</div><div class="card list-card"><button class="row"><div class="row-main"><div class="row-title">김민수 · 통화 완료 문자</div><div class="row-sub">방금 전 · 발송 완료</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">박지현 · 부재중 문자</div><div class="row-sub">12분 전 · 발송 완료</div></div><span class="chev">›</span></button></div>`}
function messagesHtml(){return `<div class="tabs"><button class="tab active">받은 전화</button><button class="tab">부재중·거절</button><button class="tab">내가 건 전화</button></div><div class="spacer"></div>${[['통화 완료 메시지','자동 발송','안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.'],['부재중·거절 메시지','자동 발송','전화를 받지 못했습니다. 확인 후 다시 연락드리겠습니다.'],['발신 통화 메시지','수동 확인','방금 전화드린 페이지로입니다. 상담 내용은 아래 링크에서 확인해주세요.']].map(x=>`<button class="card message-card" data-message="${x[0]}"><div class="message-top"><h3>${x[0]}</h3><span class="badge">${x[1]}</span><span class="chev">›</span></div><p class="message-preview">${x[2]}</p></button>`).join('')}<div class="section-label">저장된 템플릿</div><div class="card list-card"><button class="row"><div class="row-main"><div class="row-title">기본 상담 템플릿</div><div class="row-sub">이미지 포함 · 링크 사용</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">부재중 간단 안내</div><div class="row-sub">문자 전용</div></div><span class="chev">›</span></button></div>`}
function historyHtml(){return `<div class="filters"><button class="filter active">오늘</button><button class="filter">7일</button><button class="filter">30일</button></div><div class="card stats" style="margin-top:14px"><div class="stat"><b>12</b><span>완료</span></div><div class="stat"><b>0</b><span>실패</span></div><div class="stat"><b>2</b><span>제외</span></div></div><div class="section-label">발송 목록</div><div class="card list-card"><button class="row"><div class="row-main"><div class="row-title">통화 완료 · 김민수</div><div class="row-sub">오늘 18:42 · 발송 완료</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">부재중 · 박지현</div><div class="row-sub">오늘 17:10 · 발송 완료</div></div><span class="chev">›</span></button></div>`}
function moreHtml(){return `<div class="card profile"><div class="avatar">김</div><div class="row-main"><div class="row-title">김도윤님</div><div class="row-sub">페이지로 콜링크 베타</div></div><span class="chev">›</span></div><div class="menu-label">고객 관리</div><div class="card list-card"><button class="row" data-open="customers"><div class="row-main"><div class="row-title">고객 목록</div><div class="row-sub">고객 5명</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">고객 그룹</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">발송 제외번호</div></div><span class="chev">›</span></button></div><div class="menu-label">발송 서비스</div><div class="card list-card"><button class="row" data-open="bulk"><div class="row-main"><div class="row-title">단체문자 보내기</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">예약문자 관리</div></div><span class="chev">›</span></button></div>`}
function bindRoot(tab){$$('[data-tabgo]').forEach(b=>b.onclick=()=>setTab(b.dataset.tabgo));$$('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));$$('[data-message]').forEach(b=>b.onclick=()=>openDetail('message',b.dataset.message));if(tab==='messages')$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function actionIcon(type){return type==='add'?'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>':''}
function openDetail(type,title=''){show('detail');$('#detailBottom').innerHTML='';$('#detailAction').innerHTML='';$('#detailAction').onclick=null;if(type==='customers')renderCustomers();if(type==='customer')renderCustomer(title);if(type==='message')renderMessage(title);if(type==='bulk')renderBulk()}
function renderCustomers(){$('#detailTitle').textContent='고객';$('#detailAction').innerHTML=actionIcon('add');$('#detailAction').setAttribute('aria-label','고객 추가');$('#detailAction').onclick=()=>openDetail('customer','');$('#detailContent').innerHTML=`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="customerSearch" placeholder="이름 또는 전화번호 검색"></div><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="active">발송 가능</button><button class="filter" data-filter="optout">수신거부</button></div><div class="count" id="customerCount"></div><div class="card customer-list" id="customerList"></div>`;renderRows();$('#customerSearch').oninput=renderRows;$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderRows()})}
function renderRows(){const q=($('#customerSearch')?.value||'').trim();const list=customers.filter(c=>(filter==='all'||filter==='active'&&c.status==='발송 가능'||filter==='optout'&&c.status==='수신거부')&&(!q||c.name.includes(q)||c.phone.includes(q)));$('#customerCount').textContent=`${filter==='all'?'전체 고객':filter==='active'?'발송 가능':'수신거부'} ${list.length}명`;$('#customerList').innerHTML=list.map(c=>`<button class="customer" data-customer="${c.name}"><div class="customer-main"><div class="customer-head"><div class="customer-name">${c.name}</div><span class="pill" style="${c.status==='수신거부'?'background:#2b2d31;color:var(--sub)':''}">${c.status}</span></div><div class="phone-no">${c.phone}</div><div class="customer-note">${c.group} · ${c.memo}</div></div><span class="chev">›</span></button>`).join('');$$('[data-customer]').forEach(b=>b.onclick=()=>openDetail('customer',b.dataset.customer))}
function renderCustomer(name){const c=customers.find(x=>x.name===name);$('#detailTitle').textContent=c?'고객 정보':'고객 추가';$('#detailAction').innerHTML='';$('#detailContent').innerHTML=`<div class="detail-form"><div class="field"><label>고객명</label><input class="input" value="${c?.name||''}" placeholder="고객명 입력"></div><div class="field"><label>휴대폰 번호</label><input class="input" value="${c?.phone||''}" placeholder="010-0000-0000"></div><div class="field"><label>고객 그룹</label><button class="input" style="text-align:left">${c?.group||'그룹 미지정'} <span style="float:right;color:var(--muted)">⌄</span></button></div><div class="field"><label>메모</label><textarea class="input" placeholder="상담 내용이나 고객 정보를 입력하세요">${c?.memo||''}</textarea></div><div class="card switch-row"><span>이 고객에게 메시지 발송하지 않기</span><div class="toggle" style="${c?.status==='수신거부'?'':'background:#3a3d42'}"></div></div></div>`;$('#detailBottom').innerHTML='<div class="bottom-action"><button class="secondary" id="cancel">취소</button><button class="primary" id="save">고객 저장</button></div>';$('#cancel').onclick=$('#save').onclick=renderCustomers}
function renderMessage(title){$('#detailTitle').textContent=title;$('#detailContent').innerHTML=`<div class="detail-form"><div class="field"><label>발송 방식</label><div class="filters" style="margin-top:0"><button class="filter active">자동 발송</button><button class="filter">수동 확인</button><button class="filter">사용 안 함</button></div></div><div class="field"><label>문자 내용</label><textarea class="input">안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.</textarea></div><div class="field"><label>랜딩페이지</label><input class="input" value="https://pagero.kr"></div></div>`;$('#detailBottom').innerHTML='<div class="bottom-action" style="grid-template-columns:1fr"><button class="primary" id="saveMessage">저장</button></div>';$('#saveMessage').onclick=()=>setTab('messages')}
function renderBulk(){$('#detailTitle').textContent='단체문자';$('#detailContent').innerHTML='<div class="tabs"><button class="tab active">1 수신자</button><button class="tab">2 메시지</button><button class="tab">3 확인</button></div><div class="section-label">발송 대상</div><div class="card list-card"><button class="row"><div class="row-main"><div class="row-title">전체 고객</div><div class="row-sub">최종 발송 29명</div></div><span class="chev">›</span></button></div>';$('#detailBottom').innerHTML='<div class="bottom-action" style="grid-template-columns:1fr"><button class="primary">다음</button></div>'}
$('#demoLogin').onclick=()=>{$('#previewChip').classList.add('hidden');setTab('home')};$$('.nav-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#detailBack').onclick=()=>setTab(lastTab);
</script>
