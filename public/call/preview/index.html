<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111214">
  <title>페이지로 콜링크 UI 미리보기</title>
  <style>
    :root{
      color-scheme:dark;
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --bg:#111214;--surface:#1d1f22;--surface2:#25282c;--line:#32353a;
      --text:#f5f6f7;--sub:#a7abb2;--muted:#6e737b;--blue:#4389ff;--blue2:#276fe8;
      --danger:#ff7d7d;--safe-bottom:max(18px,env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#08090a;color:var(--text)}
    body{display:grid;place-items:center;padding:22px}
    button,input,textarea{font:inherit}
    button{border:0;color:inherit;cursor:pointer}
    .phone{position:relative;width:min(420px,100%);height:min(880px,calc(100vh - 44px));min-height:650px;background:var(--bg);overflow:hidden;border:1px solid #292c31;border-radius:34px;box-shadow:0 30px 90px rgba(0,0,0,.48)}
    .screen{position:absolute;inset:0;display:none;background:var(--bg)}
    .screen.active{display:flex;flex-direction:column}
    .scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:18px 20px 108px;scrollbar-width:none}
    .scroll::-webkit-scrollbar{display:none}
    .login{padding:40px 24px 28px;justify-content:center}
    .brand-mark{width:50px;height:50px;border-radius:15px;background:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:900;margin-bottom:22px}
    .eyebrow{margin:0 0 8px;color:var(--sub);font-size:13px}
    h1,h2,h3,p{margin:0}
    h1{font-size:29px;line-height:1.22;letter-spacing:-.04em}
    h2{font-size:23px;letter-spacing:-.035em}
    h3{font-size:17px;letter-spacing:-.02em}
    .desc{margin-top:9px;color:var(--sub);font-size:14px;line-height:1.55}
    .login-form{margin-top:30px;display:grid;gap:12px}
    .input{width:100%;height:54px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);padding:0 15px;color:var(--text);outline:none}
    .input:focus{border-color:var(--blue)}
    .primary{height:54px;border-radius:11px;background:var(--blue);font-weight:800;font-size:15px}
    .secondary{height:52px;border-radius:11px;background:var(--surface2);color:var(--text);font-weight:750}
    .login-note{margin-top:15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}
    .appbar{height:66px;display:flex;align-items:center;padding:0 12px 0 8px;flex:none;background:rgba(17,18,20,.96);border-bottom:1px solid rgba(50,53,58,.55)}
    .appbar.homebar{height:54px;border-bottom:0;padding:0 20px}
    .appbar-title{flex:1;font-size:22px;font-weight:850;letter-spacing:-.035em}
    .icon-btn{width:48px;height:48px;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--text)}
    .icon-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .text-btn{height:46px;padding:0 12px;background:transparent;color:var(--sub);font-weight:800}
    .section-label{margin-top:28px;margin-bottom:12px;font-size:18px;font-weight:850;letter-spacing:-.025em}
    .hero-title{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
    .hero-title h1{flex:1;font-size:28px}
    .toggle{position:relative;width:50px;height:30px;border-radius:20px;background:var(--blue);flex:none;margin-top:4px}
    .toggle:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:white;right:3px;top:3px;box-shadow:0 2px 7px rgba(0,0,0,.25)}
    .line-link{margin-top:14px;display:flex;align-items:center;gap:8px;color:var(--sub);font-size:14px;background:transparent;padding:0}
    .line-link strong{color:var(--text)}
    .chev{margin-left:auto;color:var(--muted);font-size:24px;line-height:1}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:15px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;padding:18px 0}
    .stat{text-align:center;min-width:0}
    .stat+.stat{border-left:1px solid var(--line)}
    .stat b{display:block;font-size:23px;margin-bottom:6px}
    .stat span{font-size:12px;color:var(--sub)}
    .queue{margin-top:12px;width:100%;min-height:58px;padding:0 16px;display:flex;align-items:center;border-radius:12px;background:var(--blue);font-weight:800}
    .queue small{display:block;margin-top:3px;font-weight:500;opacity:.82}
    .queue .chev{color:white}
    .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .quick button{height:84px;background:transparent;border-radius:12px;color:var(--text);font-weight:750}
    .quick svg{display:block;width:27px;height:27px;margin:0 auto 9px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .list-card{overflow:hidden}
    .row{width:100%;min-height:68px;padding:0 16px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left}
    .row+.row{border-top:1px solid var(--line)}
    .row-main{flex:1;min-width:0}
    .row-title{font-size:15px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-sub{margin-top:5px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-meta{text-align:right;color:var(--sub);font-size:12px;flex:none}
    .status-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}
    .status-dot.off{background:var(--muted)}
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:82px;padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(24,25,28,.98);border-top:1px solid var(--line);z-index:20}
    .nav-btn{background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding-top:9px}
    .nav-btn.active{color:var(--text)}
    .nav-btn svg{display:block;width:28px;height:28px;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .tabs{display:flex;gap:7px;margin:12px 20px 0;overflow:auto;scrollbar-width:none}
    .tab{height:42px;padding:0 16px;border-radius:10px;background:var(--surface2);color:var(--sub);font-weight:750;white-space:nowrap}
    .tab.active{background:var(--blue);color:white}
    .message-card{padding:17px 16px}
    .message-card+.message-card{margin-top:10px}
    .message-top{display:flex;align-items:center;gap:10px}
    .badge{padding:5px 8px;border-radius:7px;background:rgba(67,137,255,.14);color:#82b1ff;font-size:11px;font-weight:800}
    .message-preview{margin-top:13px;color:var(--sub);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .search{position:relative;margin-top:2px}
    .search svg{position:absolute;left:15px;top:15px;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2}
    .search input{padding-left:46px}
    .filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .filter{height:44px;border-radius:10px;background:var(--surface2);color:var(--sub);font-size:13px;font-weight:750}
    .filter.active{background:var(--blue);color:white}
    .count{margin:16px 0 9px;color:var(--sub);font-size:13px;font-weight:750}
    .customer-list{overflow:hidden}
    .customer{min-height:86px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left;width:100%}
    .customer+.customer{border-top:1px solid var(--line)}
    .customer-main{flex:1;min-width:0}
    .customer-head{display:flex;align-items:center;gap:8px}
    .customer-name{flex:1;font-size:16px;font-weight:820;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pill{height:25px;padding:0 8px;border-radius:7px;background:rgba(67,137,255,.14);color:#82b1ff;font-size:11px;font-weight:800;display:flex;align-items:center}
    .phone-no{margin-top:4px;color:var(--sub);font-size:14px}
    .customer-note{margin-top:6px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .customer .chev{font-size:26px}
    .detail-form{display:grid;gap:18px}
    .field label{display:block;margin-bottom:8px;color:var(--sub);font-size:13px;font-weight:750}
    textarea.input{height:112px;padding-top:14px;resize:none}
    .switch-row{height:60px;padding:0 16px;display:flex;align-items:center;margin-top:2px}
    .switch-row span{flex:1;font-size:14px;font-weight:750}
    .bottom-action{height:78px;padding:12px 20px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2fr;gap:10px;background:var(--surface);border-top:1px solid var(--line)}
    .bottom-action button{height:54px}
    .log-row{padding:15px 16px}
    .log-top{display:flex;gap:8px;align-items:center}
    .log-top .row-title{flex:1}
    .ok{color:#82b1ff;font-size:12px;font-weight:800}
    .menu-group{overflow:hidden;margin-top:12px}
    .menu-label{margin-top:27px;color:var(--sub);font-size:13px;font-weight:800}
    .profile{padding:17px 16px;display:flex;align-items:center;gap:13px}
    .avatar{width:42px;height:42px;border-radius:13px;background:var(--blue);display:grid;place-items:center;font-weight:900}
    .profile-text{flex:1}.profile-name{font-size:17px;font-weight:850}.profile-sub{margin-top:4px;color:var(--sub);font-size:12px}
    .preview-chip{position:absolute;right:14px;top:14px;z-index:50;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);font-size:11px;color:#d8dadd;pointer-events:none}
    @media(max-width:540px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;min-height:620px;border:0;border-radius:0;box-shadow:none}.preview-chip{top:max(8px,env(safe-area-inset-top));right:10px}}
  </style>
</head>
<body>
<div class="phone" id="phone">
  <div class="preview-chip">UI 미리보기 · 실제 기능 없음</div>

  <section class="screen login active" id="loginScreen">
    <div class="brand-mark">P</div>
    <p class="eyebrow">페이지로 콜링크</p>
    <h1>통화 후 고객 응대를<br>놓치지 마세요</h1>
    <p class="desc">이 페이지는 디자인 검수 전용입니다.<br>입력값은 저장되거나 서버로 전송되지 않습니다.</p>
    <div class="login-form">
      <input class="input" value="demo@pagero.kr" aria-label="이메일">
      <input class="input" type="password" value="12345678" aria-label="비밀번호">
      <button class="primary" id="demoLogin">미리보기 로그인</button>
    </div>
    <p class="login-note">아무 정보나 입력해도 됩니다.<br>버튼을 누르면 로그인 후 화면으로 이동합니다.</p>
  </section>

  <section class="screen" id="appScreen">
    <header class="appbar homebar"><strong style="font-size:16px">콜링크</strong></header>
    <main class="scroll" id="mainScroll"></main>
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>홈</button>
      <button class="nav-btn" data-tab="messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4Z"/><path d="M8 9h8M8 12h6"/></svg>메시지</button>
      <button class="nav-btn" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>발송내역</button>
      <button class="nav-btn" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>전체</button>
    </nav>
  </section>

  <section class="screen" id="detailScreen">
    <header class="appbar">
      <button class="icon-btn" id="detailBack" aria-label="뒤로가기"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="appbar-title" id="detailTitle">상세</div>
      <button class="text-btn" id="detailRight"></button>
    </header>
    <main class="scroll" id="detailContent" style="padding-bottom:30px"></main>
    <div id="detailBottom"></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const screens={login:$('#loginScreen'),app:$('#appScreen'),detail:$('#detailScreen')};
let activeTab='home',lastTab='home',customerFilter='all';
const customers=[
  {name:'김민수',phone:'010-1234-5678',group:'신규 문의',memo:'오늘 오후 재통화 예정',status:'발송 가능'},
  {name:'박지현',phone:'010-8821-3490',group:'기존 고객',memo:'크루즈 상품 상담',status:'발송 가능'},
  {name:'이서준',phone:'010-4402-1187',group:'VIP',memo:'견적서 전달 완료',status:'발송 가능'},
  {name:'최유진',phone:'010-9301-6624',group:'미지정',memo:'수신거부 요청',status:'수신거부'},
  {name:'정하늘',phone:'010-7281-0049',group:'신규 문의',memo:'예약 일정 확인 필요',status:'발송 가능'}
];
function showScreen(name){Object.values(screens).forEach(v=>v.classList.remove('active'));screens[name].classList.add('active')}
function icon(type){const m={template:'<svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',customer:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-7 6-7s6 3 6 7"/><path d="M17 8h4M19 6v4"/></svg>',bulk:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4Z"/><path d="M8 9h8M8 12h6"/></svg>'};return m[type]||''}
function setTab(tab){activeTab=tab;lastTab=tab;showScreen('app');$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderTab(tab);$('#mainScroll').scrollTop=0}
function renderTab(tab){const main=$('#mainScroll');const header=$('#appScreen .appbar');header.className='appbar '+(tab==='home'?'homebar':'');
 if(tab==='home'){header.innerHTML='<strong style="font-size:16px">콜링크</strong>';main.innerHTML=homeHtml();bindHome()}
 if(tab==='messages'){header.innerHTML='<div class="appbar-title">메시지</div>';main.innerHTML=messagesHtml();bindMessageCards()}
 if(tab==='history'){header.innerHTML='<div class="appbar-title">발송내역</div>';main.innerHTML=historyHtml();bindHistory()}
 if(tab==='more'){header.innerHTML='<div class="appbar-title">전체</div>';main.innerHTML=moreHtml();bindMore()}
}
function homeHtml(){return `<p class="eyebrow">오늘의 콜링크</p><div class="hero-title"><h1>자동문자가 정상<br>작동 중이에요</h1><div class="toggle"></div></div><button class="line-link"><span class="status-dot"></span><strong>SKT</strong> 010-12**-56**<span class="chev">›</span></button><div class="card stats"><div class="stat"><b>12</b><span>발송 완료</span></div><div class="stat"><b>0</b><span>실패</span></div><div class="stat"><b>2</b><span>수동 대기</span></div></div><button class="queue"><span>수동 발송 대기 2건<small>확인 후 바로 발송할 수 있어요</small></span><span class="chev">›</span></button><div class="section-label">빠른 메뉴</div><div class="quick"><button data-go="messages">${icon('template')}템플릿</button><button data-detail="customers">${icon('customer')}고객</button><button data-detail="bulk">${icon('bulk')}단체문자</button></div><div class="section-label">최근 활동</div><div class="card list-card"><button class="row"><span class="status-dot"></span><div class="row-main"><div class="row-title">김민수 · 통화 완료 문자</div><div class="row-sub">010-12**-56**</div></div><span class="row-meta">방금 전<br>완료</span></button><button class="row"><span class="status-dot"></span><div class="row-main"><div class="row-title">박지현 · 부재중 문자</div><div class="row-sub">010-88**-34**</div></div><span class="row-meta">12분 전<br>완료</span></button><button class="row"><span class="status-dot off"></span><div class="row-main"><div class="row-title">최유진 · 발송 제외</div><div class="row-sub">수신거부 고객</div></div><span class="row-meta">31분 전<br>제외</span></button></div>`}
function bindHome(){$$('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));$$('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail))}
function messagesHtml(){return `<div class="tabs"><button class="tab active">받은 전화</button><button class="tab">부재중·거절</button><button class="tab">내가 건 전화</button></div><div style="height:14px"></div><button class="card message-card" data-message="통화 완료 메시지"><div class="message-top"><h3 style="flex:1;text-align:left">통화 완료 메시지</h3><span class="badge">자동 발송</span><span class="chev">›</span></div><p class="message-preview">안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.</p></button><button class="card message-card" data-message="부재중·거절 메시지"><div class="message-top"><h3 style="flex:1;text-align:left">부재중·거절 메시지</h3><span class="badge">자동 발송</span><span class="chev">›</span></div><p class="message-preview">전화를 받지 못했습니다. 확인 후 다시 연락드리겠습니다.</p></button><button class="card message-card" data-message="발신 통화 메시지"><div class="message-top"><h3 style="flex:1;text-align:left">발신 통화 메시지</h3><span class="badge">수동 확인</span><span class="chev">›</span></div><p class="message-preview">방금 전화드린 페이지로입니다. 상담 내용은 아래 링크에서 확인해주세요.</p></button><div class="section-label">저장된 템플릿</div><div class="card list-card"><button class="row"><div class="row-main"><div class="row-title">기본 상담 템플릿</div><div class="row-sub">이미지 포함 · 링크 사용</div></div><span class="chev">›</span></button><button class="row"><div class="row-main"><div class="row-title">부재중 간단 안내</div><div class="row-sub">문자 전용</div></div><span class="chev">›</span></button></div>`}
function bindMessageCards(){$$('[data-message]').forEach(b=>b.onclick=()=>openDetail('message',b.dataset.message));$$('.tabs .tab').forEach(t=>t.onclick=()=>{$$('.tabs .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')})}
function historyHtml(){return `<div class="filter-grid" style="margin-top:2px"><button class="filter active">오늘</button><button class="filter">7일</button><button class="filter">30일</button></div><div class="card stats" style="margin-top:14px"><div class="stat"><b>12</b><span>완료</span></div><div class="stat"><b>0</b><span>실패</span></div><div class="stat"><b>2</b><span>제외</span></div></div><div class="section-label">발송 목록</div><div class="card list-card"><button class="row log-row" data-log><div class="row-main"><div class="log-top"><div class="row-title">통화 완료 · 김민수</div><span class="ok">발송 완료</span></div><div class="row-sub">오늘 18:42 · SKT · 자동</div></div><span class="chev">›</span></button><button class="row log-row" data-log><div class="row-main"><div class="log-top"><div class="row-title">부재중 · 박지현</div><span class="ok">발송 완료</span></div><div class="row-sub">오늘 17:10 · SKT · 자동</div></div><span class="chev">›</span></button><button class="row log-row" data-log><div class="row-main"><div class="log-top"><div class="row-title">발신 통화 · 최유진</div><span style="color:var(--sub);font-size:12px;font-weight:800">발송 제외</span></div><div class="row-sub">오늘 16:22 · 수신거부</div></div><span class="chev">›</span></button></div>`}

function openDetail(type,title=''){showScreen('detail');$('#detailBottom').innerHTML='';$('#detailRight').textContent='';$('#detailContent').style.paddingBottom='30px';

function renderCustomers(){const q='';$('#detailTitle').textContent='고객';$('#detailRight').textContent='＋';$('#detailRight').onclick=()=>openDetail('customer','고객 추가');$('#detailContent').innerHTML=`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="customerSearch" placeholder="이름 또는 전화번호 검색"></div><div class="filter-grid"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="active">발송 가능</button><button class="filter" data-filter="optout">수신거부</button></div><div class="count" id="customerCount"></div><div class="card customer-list" id="customerList"></div>`;renderCustomerRows();$('#customerSearch').oninput=renderCustomerRows;$$('[data-filter]').forEach(b=>b.onclick=()=>{customerFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderCustomerRows()})}
function renderCustomerRows(){const query=($('#customerSearch')?.value||'').trim();const list=customers.filter(c=>(customerFilter==='all'||(customerFilter==='active'&&c.status==='발송 가능')||(customerFilter==='optout'&&c.status==='수신거부'))&&(!query||c.name.includes(query)||c.phone.includes(query)));$('#customerCount').textContent=`${customerFilter==='all'?'전체 고객':customerFilter==='active'?'발송 가능':'수신거부'} ${list.length}명`;$('#customerList').innerHTML=list.map((c,i)=>`<button class="customer" data-customer="${customers.indexOf(c)}"><div class="customer-main"><div class="customer-head"><div class="customer-name">${c.name}</div><span class="pill" style="${c.status==='수신거부'?'background:#2b2d31;color:var(--sub)':''}">${c.status}</span></div><div class="phone-no">${c.phone}</div><div class="customer-note">${c.group} · ${c.memo}</div></div><span class="chev">›</span></button>`).join('')||'<div style="padding:50px 20px;text-align:center;color:var(--sub)">조건에 맞는 고객이 없습니다.</div>';$$('[data-customer]').forEach(b=>b.onclick=()=>openDetail('customer',customers[+b.dataset.customer].name))}
function renderCustomerDetail(title){const c=customers.find(x=>x.name===title);$('#detailTitle').textContent=c?'고객 정보':'고객 추가';$('#detailRight').textContent=c?'삭제':'';$('#detailContent').style.paddingBottom='18px';$('#detailContent').innerHTML=`<div class="detail-form"><div class="field"><label>고객명</label><input class="input" value="${c?.name||''}" placeholder="고객명 입력"></div><div class="field"><label>휴대폰 번호</label><input class="input" value="${c?.phone||''}" placeholder="010-0000-0000"></div><div class="field"><label>고객 그룹</label><button class="input" style="text-align:left">${c?.group||'그룹 미지정'} <span style="float:right;color:var(--muted)">⌄</span></button></div><div class="field"><label>메모</label><textarea class="input" placeholder="상담 내용이나 고객 정보를 입력하세요">${c?.memo||''}</textarea></div><div class="card switch-row"><span>이 고객에게 메시지 발송하지 않기</span><div class="toggle" style="${c?.status==='수신거부'?'':'background:#3a3d42'}"></div></div></div>`;$('#detailBottom').innerHTML='<div class="bottom-action"><button class="secondary" id="cancelDetail">취소</button><button class="primary" id="saveDetail">고객 저장</button></div>';$('#cancelDetail').onclick=()=>openDetail('customers');$('#saveDetail').onclick=()=>openDetail('customers')}
function renderMessageDetail(title){$('#detailTitle').textContent=title;$('#detailRight').textContent='';$('#detailContent').innerHTML=`<div class="detail-form"><div class="field"><label>발송 방식</label><div class="filter-grid" style="margin-top:0"><button class="filter active">자동 발송</button><button class="filter">수동 확인</button><button class="filter">사용 안 함</button></div></div><div class="field"><label>이미지</label><div class="card" style="height:145px;display:grid;place-items:center;color:var(--sub)">메시지 이미지 미리보기</div></div><div class="field"><label>문자 내용</label><textarea class="input" style="height:150px">안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.</textarea></div><div class="field"><label>랜딩페이지</label><input class="input" value="https://pagero.kr"></div><div class="field"><label>실제 전송 미리보기</label><div class="card" style="padding:16px;color:var(--sub);font-size:13px;line-height:1.6">안녕하세요. 방금 상담드린 내용은 아래 페이지에서 확인하실 수 있습니다.<br><br>https://pagero.kr</div></div></div>`;$('#detailBottom').innerHTML='<div class="bottom-action" style="grid-template-columns:1fr"><button class="primary" id="saveMessage">저장</button></div>';$('#saveMessage').onclick=()=>setTab('messages')}

function renderBulk(){$('#detailTitle').textContent='단체문자';$('#detailContent').innerHTML=`<div class="tabs" style="margin:0 0 20px"><button class="tab active">1 수신자</button><button class="tab">2 메시지</button><button class="tab">3 확인</button></div><div class="detail-form"><div class="field"><label>발송 대상</label><button class="input" style="text-align:left">전체 고객 <span style="float:right;color:var(--muted)">32명</span></button></div><div class="field"><label>고객 그룹</label><button class="input" style="text-align:left">전체 그룹 <span style="float:right;color:var(--muted)">⌄</span></button></div><div class="card stats" style="margin-top:0"><div class="stat"><b>32</b><span>전체</span></div><div class="stat"><b>3</b><span>제외</span></div><div class="stat"><b>29</b><span>최종 발송</span></div></div></div>`;$('#detailBottom').innerHTML='<div class="bottom-action" style="grid-template-columns:1fr"><button class="primary">다음</button></div>'}
