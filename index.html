<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="naver-site-verification" content="2b53120b247214ee096be40c7c15795e42a8a24c" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>페이지로</title>
  <script>
    (() => {
      if (location.hostname !== 'call.pagero.kr' || location.pathname.startsWith('/api/')) return;
      const clean = location.pathname.replace(/\/+$/, '') || '/';
      const routes = {
        '/': '/home-v7',
        '/home': '/home-v7',
        '/home-v4': '/home-v7',
        '/home-v5': '/home-v7',
        '/home-v6': '/home-v7',
        '/home-v7': '/home-v7',
        '/login': '/call/index.html',
        '/signup': '/call/index.html',
        '/privacy': '/call/privacy/index.html',
        '/terms': '/call/terms/index.html',
        '/subscribe': '/call/subscribe/index.html',
        '/preview': '/call/preview/index.html',
      };
      const target = routes[clean];
      if (target && location.pathname !== target) {
        location.replace(`${target}${location.hash}`);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
